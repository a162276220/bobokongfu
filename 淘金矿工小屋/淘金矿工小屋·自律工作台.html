  function trendSvg(recs) {
    const pts = recs.slice(0, 12).slice().reverse();   // 旧 -> 新
    if (pts.length < 2) return '<div class="side-empty">记满 2 次就能看到趋势线</div>';
    const W = 320, H = 120, PAD = 24;
    const ws = pts.map(r => r.weight || 0), bfs = pts.map(r => (r.bodyfat == null ? null : r.bodyfat));
    const wMin = Math.min.apply(null, ws), wMax = Math.max.apply(null, ws);
    const bfVals = bfs.filter(v => v != null);
    const bMin = bfVals.length ? Math.min.apply(null, bfVals) : 0;
    const bMax = bfVals.length ? Math.max.apply(null, bfVals) : 1;
    const X = i => PAD + i * (W - PAD * 2) / (pts.length - 1);
    const Yw = v => H - PAD - ((v - wMin) / ((wMax - wMin) || 1)) * (H - PAD * 2);
    const Yb = v => H - PAD - ((v - bMin) / ((bMax - bMin) || 1)) * (H - PAD * 2);
    const wLine = pts.map((r, i) => X(i).toFixed(1) + ',' + Yw(r.weight || 0).toFixed(1)).join(' ');
    const bfPts = bfs.map((v, i) => ({ v: v, i: i })).filter(o => o.v != null);
    const bLine = bfPts.map((o, i) => X(o.i).toFixed(1) + ',' + Yb(o.v).toFixed(1)).join(' ');
    const dots = pts.map((r, i) => '<circle cx="' + X(i).toFixed(1) + '" cy="' + Yw(r.weight || 0).toFixed(1) + '" r="2.6" fill="#FF6D24"/>').join('')
      + bfPts.map(o => '<circle cx="' + X(o.i).toFixed(1) + '" cy="' + Yb(o.v).toFixed(1) + '" r="2.4" fill="#8A7BE8"/>').join('');
    return `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
        <line x1="${PAD}" y1="${H - PAD}" x2="${W - PAD}" y2="${H - PAD}" stroke="rgba(39,53,47,.18)"/>
        <polyline points="${wLine}" fill="none" stroke="#FF6D24" stroke-width="2"/>
        ${bfPts.length ? '<polyline points="' + bLine + '" fill="none" stroke="#8A7BE8" stroke-width="2" stroke-dasharray="4 3"/>' : ''}
        ${dots}
        <text x="${PAD}" y="12" font-size="10" fill="#FF6D24">● 体重（斤）</text>
        <text x="${PAD + 78}" y="12" font-size="10" fill="#8A7BE8">● 体脂率（%）</text>
      </svg>`;
  }

  function ensureTodayWords() {
    const state = getState();

    if (state.tasks.vocabulary.todayWordsDate !== today || !state.tasks.vocabulary.todayWords || state.tasks.vocabulary.todayWords.length === 0) {
      const learned = new Set(state.tasks.vocabulary.words.map(w => w.word));
      const available = WORD_BANK.filter(w => !learned.has(w.word));
      const pool = available.length >= 5 ? available : WORD_BANK;
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      state.tasks.vocabulary.todayWords = shuffled.slice(0, 5);
      state.tasks.vocabulary.todayWordsDate = today;
      saveState();
    }
  }

  function showToast(message, type = 'info', duration = 3000) {

    toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${esc(message)}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';

  /* ===== 图标渲染：emoji 原样输出，图片路径输出 <img>，桌宠输出 pet-stage 占位 ===== */
  function isImgIcon(ic) { return typeof ic === 'string' && /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(ic); }
  function isDeskpetIcon(ic) { return typeof ic === 'string' && ic.indexOf('deskpet:') === 0; }
  function iconHtml(ic, size) {
    if (!ic) return '';
    if (isDeskpetIcon(ic)) {
      const petId = ic.slice('deskpet:'.length);
      return `<div class="pet-stage" data-petid="${petId}" style="width:${size}px;height:${size}px;margin:0 auto;"></div>`;
    }
    if (isImgIcon(ic)) {
      return `<img src="${ic}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;display:block;margin:0 auto;">`;
    }
    return ic;
  }
  /* 纯文本场景（如 <option> 不能放 <img>）：图片/桌宠图标返回空串，避免把路径当文字显示 */
  function iconText(ic) { return (typeof ic === 'string' && !isImgIcon(ic) && !isDeskpetIcon(ic)) ? ic : ''; }
  function formatDate(dateStr) { if (!dateStr) return ''; const d = new Date(dateStr); return `${d.getMonth()+1}月${d.getDate()}日`; }
  function formatTime(isoStr) { if (!isoStr) return ''; const d = new Date(isoStr); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  /* 转义用户可输入的文本（宠物名等）再拼进 innerHTML，避免把标签当结构渲染 */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 图片转 Base64（仅本地存储，不渲染外部图片）
  function handleImageUpload(inputId, callback) {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { showToast('图片太大了，请选择2MB以下的图片', 'warning'); return; }
      const reader = new FileReader();
      reader.onload = function(ev) { callback(ev.target.result); };
      reader.readAsDataURL(file);
    };
  }

function submitDiet() {
  const meal = document.getElementById('dietMeal').value;
  const food = document.getElementById('dietFood').value.trim();
  const note = document.getElementById('dietNote').value.trim();
  const manualCal = document.getElementById('dietManualCal').value;
  const imageArea = document.getElementById('dietUploadArea');
  const image = imageArea.dataset.image || '';

  if (!food) {
    showToast('请输入食物名称！', 'warning');
    return;
  }

  // 自动估算热量
  let calories = 0;
  if (manualCal) {
    calories = parseInt(manualCal);
  } else {
    const foods = food.split(/[,，、]/).map(f => f.trim());
    foods.forEach(f => {
      // 模糊匹配
      let matched = false;
      for (const key in FOOD_CALORIES) {
        if (f.includes(key) || key.includes(f)) {
          calories += FOOD_CALORIES[key];
          matched = true;
          break;
        }
      }
      if (!matched) calories += 150; // 默认估算
    });
  }

  updateState(state => {
    state.tasks.diet.records.push({
      date: new Date().toISOString(),
      meal, food, note, calories, image,
    });
  });

  showToast(`🍚 记录成功！估算热量 ${calories} kcal`, 'success');
  navTo('diet');
}

function init_exercise() {}

function submitExercise() {
  const type = document.getElementById('exType').value;
  const duration = parseInt(document.getElementById('exDuration').value);
  const weight = parseInt(document.getElementById('exWeight').value);
  const feeling = document.getElementById('exFeeling').value;
  const note = document.getElementById('exNote').value.trim();

  if (!duration || duration < 1) {
    showToast('请输入有效的运动时长！', 'warning');
    return;
  }

  // 计算消耗热量：每分钟消耗 * 时长 * (体重/60) 调整
  const baseRate = EXERCISE_CALORIES[type] || 5;
  const caloriesBurned = Math.round(baseRate * duration * (weight / 60));

  updateState(state => {
    state.tasks.exercise.records.push({
      date: new Date().toISOString(),
      type, duration, weight, feeling, note, caloriesBurned,
    });
  });

  showToast(`🏃 记录成功！消耗 ${caloriesBurned} kcal`, 'success');
  navTo('exercise');
}

function selectAccCategory(cat) {
  _accSelectedCategory = cat;

    if (el.dataset.cat === cat) {
      el.style.background = 'rgba(255, 109, 36,0.15)';

function revealWord(index) {
  const meaning = document.getElementById(`wordMeaning_${index}`);
  const actions = document.getElementById(`wordActions_${index}`);
  if (meaning.style.display === 'none') {
    meaning.style.display = 'block';
    actions.innerHTML = `
      <button class="btn btn-outline btn-sm" onclick="revealWord(${index})">🙈 隐藏释义</button>
      <button class="btn btn-gold btn-sm" onclick="markWordMemorized(${index})">✅ 已记住</button>
    `;
  } else {
    meaning.style.display = 'none';
    actions.innerHTML = `<button class="btn btn-outline btn-sm" onclick="revealWord(${index})">👀 查看释义</button>`;
  }
}

function markWordMemorized(index) {
  const state = getState();
  const word = state.tasks.vocabulary.todayWords[index];
  if (!word) return;

  const existIdx = state.tasks.vocabulary.words.findIndex(w => w.word === word.word);
  if (existIdx >= 0) {
    state.tasks.vocabulary.words[existIdx].memorized = true;
  } else {
    state.tasks.vocabulary.words.push({
      ...word,
      memorized: true,
      date: new Date().toISOString(),
    });
  }
  saveState();
  showToast(`✅ "${word.word}" 已加入单词库！`, 'success');
  navTo('vocabulary');
}

function memorizeAllWords() {
  const state = getState();
  const todayWords = state.tasks.vocabulary.todayWords || [];
  let added = 0;

  todayWords.forEach(word => {
    const existIdx = state.tasks.vocabulary.words.findIndex(w => w.word === word.word);
    if (existIdx >= 0) {
      if (!state.tasks.vocabulary.words[existIdx].memorized) {
        state.tasks.vocabulary.words[existIdx].memorized = true;
        added++;
      }
    } else {
      state.tasks.vocabulary.words.push({
        ...word,
        memorized: true,
        date: new Date().toISOString(),
      });
      added++;
    }
  });

  saveState();
  if (added > 0) {
    showToast(`📖 成功背诵 ${added} 个单词！`, 'success');
  } else {
    showToast('今天的单词已经背完啦！', 'info');
  }
  navTo('vocabulary');
}

function generateXhsTags(idea, audience) {
  const baseTags = ['自律', '成长', '干货分享', '自我提升'];
  const audienceTags = {
    '上班族': ['打工人', '职场成长', '副业'],
    '学生党': ['学生党', '学习方法', '校园生活'],
    '宝妈': ['宝妈副业', '居家创业', '时间管理'],
    '健身爱好者': ['健身打卡', '运动日常', '健康生活'],
    '创业者': ['创业', '商业模式', '搞钱'],
    '理财党': ['理财', '省钱攻略', '财务管理'],
    '通用': ['生活日常', '好物推荐', '经验分享'],
  };
  const tags = [...baseTags, ...(audienceTags[audience] || audienceTags['通用']), idea];
  return tags.map(t => `#${t}`).join(' ');
}

function saveXhsProject() {

function init_shop() {}

function switchShopTab(tab) {
  _shopTab = tab;
  navTo('shop');
}

function buyShopItem(category, itemId) {
  const state = getState();
  const item = SHOP_DATA[category].find(i => i.id === itemId);
  if (!item) return;

  if (state.coins < item.price) {
    showToast('金币不足！快去挖矿赚钱吧！', 'danger');
    return;
  }

  // 检查是否已拥有
  if (category === 'pets') {
    if (state.pets.find(p => p.shopId === item.id)) {
      showToast('已经拥有这只宠物了！', 'warning');
      return;
    }
    // 购买宠物 -> 弹窗命名
    showPetNamingModal(item);
    return;
  }

  // 扣金币
  addCoins(-item.price, `购买: ${item.name}`);

  // 加入背包
  const existInv = state.inventory.find(i => i.id === item.id);
  if (existInv) {
    existInv.count++;
  } else {
    state.inventory.push({
      id: item.id,
      type: category,
      name: item.name,
      icon: item.icon,
      desc: item.desc,
      count: 1,
      effect: item.effect || null,
      size: item.size || null,
      price: item.price,
    });
  }

  saveState();
  showToast(`🛒 购买成功！${item.name} 已存入背包`, 'success');
  renderHeader();
  navTo('shop');
  checkAchievements();
}

function showPetNamingModal(petItem) {
  const content = `

      <div style="font-size:56px;">${petItem.petId ? PetManager.thumb(petItem.petId, 64) : iconHtml(petItem.icon, 64)}</div>
      <div style="font-size:16px;color:var(--text-cream);margin-top:8px;">${petItem.name}</div>
      <div style="font-size:13px;color:var(--text-muted);">${petItem.desc}</div>

function confirmAdoptPet(petItemId) {
  const state = getState();
  const petItem = SHOP_DATA.pets.find(p => p.id === petItemId);
  if (!petItem) return;

  const name = document.getElementById('petNameInput').value.trim() || petItem.name;

  if (state.coins < petItem.price) {
    showToast('金币不足！', 'danger');
    return;
  }

  // 扣金币
  addCoins(-petItem.price, `领养宠物: ${name}`);

  // 添加宠物
  state.pets.push({
    id: 'pet_' + Date.now(),
    shopId: petItem.id,
    petId: petItem.petId,
    name,
    type: petItem.name,
    icon: petItem.icon,
    hunger: 80,
    mood: 80,
    health: 100,
    level: 1,
    exp: 0,
    adoptedAt: new Date().toISOString(),
    lastUpdate: new Date().toISOString(),
    lastInteract: null,
  });

  saveState();
  closeModal();
  showToast(`🐾 领养成功！欢迎 ${name} 加入矿工小屋！`, 'success');
  renderHeader();
  navTo('pet-yard');
  checkAchievements();
}

function selectFurniture(itemId) {
  _selectedFurniture = _selectedFurniture === itemId ? null : itemId;
  navTo('cabin');
}

function placeFurniture(tileIndex) {
  if (!_selectedFurniture) {
    showToast('请先从右侧选择家具！', 'info');
    return;
  }

  const state = getState();
  if (state.cabin.placed[tileIndex]) {
    showToast('这个位置已经有家具了！', 'warning');
    return;
  }

  const invItem = state.inventory.find(i => i.id === _selectedFurniture);
  if (!invItem) return;

  // 放置家具
  state.cabin.placed[tileIndex] = {
    id: invItem.id,
    name: invItem.name,
    icon: invItem.icon,
  };

  // 减少背包数量
  invItem.count--;
  if (invItem.count <= 0) {
    state.inventory = state.inventory.filter(i => i.id !== _selectedFurniture);
  }

  _selectedFurniture = null;
  saveState();
  showToast(`🪑 ${invItem.name} 已放置！`, 'success');
  navTo('cabin');
  checkAchievements();
}

function removeFurniture(tileIndex) {
  const state = getState();
  const item = state.cabin.placed[tileIndex];
  if (!item) return;

  // 放回背包
  const existInv = state.inventory.find(i => i.id === item.id);
  if (existInv) {
    existInv.count++;
  } else {
    const shopItem = SHOP_DATA.furniture.find(f => f.id === item.id);
    state.inventory.push({
      id: item.id,
      type: 'furniture',
      name: item.name,
      icon: item.icon,
      desc: shopItem ? shopItem.desc : '',
      count: 1,
    });
  }

  state.cabin.placed[tileIndex] = null;
  saveState();
  showToast(`📦 ${item.name} 已收回背包`, 'info');
  navTo('cabin');
}

function interactPet(petId, action) {
  const state = getState();
  const pet = state.pets.find(p => p.id === petId);
  if (!pet) return;

  const today = todayStr();
  const interactedToday = pet.lastInteract && dateStr(pet.lastInteract) === today;

  if (action === 'feed') {
    // 检查是否有食物
    const foods = state.inventory.filter(i => i.type === 'petFood');
    if (foods.length === 0) {
      showToast('背包里没有宠物粮食！去商城购买吧', 'warning');
      return;
    }
    // 使用第一个食物
    const food = foods[0];
    if (food.effect) {
      if (food.effect.hunger) pet.hunger = Math.min(100, pet.hunger + food.effect.hunger);
      if (food.effect.mood) pet.mood = Math.min(100, pet.mood + food.effect.mood);
      if (food.effect.health) pet.health = Math.min(100, pet.health + food.effect.health);
    }
    food.count--;
    if (food.count <= 0) state.inventory = state.inventory.filter(i => i.id !== food.id);
    showToast(`🍖 喂了${pet.name}一份${food.name}！`, 'success');
  }

  if (action === 'pet') {
    if (interactedToday) {
      showToast('今天已经抚摸过啦，明天再来吧！', 'info');
      return;
    }
    pet.mood = Math.min(100, pet.mood + 15);
    pet.lastInteract = new Date().toISOString();
    // 每日互动奖励3金币
    addCoins(3, `宠物互动: ${pet.name}`);
    state.checkinHistory.push({
      date: today,
      timestamp: new Date().toISOString(),
      taskKey: 'pet_interact',
      taskName: `互动${pet.name}`,
      coins: 3,
    });
    showToast(`🤚 抚摸了${pet.name}！心情+15，获得3金币！`, 'success');
  }

  if (action === 'bath') {
    // 检查是否有泡泡浴液
    const bathItem = state.inventory.find(i => i.id === 'pp_bath');
    if (bathItem) {
      pet.health = Math.min(100, pet.health + 20);
      pet.mood = Math.min(100, pet.mood + 5);
      bathItem.count--;
      if (bathItem.count <= 0) state.inventory = state.inventory.filter(i => i.id !== bathItem.id);
      showToast(`🛁 给${pet.name}洗了个泡泡浴！健康+20`, 'success');
    } else {
      pet.health = Math.min(100, pet.health + 5);
      showToast(`🛁 给${pet.name}洗了个澡！健康+5`, 'success');
    }
  }

  // 经验增长
  pet.exp = (pet.exp || 0) + 10;
  if (pet.exp >= 100) {
    pet.level++;
    pet.exp = 0;
    showToast(`🎉 ${pet.name} 升级了！Lv.${pet.level}`, 'success');
  }

  pet.lastUpdate = new Date().toISOString();
  saveState();
  renderHeader();
  navTo('pet-yard');
  const anyCheckedToday = state.checkinHistory.some(r => dateStr(r.timestamp) === todayStr());
  PetManager.playTransient(pet, action === 'pet' ? 'review' : 'done', anyCheckedToday);
}

function useItemOnPet(itemId) {
  const state = getState();
  const item = state.inventory.find(i => i.id === itemId);
  if (!item) return;

  const selectEl = document.getElementById(`petSelect_${itemId}`);
  if (!selectEl) return;
  const petId = selectEl.value;
  const pet = state.pets.find(p => p.id === petId);
  if (!pet) return;

  if (item.effect) {
    if (item.effect.hunger) pet.hunger = Math.min(100, pet.hunger + item.effect.hunger);
    if (item.effect.mood) pet.mood = Math.min(100, pet.mood + item.effect.mood);
    if (item.effect.health) pet.health = Math.min(100, pet.health + item.effect.health);
    if (item.effect.exp) {
      pet.exp = (pet.exp || 0) + item.effect.exp;
      while (pet.exp >= 100) { pet.level++; pet.exp -= 100; }
    }
  }

  item.count--;
  if (item.count <= 0) state.inventory = state.inventory.filter(i => i.id !== itemId);

  pet.lastUpdate = new Date().toISOString();
  saveState();
  showToast(`✅ 对${pet.name}使用了${item.name}！`, 'success');
  navTo('pet-yard');
  const anyCheckedToday = state.checkinHistory.some(r => dateStr(r.timestamp) === todayStr());
  PetManager.playTransient(pet, 'done', anyCheckedToday);
}

function generateMonthlyEvaluation(report, daysInMonth, rv) {
  const evaluations = [];
  const activeRate = (report.activeDays / daysInMonth * 100).toFixed(0);

  evaluations.push(`📊 ${report.year}年${report.month}月，你共活跃了 ${report.activeDays} 天（活跃率 ${activeRate}%），完成 ${report.totalTasksCompleted} 个任务，赚取 ${report.totalCoinsEarned} 金币。`);

  if (report.activeDays >= daysInMonth * 0.8) {
    evaluations.push('🔥 全月几乎天天挖矿，堪称劳模矿工！');
  } else if (report.activeDays >= daysInMonth * 0.5) {
    evaluations.push('💪 出勤率不错，保持下去！');
  } else if (report.activeDays > 0) {
    evaluations.push('⛏️ 矿道开得不够多，下个月加油！');
  } else {
    evaluations.push('💤 这个月似乎在休假，下个月该下矿了！');
  }

  if (report.totalCaloriesOut > report.totalCaloriesIn) {
    evaluations.push(`🏃 本月热量缺口 ${report.totalCaloriesOut - report.totalCaloriesIn} kcal，减脂成果不错！`);
  }

  if (report.bestDay) {
    evaluations.push(`🏆 最佳表现日：${formatDate(report.bestDay.date)}，获得 ${report.bestDay.coinsEarned} 金币！`);
  }

  /* ---- 第三期：成长 + 新媒体汇入总评 ---- */
  if (rv) {
    const g = rv.growth;
    if (g.total) {
      let gTxt = `🌱 成长目标：共 ${g.total} 条（完成 ${g.done} / 在途 ${g.open}），平均进度 ${g.avg}%。`;
      if (g.overdue.length) gTxt += `有 ${g.overdue.length} 条已过截止日，得抓紧收口。`;
      else if (g.soon.length) gTxt += `有 ${g.soon.length} 条本月到期，注意排期。`;
      else gTxt += '节奏稳，没有逾期目标。';
      evaluations.push(gTxt);
    }
    const m = rv.media;
    if (m.published || m.hasKpi || m.inFlight) {
      const seg = [];
      if (m.published) seg.push(`发布 ${m.published} 条内容`);
      if (m.inFlight) seg.push(`在制 ${m.inFlight} 条`);
      if (m.hasKpi) {
        seg.push(`留资 ${m.lyA}/${m.lyT}（${m.lyRate == null ? '未设目标' : m.lyRate + '%'}）`);
        seg.push(`增粉 ${m.zfA}/${m.zfT}（${m.zfRate == null ? '未设目标' : m.zfRate + '%'}）`);
      }
      let mTxt = `📣 新媒体：${seg.join('，')}。`;
      if (m.hasKpi && m.lyRate != null && m.lyRate < 100) mTxt += '留资没打满，下月把信息流素材再压一压。';
      else if (m.hasKpi && m.lyRate != null && m.lyRate >= 100) mTxt += '留资达标，这套打法可以固化成 SOP。';
      evaluations.push(mTxt);
    }
  }

  return evaluations.join('\n\n');
}

function saveApiConfig() {

  if (!epEl || !window.gmSetApi) { showToast('同步层未加载', 'danger'); return; }
  const ep = String(epEl.value || '').trim();
  if (ep && !/^https?:\/\/[^/]+/i.test(ep)) { showToast('接口地址要写完整的 http(s) 绝对地址', 'danger'); return; }
  const saved = window.gmApiCfg();
  // 令牌框留空 = 保持已存的那个（避免改地址时顺手把凭据抹了）
  const tk = String(tkEl.value || '').trim() || saved.token;
  window.gmSetApi(ep, tk);
  showToast('接口配置已保存，正在重载', 'success');
  setTimeout(function () { location.reload(); }, 500);
}

/* 导出：把整份本机状态存成一个 JSON 文件。
   本地 file:// 打开的工作台和云端站点是不同源，localStorage 不通用，
   旧数据就是靠这个文件搬到站点上再导入的。 */
function exportWorkbenchData() {
  try {
    var d = new Date();
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var payload = {
      kind: 'goldminer-workbench',
      version: DATA_VERSION,
      exportedAt: d.toISOString(),
      state: _state
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '淘金矿工小屋-数据-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast('已导出，可在云端站点用「导入数据」搬过去', 'success');
  } catch (e) {
    showToast('导出失败：' + e.message, 'danger');
  }
}

/* 导入的数据与文件读取分开：搬数据的逻辑要能单独验证。
   必须先把同步快照丢掉——导入的行在本机快照里“已经对过账”，
   留着它下一次拉取会把这些行当成“云端已删”而从本机抹掉。 */
function applyImportedData(text) {
  var parsed = JSON.parse(text);
  var incoming = parsed && parsed.state ? parsed.state : parsed;
  if (!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) {
    throw new Error('文件内容不是工作台数据');
  }
  if (typeof window.gmSyncDropSnapshot === 'function') { window.gmSyncDropSnapshot(); }
  _state = ensureFields(migrateState(incoming));
  saveState(); /* 已包装：会触发防抖推送，整表上传到云端 */
  navTo(currentPage || 'dashboard');
  renderHeader();
  renderSidebar();
  return true;
}

function importWorkbenchData() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = function () {
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        applyImportedData(String(reader.result));
        showToast(location.protocol !== 'file:' ? '数据已导入，正在同步到云端' : '数据已导入', 'success');
      } catch (e) {
        showToast('导入失败：' + e.message, 'danger');
      }
    };
    reader.onerror = function () { showToast('读取文件失败', 'danger'); };
    reader.readAsText(file);
  };
  input.click();
}

  let _mediaFilter = '全部';

  function utpEsc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function utpMonth() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function utpWeekRange() {
    const base = new Date(); base.setHours(0, 0, 0, 0);
    base.setDate(base.getDate() - ((base.getDay() + 6) % 7));
    const end = new Date(base); end.setDate(base.getDate() + 7);
    return [base, end];
  }
  function utpRing(pct) {
    const p = Math.max(0, Math.min(100, Math.round(pct || 0)));
    const C = 2 * Math.PI * 26, off = C * (1 - p / 100);
    return '<svg width="64" height="64" viewBox="0 0 64 64">' +
      '<circle class="tr" cx="32" cy="32" r="26"></circle>' +
      '<circle class="fg" cx="32" cy="32" r="26" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"></circle>' +
      '<text class="pct" x="32" y="36" text-anchor="middle">' + p + '%</text></svg>';
  }

  /* ---------------- D. 成长目标 ---------------- */
  function renderGrowth() {
    const s = getState();
    const goals = s.growth || [];
    const today = todayStr();
    const dirs = GROW_DIRS.map(function (d) {
      const arr = goals.filter(function (g) { return (g.dir || '其他') === d; });
      const pct = arr.length ? arr.reduce(function (a, g) { return a + Math.max(0, Math.min(100, g.pct || 0)); }, 0) / arr.length : 0;
      return { dir: d, pct: Math.round(pct), items: arr.length, done: arr.filter(function (g) { return g.done; }).length };
    });
    const open = goals.filter(function (g) { return !g.done; });
    const overall = (open.length ? open : goals).length ?
      Math.round((open.length ? open : goals).reduce(function (a, g) { return a + (g.pct || 0); }, 0) / (open.length ? open : goals).length) : 0;

    const rings = dirs.map(function (d) {
      return '<div class="utp-ring">' + utpRing(d.pct) +
        '<div class="lbl">' + d.dir + '</div>' +
        '<div class="sub">' + d.done + '/' + d.items + ' 项完成</div></div>';
    }).join('');

    const rows = goals.slice().sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0) || ((a.due || '9999') > (b.due || '9999') ? 1 : -1); }).map(function (g) {
      const over = !g.done && g.due && g.due < today;
      const tag = g.done ? '<span class="utp-tag t-done">已完成</span>' : (over ? '<span class="utp-tag t-over">逾期</span>' : '<span class="utp-tag">' + utpEsc(g.dir || '其他') + '</span>');
      const sub = [g.due ? '截止 ' + g.due : '', g.action ? '本月：' + utpEsc(g.action) : ''].filter(Boolean).join(' · ');
      return '<div class="utp-row' + (g.done ? ' done' : '') + '">' + tag +
        '<div class="rt">' + utpEsc(g.name) + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</div>' +
        '<div style="min-width:70px;text-align:right;font-size:12px;font-weight:800;color:var(--text-warm)">' + Math.max(0, Math.min(100, g.pct || 0)) + '%</div>' +
        '<button class="utp-act" onclick="utpGrowPct(\'' + g.id + '\')">+10%</button>' +
        '<button class="utp-act" onclick="utpGrowDone(\'' + g.id + '\')">' + (g.done ? '↺ 重开' : '✓ 完成') + '</button>' +
        '<button class="utp-act danger" onclick="utpGrowDel(\'' + g.id + '\')">✕</button></div>';
    }).join('') || '<div class="utp-empty">还没有目标，先在下面加一条</div>';

    return '<div class="module-header"><div class="mh-icon">🌱</div>' +
      '<div><div class="mh-title">成长目标</div><div class="mh-desc">四条曲线 · 把「会什么」沉淀成可交付的资产</div></div>' +
      '<div class="mh-spacer"></div>' +
      '<div class="header-coin-display"><span class="coin-icon">🌱</span><span class="coin-amount">' + open.length + '</span></div></div>' +
      '<div class="utp-notice">🧭 主线：<b>' + GROW_MAIN + '</b>。' +
      '四条曲线共用一套内容资产：本职保现金流、自媒体做流量、剪辑出产能、教练做交付。整体进度 <b>' + overall + '%</b>。</div>' +
      '<div class="utp-card"><div class="utp-card-head"><span class="utp-card-title">📈 四条曲线进度</span>' +
      '<span class="utp-note">按方向聚合，取该方向目标进度的均值</span></div>' +
      '<div class="utp-grid4">' + rings + '</div></div>' +
      '<div class="utp-card"><div class="utp-card-head"><span class="utp-card-title">🎯 目标清单</span>' +
      '<span class="utp-note">' + goals.length + ' 条 · 未完成 ' + open.length + ' 条</span></div>' +
      '<div class="utp-form">' +
      '<div class="f"><label>方向</label><select id="gDir">' + GROW_DIRS.map(function (d) { return '<option>' + d + '</option>'; }).join('') + '</select></div>' +
      '<div class="f wide"><label>目标</label><input id="gName" placeholder="如：拿到 3 个长期客户"></div>' +
      '<div class="f"><label>进度（%）</label><input id="gPct" type="number" min="0" max="100" step="1" placeholder="20"></div>' +
      '<div class="f"><label>截止日期</label><input id="gDue" type="date"></div>' +
      '<div class="f"><label>&nbsp;</label><button class="utp-act" style="justify-content:center;padding:8px 16px" onclick="utpGrowAdd()">＋ 添加目标</button></div>' +
      '<div class="f full"><label>本月行动</label><input id="gAct" placeholder="如：做 3 条样片 + 挂 2 个接单渠道"></div>' +
      '</div><div class="utp-rows">' + rows + '</div></div>' +
      '<div class="utp-card"><div class="utp-card-head"><span class="utp-card-title">🧰 能力资产盘点</span>' +
      '<span class="utp-note">每条曲线沉淀出的可交付产品</span></div>' +
      '<div class="utp-grid3">' +
      '<div class="utp-plat"><div class="pn">📄 内容资产</div><div class="pd">选题库 / 初稿库 / 成片与图文模板，一条内容四个平台复用，产能复利。</div></div>' +
      '<div class="utp-plat"><div class="pn">🧩 技能资产</div><div class="pd">剪辑模板、话术库、排课体系——可单独售卖的交付件，从时间换钱转向产品换钱。</div></div>' +
      '<div class="utp-plat"><div class="pn">👥 信任资产</div><div class="pd">私域社群、老客户复购与转介绍，留资 → 成交 → 转介绍的最短闭环。</div></div>' +
      '</div></div>';
  }
  function utpGrowAdd() {
    const name = (document.getElementById('gName') && document.getElementById('gName').value || '').trim();
    if (!name) { showToast('先写一条目标', 'warning'); return; }
    const s = getState();
    s.growth = s.growth || [];
    s.growth.push({
      id: 'gr_' + Date.now(),
      dir: (document.getElementById('gDir') && document.getElementById('gDir').value) || '本职进阶',
      name: name,
      pct: Math.max(0, Math.min(100, parseInt((document.getElementById('gPct') && document.getElementById('gPct').value) || '0', 10) || 0)),
      due: (document.getElementById('gDue') && document.getElementById('gDue').value) || '',
      action: (document.getElementById('gAct') && document.getElementById('gAct').value) || '',
      done: false, createdAt: new Date().toISOString(), demo: false,
    });
    saveState();
    const h = awardDailyHours('growth', '成长目标');
    if (h) showToast('⚔️ 今日首次维护成长目标， +' + h + ' 个修炼时辰', 'info');
    refreshPage('growth');
  }
  function utpGrowPct(id) {
    const s = getState(); const g = (s.growth || []).find(function (x) { return x.id === id; });
    if (!g) return;
    g.pct = Math.min(100, (g.pct || 0) + 10);
    if (g.pct >= 100) g.done = true;
    saveState();
    if (g.pct >= 100 && !g._toasted) { g._toasted = 1; addCoins(3, '目标完成 ' + g.name); showToast('🎉 目标完成「' + g.name + '」 +3 金币', 'success'); }
    refreshPage('growth');
  }
  function utpGrowDone(id) {
    const s = getState(); const g = (s.growth || []).find(function (x) { return x.id === id; });
    if (!g) return;
    g.done = !g.done;
    if (g.done) { g.pct = 100; addCoins(3, '目标完成 ' + g.name); const hh = awardDailyHours('growth', '成长目标'); showToast('🎉 目标完成 +3 金币' + (hh ? ' + ' + hh + ' 时辰' : ''), 'success'); }
    saveState(); refreshPage('growth');
  }
  function utpGrowDel(id) {
    const s = getState();
    s.growth = (s.growth || []).filter(function (x) { return x.id !== id; });
    saveState(); refreshPage('growth');
  }
  function clearGrowthDemo() {
    const s = getState();
    const n = (s.growth || []).filter(function (g) { return g.demo; }).length;
    s.growth = (s.growth || []).filter(function (g) { return !g.demo; });
    saveState(); refreshPage('growth');
    if (n) showToast('已清空 ' + n + ' 条示例目标', 'info');
  }

  /* ---------------- E. 新媒体工作台 ---------------- */
  function mediaItems(s) { return (s.media && s.media.items) || []; }
  function renderMedia() {
    utpCleanStaleTopics();
    const s = getState();
    const items = mediaItems(s);
    const today = todayStr();
    const [wkStart, wkEnd] = utpWeekRange();
    const wkIso = function (d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    const wkS = wkIso(wkStart), wkE = wkIso(new Date(wkEnd));

    /* 流水线：待采用/已采用/制作中/已发布 四道 */
    const lanes = MEDIA_STAGES.map(function (st) {
      const arr = items.filter(function (i) { return i.stage === st.k; }).sort(function (a, b) { return (a.date || '') < (b.date || '') ? 1 : -1; });
      const cards = arr.map(function (i) {
        var isPub = st.k === '已发布';
        var over = !isPub && i.date && i.date < today;
        var plat = MEDIA_PLATFORMS.filter(function (x) { return x.n === i.plat; })[0] || { color: 'var(--text-muted)' };
        var meta = '<span style="color:' + plat.color + '">' + utpEsc(i.plat) + '</span>';
        if (i.pub) meta += '<span>计划 ' + i.pub + '</span>';
        if (over) meta += '<span style="color:var(--color-danger)">逾期</span>';
        if (i.src) meta += '<span>' + utpEsc(i.src) + '</span>';
        var ops = '';
        if (isPub) {
          ops += '<button class="utp-act" onclick="utpMediaUndoPub(\'' + i.id + '\')">↺ 退回重做</button>';
        } else {
          var ni = MEDIA_STAGES.findIndex(function (x) { return x.k === i.stage; });
          var nxt = ni >= 0 && MEDIA_STAGES[ni + 1] ? MEDIA_STAGES[ni + 1].t.replace(/^[①②③④]\s*/, '') : '';
          ops += '<button class="utp-act" onclick="utpMediaAdvance(\'' + i.id + '\')">▸ ' + nxt + '</button>';
        }
        ops += '<button class="utp-act danger" onclick="utpMediaDel(\'' + i.id + '\')">✕</button>';
        var html = '<div class="utp-item"><div class="it-t">' + utpEsc(i.title) + '</div>';
        html += '<div class="it-m">' + meta + '</div>';
        if (i.note) html += '<div class="it-m"><span>📝 ' + utpEsc(i.note) + '</span></div>';
        html += '<div class="it-ops">' + ops + '</div></div>';
        return html;
      }).join('');
      return '<div class="utp-lane"><div class="utp-lane-head"><span>' + st.t + '</span><span class="n">' + arr.length + '</span></div>' +
        (cards || '<div class="utp-empty" style="padding:14px 0">暂无</div>') + '</div>';
    }).join('');

    /* 进度条 */
    const segs = MEDIA_STAGES.map(function (st, i) {
      const n = items.filter(function (x) { return x.stage === st.k; }).length;
      const colors = ['var(--color-warning)', '#E8A33D', 'var(--color-info)', 'var(--color-success)'];
      return n ? '<i style="width:' + (n / Math.max(1, items.length) * 100) + '%;background:' + colors[i] + '"></i>' : '';
    }).join('');
    const legend = MEDIA_STAGES.map(function (st, i) {
      const n = items.filter(function (x) { return x.stage === st.k; }).length;
      const colors = ['var(--color-warning)', '#E8A33D', 'var(--color-info)', 'var(--color-success)'];
      return '<span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + colors[i] + ';margin-right:4px"></i>' + st.t.replace(/^[①②③④]\s*/, '') + ' <b>' + n + '</b></span>';
    }).join('');

    /* 四平台矩阵 */
    const plats = MEDIA_PLATFORMS.map(function (p) {
      const wk = items.filter(function (i) { return i.plat === p.n && i.stage === '已发布' && i.pub >= wkS && i.pub <= wkE; }).length;
      const open = items.filter(function (i) { return i.plat === p.n && i.stage !== '已发布'; }).length;
      return '<div class="utp-plat"><div class="ph"><span class="dot" style="background:' + p.color + '"></span><span class="pn">' + p.n + '</span></div>' +
        '<div class="pr">' + p.role + '</div><div class="pd">' + p.desc + '<br>' + p.hook + '</div>' +
        '<div class="pw">本周已发 ' + wk + ' 条 · 在途 ' + open + ' 条</div></div>';
    }).join('');

    /* 初稿库（非已发布，带过滤） */
    const drafts = items.filter(function (i) { return i.stage !== '已发布'; })
      .filter(function (i) { return _mediaFilter === '全部' || i.stage === _mediaFilter; })
      .sort(function (a, b) { return (a.date || '') < (b.date || '') ? 1 : -1; });
    const draftRows = drafts.map(function (i) {
      const stageTag = { '待采用': '', '已采用': 't-adopt', '制作中': 't-make' }[i.stage] || '';
      return '<div class="utp-row"><span class="utp-tag ' + stageTag + '">' + i.stage + '</span>' +
        '<div class="rt">' + utpEsc(i.title) + '<span class="sub">' + utpEsc(i.plat) + (i.pub ? ' · 计划 ' + i.pub : '') + (i.src ? ' · ' + utpEsc(i.src) : '') + '</span></div>' +
        (i.stage !== '已发布' ? '<button class="utp-act" onclick="utpMediaAdvance(\'' + i.id + '\')">▸ 推进</button>' : '') +
        '<button class="utp-act danger" onclick="utpMediaDel(\'' + i.id + '\')">✕</button></div>';
    }).join('') || '<div class="utp-empty">这个状态下没有初稿</div>';
    const fbtns = ['待采用', '已采用', '制作中', '全部'].map(function (f) {
      return '<button class="utp-fbtn' + (_mediaFilter === f ? ' on' : '') + '" onclick="utpMediaFilter(\'' + f + '\')">' + f + '</button>';
    }).join('');

    /* 月度绩效 */
    const km = utpMonth();
    const kpiRec = ((s.media && s.media.kpi) || []).find(function (k) { return k.month === km; });
    const lyT = kpiRec && kpiRec.lyT || 0, lyA = kpiRec && kpiRec.lyA || 0;
    const zfT = kpiRec && kpiRec.zfT || 0, zfA = kpiRec && kpiRec.zfA || 0;
    const kpiCards = [
      { l: '留资目标', v: lyT || '—' },
      { l: '留资实际', v: lyA || '—', c: (kpiRec && lyT && lyA >= lyT) ? 'ok' : (kpiRec ? 'no' : '') },
      { l: '增粉目标', v: zfT || '—' },
      { l: '增粉实际', v: zfA || '—', c: (kpiRec && zfT && zfA >= zfT) ? 'ok' : (kpiRec ? 'no' : '') },
    ].map(function (k) { return '<div class="k"><div class="v ' + (k.c || '') + '">' + k.v + '</div><div class="l">' + k.l + '</div></div>'; }).join('');
    const hist = ((s.media && s.media.kpi) || []).filter(function (k) { return k.month !== km; })
      .sort(function (a, b) { return a.month < b.month ? 1 : -1; }).map(function (k) {
        const okL = k.lyT && k.lyA >= k.lyT, okZ = k.zfT && k.zfA >= k.zfT;
        return '<div class="utp-row"><span class="utp-tag">' + k.month + '</span>' +
          '<div class="rt">留资 ' + (k.lyA || 0) + '/' + (k.lyT || 0) + (okL ? ' ✅' : '') + ' · 增粉 ' + (k.zfA || 0) + '/' + (k.zfT || 0) + (okZ ? ' ✅' : '') +
          (k.mark ? '<span class="sub">' + utpEsc(k.mark) + '</span>' : '') + '</div>' +
          '<button class="utp-act danger" onclick="utpKpiDel(\'' + k.month + '\')">✕</button></div>';
      }).join('') || '<div class="utp-empty">暂无历史月份</div>';
    const kpiVal = function (id, v) { return v ? ' value="' + utpEsc(String(v)) + '"' : ''; };

    const hasDemo = items.some(function (i) { return i.demo; });

    return '<div class="module-header"><div class="mh-icon">📣</div>' +
      '<div><div class="mh-title">新媒体工作台</div><div class="mh-desc">每日流水线：选题 → 洗稿 → 制作 → 发布</div></div>' +
      '<div class="mh-spacer"></div>' +
      (hasDemo ? '<button class="utp-demo-btn" onclick="clearMediaDemo()">清空示例</button>' : '') +
      '<div class="header-coin-display"><span class="coin-icon">📣</span><span class="coin-amount">' + items.length + '</span></div></div>' +
      '<div class="utp-notice">⏰ 阶段定义：<b>待采用＝检索选题</b>（3 天未采用自动清除）→ <b>已采用＝完成洗稿</b> → <b>制作中＝分平台制作</b> → <b>发布后＝当日已发布</b>（从初稿库移除）。同一选题，四种打法：四个平台按各自钩子分发。</div>' +
      '<div class="utp-card"><div class="utp-card-head"><span class="utp-card-title">🏭 每日流水线</span><span class="utp-note">选题池 ' + items.length + ' 条</span></div>' +
      '<div class="utp-prog">' + segs + '</div><div class="utp-prog-legend">' + legend + '</div>' +
      '<div style="height:12px"></div><div class="utp-pipe">' + lanes + '</div></div>' +
      '<div class="utp-card"><div class="utp-card-head"><span class="utp-card-title">📡 四平台矩阵</span><span class="utp-note">同一选题，四种打法 · 本周口径</span></div>' +
      '<div class="utp-grid4">' + plats + '</div></div>' +
      '<div class="utp-card"><div class="utp-card-head"><span class="utp-card-title">✍️ 新增选题</span><span class="utp-note">直接进选题池</span></div>' +
      '<div class="utp-form">' +
      '<div class="f"><label>日期</label><input id="wDate" type="date" value="' + today + '"></div>' +
      '<div class="f"><label>平台</label><select id="wPlat">' + MEDIA_PLATFORMS.map(function (p) { return '<option>' + p.n + '</option>'; }).join('') + '</select></div>' +
      '<div class="f wide"><label>选题标题</label><input id="wTitle" placeholder="如：少儿课程入门 3 个动作看懂规则"></div>' +
      '<div class="f"><label>计划发布</label><input id="wPub" type="date"></div>' +
      '<div class="f full"><label>热点来源（可选）</label><input id="wSrc" placeholder="如：热点检索 · 榜单第 3"></div>' +
      '<div class="f full"><label>文案要点（可选）</label><input id="wNote" placeholder="钩子 + 结构 + 结尾 CTA"></div>' +
      '<div class="f"><label>&nbsp;</label><button class="utp-act" style="justify-content:center;padding:8px 16px" onclick="utpMediaAdd()">＋ 加入选题池</button></div>' +
      '</div></div>' +
      '<div class="utp-card"><div class="utp-card-head"><span class="utp-card-title">📥 初稿库</span><span class="utp-note">发布后自动移除 · 待采用 3 天未采用清除</span></div>' +
      '<div class="utp-filters">' + fbtns + '</div><div class="utp-rows">' + draftRows + '</div></div>' +
      '<div class="utp-card"><div class="utp-card-head"><span class="utp-card-title">📊 本月绩效（' + km + '）</span><span class="utp-note">每月 5-10 号更新 · 留资 + 增粉</span></div>' +
      '<div class="utp-kpi">' + kpiCards + '</div>' +
      '<div class="utp-form">' +
      '<div class="f"><label>月份</label><input id="kMonth" type="month" value="' + km + '" onchange="utpKpiPrefill()"></div>' +
      '<div class="f"><label>留资目标</label><input id="kLyT" type="number" min="0" step="1" placeholder="如 50"' + kpiVal('kLyT', kpiRec && kpiRec.lyT) + '></div>' +
      '<div class="f"><label>留资实际</label><input id="kLyA" type="number" min="0" step="1" placeholder="如 32"' + kpiVal('kLyA', kpiRec && kpiRec.lyA) + '></div>' +
      '<div class="f"><label>增粉目标</label><input id="kZfT" type="number" min="0" step="1" placeholder="如 1000"' + kpiVal('kZfT', kpiRec && kpiRec.zfT) + '></div>' +

    /* --- 成长目标（无月度历史，取当前快照） --- */
    const goals = state.growth || [];

    const openG = goals.filter(function (g) { return !g.done; });
    const avg = goals.length
      ? Math.round(goals.reduce(function (a, g) { return a + Math.max(0, Math.min(100, g.pct || 0)); }, 0) / goals.length)
      : 0;
    const soon = openG.filter(function (g) { return g.due && g.due >= today && g.due <= end; });
    const overdue = openG.filter(function (g) { return g.due && g.due < today; });
    const dueInMonth = goals.filter(function (g) { return g.due && g.due >= start && g.due <= end; });
    const dirs = GROW_DIRS.map(function (d) {
      const arr = goals.filter(function (g) { return (g.dir || '其他') === d; });

        ? Math.round(arr.reduce(function (a, g) { return a + Math.max(0, Math.min(100, g.pct || 0)); }, 0) / arr.length)

      return { dir: d, pct: pct, n: arr.length, done: arr.filter(function (g) { return g.done; }).length };

    Q[tk] = function (cur) {
      return httpJson('?action=query&table=' + encodeURIComponent(tk)
        + (cur ? '&cursor=' + encodeURIComponent(cur) : '')).then(function (res) {
        if (!res || !Array.isArray(res.results)) { throw new Error('api_bad_response'); }
        return res;
      });
    };
    A[tk] = function (props) { return callFn({ action: 'insert', table: tk, properties: props }); };
    U[tk] = function (recordId, props) { return callFn({ action: 'update', table: tk, recordId: recordId, properties: props }); };
    DL[tk] = function (recordId) { return callFn({ action: 'delete', table: tk, recordId: recordId }); };
  });

  /* 分页读全表（hasMore/nextCursor 循环，上限 2500 行） */
  function qAll(tk) {
    var rows = [];
    function page(cur) {
      return Q[tk](cur).then(function (res) {
        ((res && res.results) || []).forEach(function (r) { rows.push(r); });
        if (res && res.hasMore && res.nextCursor && rows.length < 2500) { return page(res.nextCursor); }
        return rows;
      });
    }
    return page(null);
  }

  /* 行 → oneof 属性（列有值才写；rid/updatedAt 恒写） */
  function serializeRow(tk, rid, c, now) {
    var props = { rid: { text: rid }, updatedAt: { number: now } };
    Object.keys(TABS[tk].cols).forEach(function (col) {
      var v = c[col];
      if (v === undefined || v === null) { return; }
      var t = TABS[tk].cols[col];
      if (t === 'n') { props[col] = { number: Number(v) }; }
      else if (t === 'c') { props[col] = { checkbox: !!v }; }
      else { props[col] = { text: String(v) }; }
    });
    return props;
  }

  function applyToState(data) {
    _state = ensureFields(data);
    saveState();
    try { navTo(currentPage); } catch (e) {}
    try { showToast('☁️ 已从资料库同步最新数据', 'success'); } catch (e) {}
  }

  /* ---------- doPull：13 表并行拉取 → 行级对账 → 应用 ---------- */
  function doPull() {
    var data = readState();
    if (!data) { return Promise.resolve(false); }
    var rawStart = JSON.stringify(data);
    var snap = cfgLoad().snap || {};
    var localMaps = {};
    TAB_KEYS.forEach(function (tk) {
      var m = {};
      EXTRACT[tk](data).forEach(function (r) { r.hash = recHash(r); m[r.rid] = r; });
      localMaps[tk] = m;
    });
    return Promise.all(TAB_KEYS.map(function (tk) { return qAll(tk).catch(function () { return null; }); }))
      .then(function (cloudList) {
        var toApply = [], newSnap = {};
        TAB_KEYS.forEach(function (tk, i) {
          var cl = cloudList[i];
          if (!cl) { if (snap[tk]) { newSnap[tk] = snap[tk]; } return; }
          var loc = localMaps[tk];
          var s = snap[tk] || null;
          var fresh = !s;
          var eff = s;
          if (!eff) { eff = {}; Object.keys(loc).forEach(function (rid) { eff[rid] = loc[rid].hash; }); }
          var cloud = {};
          cl.forEach(function (r) { var rid = pv(r.rid); if (rid) { cloud[rid] = r; } });
          var merged = {}, changed = false;
          Object.keys(loc).forEach(function (rid) { merged[rid] = loc[rid].c; });
          Object.keys(cloud).forEach(function (rid) {
            var cc = rowCols(tk, cloud[rid]);
            var lr = loc[rid];
            if (lr) {
              if (sameContent(lr.c, cc)) { return; }
              if (lr.hash === eff[rid]) { merged[rid] = cc; changed = true; }
            } else if (!eff[rid]) { merged[rid] = cc; changed = true; }
          });
          if (s) {
            Object.keys(s).forEach(function (rid) {
              if (cloud[rid]) { return; }
              if (loc[rid] && loc[rid].hash === s[rid] && merged[rid]) { delete merged[rid]; changed = true; }
            });
          }
          var tSnap = {};
          Object.keys(merged).forEach(function (rid) {
            var cr = cloud[rid];
            if (cr && sameContent(rowCols(tk, cr), merged[rid])) { tSnap[rid] = hashStr(canon(merged[rid])); }
          });
          newSnap[tk] = tSnap;
          if (changed) { toApply.push({ tk: tk, rows: Object.keys(merged).map(function (rid) { return { rid: rid, c: merged[rid] }; }), fresh: fresh }); }
        });
        /* 应用前校验：拉取期间用户改过本机数据 → 本轮放弃，下个周期重来 */
        if (toApply.length && JSON.stringify(readState()) !== rawStart) { return false; }
        if (toApply.length) {
          toApply.forEach(function (a) { APPLY[a.tk](data, a.rows, a.fresh); });
          applyToState(data);
        }
        var c = cfgLoad();
        c.snap = newSnap;
        cfgSave(c);
        return toApply.length > 0;
      });
  }

  /* ---------- doPush：逐表最小化 upsert + 删除传播 ---------- */
  function doPush() {
    var data = readState();
    if (!data) { return Promise.resolve(false); }
    var snap = cfgLoad().snap || {};
    var now = Date.now();
    var allOk = true;
    var jobs = TAB_KEYS.map(function (tk) {
      var rows = [];
      EXTRACT[tk](data).forEach(function (r) { r.hash = recHash(r); rows.push(r); });
      var localH = {};
      rows.forEach(function (r) { localH[r.rid] = r.hash; });
      var snapT = snap[tk] || null;
      if (snapT && sameSnap(snapT, localH)) { return Promise.resolve('skip'); }
      return qAll(tk).then(function (cl) {
        var cloud = {};
        cl.forEach(function (r) { var rid = pv(r.rid); if (rid) { cloud[rid] = r; } });
        var ops = [], confirmed = {};
        rows.forEach(function (row) {
          var cr = cloud[row.rid];
          if (cr) {
            if (sameContent(row.c, rowCols(tk, cr))) { confirmed[row.rid] = true; return; }
            if (snapT && snapT[row.rid] && row.hash === snapT[row.rid]) { return; } /* 拉取滞后，不覆盖云端新值 */
          }
          var props = serializeRow(tk, row.rid, row.c, now);
          var op;
          if (cr && pv(cr._id)) {
            var sysid = pv(cr._id);
            op = U[tk](sysid, props).then(function () { return true; }, function () {
              return A[tk](props).then(function () { return true; }, function () { return false; });
            });
          } else {
            op = A[tk](props).then(function () { return true; }, function () { return false; });
          }
          ops.push(op.then(function (ok) { if (ok) { confirmed[row.rid] = true; } else { allOk = false; } }));
        });
        Object.keys(cloud).forEach(function (rid) {
          if (localH[rid]) { return; }
          if (!snapT || !snapT[rid]) { return; } /* 不是本机删的，不动 */
          var sysid = pv(cloud[rid]._id);
          if (!sysid) { return; }
          ops.push(DL[tk](sysid).then(function () { return true; }, function () { return false; }).then(function (ok) { if (!ok) { allOk = false; } }));
        });
        return Promise.all(ops).then(function () {
          var t = {};
          Object.keys(confirmed).forEach(function (rid) { t[rid] = localH[rid]; });
          return t;
        });
      }).catch(function () { allOk = false; return null; });
    });
    return Promise.all(jobs).then(function (results) {
      if (!allOk) { return false; }
      var c = cfgLoad();
      var newSnap = c.snap || {};
      results.forEach(function (t, i) { if (t && t !== 'skip') { newSnap[TAB_KEYS[i]] = t; } });
      c.snap = newSnap;
      c.lastTs = now;
      cfgSave(c);
      return true;
    });
  }

  function hasPending() {
    var data = readState();
    if (!data) { return false; }
    var snap = cfgLoad().snap || {};
    for (var i = 0; i < TAB_KEYS.length; i++) {
      var tk = TAB_KEYS[i];
      var m = {};
      EXTRACT[tk](data).forEach(function (r) { m[r.rid] = recHash(r); });
      if (!sameSnap(snap[tk], m)) { return true; }
    }
    return false;
  }

  function pull() {
    if (!online() || _syncing) { return Promise.resolve(false); }
    _syncing = true;
    return Promise.resolve().then(function () { return doPull(); })
      .catch(function () { /* 离线 / 网络失败静默 */ })
      .then(function (applied) {
        _syncing = false;
        if (hasPending()) { try { push(); } catch (e) {} }
        return !!applied;
      });
  }

  function push() {
    if (!online() || _syncing) { return Promise.resolve(); }
    _syncing = true;
    return Promise.resolve().then(function () { return doPush(); })
      .catch(function () { /* 静默重试 */ })
      .then(function () { _syncing = false; });
  }

  function schedule() {
    if (!online() || _syncing) { return; }
    if (_timer) { clearTimeout(_timer); }
    _timer = setTimeout(function () { try { push(); } catch (e) {} }, 1200);
  }

  /* ---------- 初始化：包一层 saveState → 防抖推送；拉取 + 兜底轮询 ---------- */
  function init() {
    try {
      if (!online()) { return; } /* file:// 直开：无同源端点，整层停用 */
      var origSave = saveState;
      saveState = function () {
        origSave();
        try { schedule(); } catch (e) {}
      };
      /* 主脚本 initApp 挂在 DOMContentLoaded（晚于本层执行），等 _state 就绪后再首拉 */
      var bootTries = 100;
      function bootPull() {
        if (readState()) { pull().catch(function () {}); }
        else if (bootTries-- > 0) { setTimeout(bootPull, 100); }
      }
      setTimeout(bootPull, 80);
      setInterval(function () { try { pull(); } catch (e) {} }, 30000);
    } catch (e) { /* 同步层任何异常不影响页面功能 */ }
  }

  /* 供设置页读写接口配置（仅本机） */
  window.gmApiCfg = apiCfg;
  window.gmSetApi = function (endpoint, token) {
    var c = cfgLoad();
    var ep = String(endpoint || '').trim();
    var prev = String(c.endpoint || '').trim();
    // 换后端 = 换一本账：旧后端的快照哈希对新后端毫无意义。留着它，doPush 会把
    // “本机已改”误判成“云端已对过账”，新后端就此永久漏掉这些行。
    if (prev.replace(/\/+$/, '') !== ep.replace(/\/+$/, '')) { delete c.snap; delete c.lastTs; }
    c.endpoint = ep;
    c.token = String(token || '').trim();
    cfgSave(c);
    return apiCfg();
  };
  // 连通测试直接走真实查询路径（含鉴权头），别在页面里再抄一遍 URL 拼法。
  window.gmApiProbe = function () {
    return Q.rpt(null).then(function (res) { return { ok: true, rows: res.results.length }; },
      function (e) { return { ok: false, error: String((e && e.message) || e) }; });
  };

  init();
})();
</script>
