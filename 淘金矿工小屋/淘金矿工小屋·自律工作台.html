<head data-page-node-id="HxvHIBQoEaPQzjgec6D1EY">

  <title data-page-node-id="gDtKUyTHqHFfYpPZWPg5YB" data-pnid-children="W5lzac3Z9s5RkabMombpvk">淘金矿工小屋｜自律工作台</title>
  <style data-page-node-id="AjPYSZxBHRsP83iTLO7KMM" data-pnid-children="UqE8YFcbds8FDmVAdiSCYl">
    /* ============================================
       淘金矿工小屋 - 柔和护眼·暖调低对比
       配色：浅沙土黄底 / 奶油米黄卡 / 温润暖金
       ============================================ */
    :root {
      /* 柔和基底（浅沙土黄，低饱和护眼） */
      --bg-deepest: #F6E9D8;
      --bg-dark: #FDF1E2;
      --bg-cave: #FDF1E2;
      --bg-panel: #FFF6EA;
      --bg-card: #FFFDF8;
      --bg-card-hover: #FDF1E2;
      /* 温润暖金（调低亮度与对比，非强光亮金） */
      --gold-bright: #E85A12;
      --gold: #FF6D24;
      --gold-dark: #E85A12;
      --gold-deep: rgba(39, 53, 47, 0.28);
      /* 文字：深卡其棕标题 / 中度灰正文（纯黑禁用） */
      --text-cream: #27352F;
      --text-warm: #27352F;
      --text-gold: #E85A12;
      --text-muted: #5C6B63;
      --text-dim: #93A099;
      /* 辅助色（柔化，降低刺眼） */
      --color-success: #27A973;
      --color-danger: #E84A3C;
      --color-info: #8A7BE8;
      --color-warning: #E8A33D;
      /* 边框 / 分割线：浅棕灰，弱化 */
      --line: rgba(39, 53, 47, 0.10);
      --line-soft: rgba(39, 53, 47, 0.06);
      /* 尺寸 */
      --sidebar-w: 248px;
      --bottombar-h: 60px;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 24px;
      --shadow: 0 1px 3px rgba(39, 53, 47, 0.06), 0 1px 2px rgba(39, 53, 47, 0.04);
      --font-base: "Nunito", "PingFang SC", "Microsoft YaHei UI", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "IBM Plex Mono", "Bahnschrift", "Consolas", ui-monospace, monospace;

      /* ===== utopia 设计令牌 ===== */
      --bg: #FFF6EA;
      --surface: #FFFDF8;
      --surface-2: #FDF1E2;
      --sunken: #F6E9D8;
      --ink: #27352F;
      --ink-2: #5C6B63;
      --ink-3: #93A099;
      --accent: #FF6D24;
      --accent-ink: #FFF6EA;
      --accent-soft: rgba(255, 109, 36, 0.14);
      --accent-deep: #E85A12;
      --teal: #27A973;
      --amber: #E8A33D;
      --violet: #8A7BE8;
      --ok: #27A973;
      --side-bg: #F7DC8B;
      --side-ink: #27352F;
      --side-line: rgba(39, 53, 47, 0.16);
      --side-active: rgba(255, 255, 255, 0.55);
      --radius-lg2: 24px;
      --shadow-1: 0 1px 3px rgba(39, 53, 47, 0.06), 0 1px 2px rgba(39, 53, 47, 0.04);
      --shadow-2: 0 6px 20px rgba(39, 53, 47, 0.08), 0 2px 6px rgba(39, 53, 47, 0.04);
      --ease: cubic-bezier(.16, 1, .3, 1);
      --dur-fast: 160ms;
      --dur: 320ms;
      --dur-slow: 640ms;
      --font-num: "Nunito", "IBM Plex Mono", "Bahnschrift", "Consolas", ui-monospace, monospace;
      --font-display: "Fredoka", "Baloo 2", "Microsoft YaHei UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-base);
      background: var(--bg);
      color: var(--text-cream);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }
    /* 防止 iOS Safari 橡皮筋回弹 */
    body { position: fixed; width: 100%; overscroll-behavior-y: contain; }

    /* ============ 布局 ============ */
    .app-layout { display: flex; height: 100vh; width: 100vw; }

    /* ============ 侧边导航 ============ */
        .sidebar {
      width: 265px;
      background: var(--side-bg);
      border-right: 1px solid var(--side-line);
      display: flex; flex-direction: column; overflow: hidden;
      flex-shrink: 0; padding: 0 14px 14px;
      color: var(--side-ink);
      position: relative;
    }
    .side-bg {
      position: absolute; inset: 0; z-index: 0;
      background-size: cover; background-position: center; pointer-events: none;
    }
    .sidebar > *:not(.side-bg) { position: relative; z-index: 1; }
    .side-stripe {
      height: 6px; margin: 0 -14px 14px; flex: 0 0 6px;
      background: var(--accent); opacity: .95;
    }
    .brand-s {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 4px 6px 0;
    }
    .sidebar-mascot {
      height: 52px; width: auto;
      filter: drop-shadow(0 6px 14px rgba(255, 109, 36, 0.22));
    }
    .brand-tt { display: flex; flex-direction: column; gap: 1px; text-align: center; }
    .sidebar-logo {
      font-size: 14px; font-weight: 600; letter-spacing: .01em;
      line-height: 1.35; color: var(--side-ink);
    }
    .sidebar-subtitle {
      font-family: var(--font-num); font-size: 9.5px; letter-spacing: .2em;
      color: var(--side-ink-3); text-transform: uppercase;
    }
    .sidebar-nav {
      display: flex; flex-direction: column; gap: 3px; margin-top: 24px;
      flex: 1; min-height: 0; overflow-y: auto;
    }
    .nav-label {
      font-family: var(--font-num); font-size: 10px; letter-spacing: .22em;
      color: var(--side-ink-3); text-transform: uppercase; padding: 0 12px;
      margin: 2px 0 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 12px; border-radius: 10px; border: 0; background: transparent;
      font-family: var(--font-base); font-size: 14px; font-weight: 400;
      color: var(--side-ink-2); cursor: pointer; text-align: left;
      transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease),
                  box-shadow var(--dur-fast) var(--ease);
    }
    .nav-ico {
      width: 20px; height: 20px; flex: 0 0 20px; object-fit: contain;
      transition: transform var(--dur) var(--ease);
    }
    .nav-item:hover { background: rgba(255, 255, 255, 0.4); color: var(--side-ink); }
    .nav-item:hover .nav-ico { transform: scale(1.14) rotate(-4deg); }
    .nav-item.active {
      background: var(--side-active); color: var(--side-ink); font-weight: 500;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .nav-item.active .nav-ico { transform: scale(1.1); }
    .sidebar-bottom {
      display: flex; flex-direction: column; gap: 9px;
      border-top: 1px solid var(--side-line); padding-top: 12px;
    }
    .foot-row { display: flex; gap: 8px; align-items: stretch; }
    .foot-row > * { flex: 1; min-width: 0; }
    .side-pill {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 30px; padding: 0 11px; border-radius: 999px;
      border: 1px solid rgba(39, 53, 47, 0.14); background: rgba(255, 255, 255, 0.55);
      font-family: var(--font-base); font-size: 12px; font-weight: 600;
      color: var(--side-ink); cursor: pointer; white-space: nowrap; width: 100%;
      transition: background var(--dur-fast) var(--ease);
    }
    .side-pill:hover { background: rgba(255, 255, 255, 0.8); }
    .side-pill .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3);
      flex-shrink: 0;
    }
    .miner-row { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
    .sidebar-bottom .miner-avatar { font-size: 18px; line-height: 1; }
    .sidebar-bottom .miner-info { flex: 1; min-width: 0; }
    .sidebar-bottom .miner-name { font-size: 12.5px; color: var(--side-ink); font-weight: 600; }
    .sidebar-bottom .miner-level { font-size: 11px; color: var(--side-ink-3); }
    
    .sidebar-nav::-webkit-scrollbar { width: 0; }
    .nav-section-title {
      padding: 14px 18px 6px; font-size: 11px; font-weight: 700;
      color: var(--gold-dark); letter-spacing: 2px;
    }
    .nav-item .nav-badge {
      margin-left: auto; background: var(--color-danger); color: #fff; font-size: 10px;
      padding: 1px 6px; border-radius: 10px; font-weight: 700;
    }
    .nav-item .nav-coin { margin-left: auto; font-size: 11px; color: var(--gold-dark); font-weight: 600; }

    /* ============ 主内容 ============ */
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .main-header {
      height: 54px; background: linear-gradient(180deg, var(--bg-cave), var(--bg-panel));
      border-bottom: 1px solid var(--gold-deep); display: flex; align-items: center;
      padding: 0 18px; gap: 12px; flex-shrink: 0;
    }
    .main-header .page-title { font-size: 18px; color: var(--gold-bright); letter-spacing: 1px; font-weight: 700; }
    .main-header .header-spacer { flex: 1; }
    .header-date { font-size: 12px; color: var(--text-muted); }
    .header-coin-display {
      display: flex; align-items: center; gap: 7px; padding: 5px 14px;
      background: rgba(255, 109, 36, 0.14); border: 1px solid var(--gold-deep); border-radius: 20px;
    }
    .header-coin-display .coin-icon { font-size: 16px; }
    .header-coin-display .coin-amount { font-size: 17px; font-weight: 700; color: var(--gold-bright); }
    .main-content {
      flex: 1; overflow-y: auto; padding: 18px; overscroll-behavior-y: contain;
      padding-bottom: calc(var(--bottombar-h) + 18px); -webkit-overflow-scrolling: touch;
    }
    .main-content::-webkit-scrollbar { width: 0; }

    /* 菜单按钮（仅移动端显示） */
    .menu-toggle {
      display: none; align-items: center; justify-content: center;
      width: 44px; height: 44px; flex-shrink: 0; cursor: pointer;
      background: rgba(255, 109, 36, 0.14); border: 1px solid var(--gold-deep);
      border-radius: var(--radius-sm); color: var(--gold-bright); font-size: 20px;
    }
    /* 移动端抽屉遮罩 */
    .sidebar-backdrop {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(39, 53, 47, 0.42);
      opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s;
    }
    .sidebar-backdrop.show { opacity: 1; visibility: visible; }
    @media (min-width: 769px) { .sidebar-backdrop { display: none !important; } }

    /* ============ 底部栏 ============ */
    .bottom-bar {
      height: var(--bottombar-h); background: linear-gradient(180deg, var(--bg-panel), var(--bg-cave));
      border-top: 1px solid var(--gold-deep); display: flex; align-items: center;
      padding: 0 14px; gap: 6px; flex-shrink: 0; overflow-x: auto;
    }
    .bottom-bar .bb-item {
      display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px;
      border-radius: var(--radius-sm); cursor: pointer; color: var(--text-cream);
      transition: background 0.2s; font-size: 13px; white-space: nowrap; flex-shrink: 0;
    }
    .bottom-bar .bb-item:hover { background: rgba(255, 109, 36, 0.14); color: var(--gold-bright); }
    .bottom-bar .bb-icon { font-size: 18px; }
    .bottom-bar .bb-divider { width: 1px; height: 24px; background: rgba(255, 109, 36, 0.18); margin: 0 2px; flex-shrink: 0; }
    .bottom-bar .bb-spacer { flex: 1; }

    /* ============ 通用组件 ============ */
    .card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px; box-shadow: var(--shadow); transition: border-color 0.3s;
    }
    .card-title {
      font-size: 16px; color: var(--gold-bright); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px; font-weight: 700;
    }
    .card-title .title-icon { font-size: 19px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 0 20px; border: none; border-radius: var(--radius-sm);
      font-family: var(--font-base); font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #FFFDF8; box-shadow: 0 2px 8px rgba(255, 109, 36, 0.22);
    }
    .btn-gold:hover { filter: brightness(1.04); }
    .btn-gold:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid var(--gold-deep); color: var(--gold-dark); }
    .btn-outline:hover { background: rgba(255, 109, 36, 0.10); color: var(--gold-bright); }
    .btn-danger { background: var(--color-danger); color: #fff; }
    .btn-sm { min-height: 38px; padding: 0 14px; font-size: 13px; }
    .btn-lg { min-height: 50px; padding: 0 30px; font-size: 16px; }
    /* 输入框（font-size>=16px 防 iOS 聚焦放大） */
    .input, .textarea, .select {
      width: 100%; background: var(--bg-dark); border: 1px solid var(--line);
      border-radius: var(--radius-sm); padding: 11px 13px; color: var(--text-cream);
      font-size: 16px; font-family: var(--font-base); transition: border-color 0.2s;
    }
    .input:focus, .textarea:focus, .select:focus {
      outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 109, 36, 0.12);
    }
    .textarea { resize: vertical; min-height: 80px; }
    .input::placeholder, .textarea::placeholder { color: var(--text-dim); }
    .tag {
      display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 500;
    }
    .tag-gold { background: rgba(255, 109, 36, 0.14); color: var(--gold-bright); border: 1px solid rgba(255, 109, 36, 0.26); }
    .tag-success { background: rgba(39, 169, 115, 0.16); color: var(--color-success); border: 1px solid rgba(39, 169, 115, 0.30); }
    .tag-danger { background: rgba(232, 74, 60, 0.16); color: var(--color-danger); border: 1px solid rgba(232, 74, 60, 0.30); }
    .tag-info { background: rgba(138, 123, 232, 0.16); color: var(--color-info); border: 1px solid rgba(138, 123, 232, 0.30); }
    .progress-bar {
      width: 100%; height: 8px; background: var(--bg-dark);
      border-radius: 4px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(39, 53, 47, 0.18);
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold-bright));
      border-radius: 4px; transition: width 0.5s ease;
    }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th {
      text-align: left; padding: 9px 10px; color: var(--gold-dark); font-weight: 600;
      border-bottom: 2px solid var(--gold-deep); white-space: nowrap;
    }
    .data-table td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); color: var(--text-cream); }
    .data-table tr:hover td { background: rgba(255, 109, 36, 0.06); }
    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-5 { grid-template-columns: repeat(5, 1fr); }
    .grid-6 { grid-template-columns: repeat(6, 1fr); }

    /* ============ 首页-金矿主控 ============ */
    .assets-overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
    .asset-card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px; text-align: center; box-shadow: var(--shadow);
    }
    .asset-card .asset-icon { font-size: 30px; margin-bottom: 6px; }
    .asset-card .asset-label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
    .asset-card .asset-value {
      font-size: 30px; color: var(--gold-bright); font-weight: 700; line-height: 1;
    }
    .asset-card .asset-unit { font-size: 13px; color: var(--gold-dark); margin-left: 3px; }
    .task-quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
    .task-quick-card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; cursor: pointer; transition: all 0.25s;
    }
    .task-quick-card:hover { border-color: var(--gold); background: var(--bg-card-hover); }
    .task-quick-card .tq-header { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
    .task-quick-card .tq-icon {
      font-size: 22px; width: 38px; height: 38px; display: flex; align-items: center;
      justify-content: center; background: rgba(255, 109, 36, 0.10); border-radius: var(--radius-sm);
    }
    .task-quick-card .tq-name { font-size: 14px; color: var(--text-cream); font-weight: 500; }
    .task-quick-card .tq-coin { font-size: 12px; color: var(--gold-dark); }
    .task-quick-card .tq-status { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .task-quick-card.completed { opacity: 0.62; }
    .task-quick-card.completed .tq-icon { background: rgba(39, 169, 115, 0.12); }
    .notification-item {
      display: flex; align-items: flex-start; gap: 11px; padding: 11px;
      border-radius: var(--radius-sm); background: rgba(39, 53, 47, 0.06); margin-bottom: 7px;
    }
    .notification-item .notif-icon { font-size: 19px; flex-shrink: 0; margin-top: 1px; }
    .notification-item .notif-content { flex: 1; }
    .notification-item .notif-title { font-size: 13px; color: var(--text-cream); font-weight: 500; }
    .notification-item .notif-desc { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .notification-item .notif-time { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
    .briefing-stat {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 0; border-bottom: 1px solid var(--line-soft);
    }
    .briefing-stat:last-child { border-bottom: none; }
    .briefing-stat .bs-label { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .briefing-stat .bs-value { font-size: 16px; color: var(--gold-bright); font-weight: 600; }

    /* ============ 模块头 ============ */
    .module-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .module-header .mh-icon {
      font-size: 26px; width: 46px; height: 46px; display: flex; align-items: center;
      justify-content: center; background: rgba(255, 109, 36, 0.10);
      border: 1px solid var(--gold-deep); border-radius: var(--radius);
    }
    .module-header .mh-title { font-size: 20px; color: var(--gold-bright); font-weight: 700; }
    .module-header .mh-desc { font-size: 12px; color: var(--text-muted); }
    .module-header .mh-spacer { flex: 1; }
    .module-header .mh-coin-reward {
      display: flex; align-items: center; gap: 6px; padding: 6px 13px;
      background: rgba(255, 109, 36, 0.12); border: 1px solid var(--gold-deep);
      border-radius: 20px; font-size: 14px; color: var(--gold-bright); font-weight: 600;
    }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    .form-row { display: flex; gap: 11px; }
    .form-row > * { flex: 1; }
    .image-upload {
      width: 100%; min-height: 64px; border: 1px dashed var(--gold-deep); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px;
      cursor: pointer; transition: all 0.2s; background: var(--bg-dark); color: var(--text-muted);
      padding: 10px; word-break: break-all; text-align: center; font-size: 13px;
    }
    .image-upload:hover { border-color: var(--gold); color: var(--gold-dark); background: rgba(255, 109, 36, 0.06); }
    .image-upload .upload-text { font-size: 13px; }
    .image-upload .upload-icon { font-size: 24px; }
    .record-list { max-height: 400px; overflow-y: auto; }
    .record-item {
      display: flex; align-items: center; gap: 11px; padding: 9px 11px;
      background: rgba(39, 53, 47, 0.06); border-radius: var(--radius-sm); margin-bottom: 7px;
      border-left: 3px solid var(--gold-deep);
    }
    .record-item .ri-content { flex: 1; min-width: 0; }
    .record-item .ri-title { font-size: 14px; color: var(--text-cream); }
    .record-item .ri-meta { font-size: 12px; color: var(--text-muted); }
    .record-item .ri-value { font-size: 14px; color: var(--gold-bright); font-weight: 600; flex-shrink: 0; }

    /* ============ 商城 ============ */
    .shop-tabs { display: flex; gap: 3px; margin-bottom: 14px; border-bottom: 1px solid var(--gold-deep); overflow-x: auto; }
    .shop-tab { padding: 9px 16px; cursor: pointer; color: var(--text-muted); font-size: 14px; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
    .shop-tab:hover { color: var(--gold-dark); }
    .shop-tab.active { color: var(--gold-bright); border-bottom-color: var(--gold-bright); font-weight: 600; }
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    .shop-item {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; text-align: center; transition: all 0.25s;
    }
    .shop-item:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: var(--shadow); }
    .shop-item .si-image { font-size: 44px; margin-bottom: 6px; min-height: 56px; display: flex; align-items: center; justify-content: center; }
    .shop-item .si-name { font-size: 14px; color: var(--text-cream); font-weight: 500; margin-bottom: 4px; }
    .shop-item .si-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; min-height: 30px; }
    .shop-item .si-price {
      display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 17px;
      color: var(--gold-bright); font-weight: 700; margin-bottom: 8px;
    }
    .shop-item .si-owned {
      position: absolute; top: 7px; right: 7px; font-size: 10px; padding: 2px 7px;
      background: rgba(39, 169, 115, 0.18); color: var(--color-success); border-radius: 10px;
    }

    /* ============ 小屋 ============ */
    .cabin-layout { display: grid; grid-template-columns: 1fr 260px; gap: 14px; }
    .cabin-canvas {
      background: linear-gradient(135deg, var(--bg-cave), var(--bg-dark));
      border: 1px solid var(--gold-deep); border-radius: var(--radius);
      min-height: 360px; padding: 14px; display: grid;
      grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(4, 1fr); gap: 6px;
    }
    .cabin-tile {
      background: rgba(255, 109, 36, 0.06); border: 1px dashed rgba(255, 109, 36, 0.18);
      border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; min-height: 70px; position: relative; padding: 4px;
    }
    .cabin-tile:hover { background: rgba(255, 109, 36, 0.12); border-color: var(--gold); }
    .cabin-tile.has-item { background: rgba(255, 109, 36, 0.10); border-style: solid; border-color: rgba(255, 109, 36, 0.28); }
    .cabin-tile .tile-furniture { font-size: clamp(20px, 5vw, 34px); text-align: center; }
    .cabin-tile .tile-label { position: absolute; bottom: 2px; font-size: 9px; color: var(--text-muted); }
    .cabin-inventory { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; max-height: 420px; overflow-y: auto; }
    .cabin-inv-item {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px;
      background: rgba(39, 53, 47, 0.06); border-radius: var(--radius-sm); margin-bottom: 6px;
      cursor: pointer; transition: all 0.2s;
    }
    .cabin-inv-item:hover { background: rgba(255, 109, 36, 0.10); }
    .cabin-inv-item.selected { background: rgba(255, 109, 36, 0.14); border: 1px solid var(--gold); }
    .cabin-inv-item .cii-icon { font-size: 22px; }
    .cabin-inv-item .cii-name { font-size: 13px; color: var(--text-cream); flex: 1; }
    .cabin-inv-item .cii-count { font-size: 12px; color: var(--text-muted); }

    /* ============ 宠物 ============ */
    .pet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .pet-card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-lg);
      padding: 18px; text-align: center; transition: all 0.3s;
    }
    .pet-card:hover { border-color: var(--gold); box-shadow: var(--shadow); }
    .pet-avatar { font-size: 50px; margin-bottom: 6px; }
    .pet-name { font-size: 17px; color: var(--gold-bright); margin-bottom: 3px; font-weight: 700; }
    .pet-type { font-size: 12px; color: var(--text-muted); margin-bottom: 11px; }
    .pet-stats { text-align: left; margin-bottom: 11px; }
    .pet-stat { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .pet-stat .ps-label { font-size: 12px; color: var(--text-muted); width: 46px; flex-shrink: 0; }
    .pet-stat .ps-bar { flex: 1; height: 9px; background: var(--bg-dark); border-radius: 5px; overflow: hidden; }
    .pet-stat .ps-fill { height: 100%; border-radius: 5px; transition: width 0.5s; }
    .ps-fill.hunger { background: linear-gradient(90deg, #FF8A4C, #FF6D24); }
    .ps-fill.mood { background: linear-gradient(90deg, #4FC08A, #27A973); }
    .ps-fill.health { background: linear-gradient(90deg, #8A7BE8, #6F5FD1); }
    .pet-stat .ps-value { font-size: 11px; color: var(--text-muted); width: 26px; text-align: right; }
    .pet-actions { display: flex; gap: 6px; justify-content: center; }
    .pet-action-btn {
      padding: 8px 11px; border: 1px solid var(--gold-deep); background: transparent;
      color: var(--gold-dark); border-radius: var(--radius-sm); cursor: pointer; font-size: 12px;
      display: flex; align-items: center; gap: 4px; min-height: 40px;
    }
    .pet-action-btn:hover { background: rgba(255, 109, 36, 0.10); color: var(--gold-bright); }
    .pet-action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ============ 成就 ============ */
    .achievement-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .achievement-card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; display: flex; gap: 11px; transition: all 0.25s;
    }
    .achievement-card.unlocked { border-color: var(--gold); background: linear-gradient(135deg, rgba(255, 109, 36, 0.06), var(--bg-card)); }
    .achievement-card.locked { opacity: 0.6; }
    .ach-icon {
      font-size: 32px; flex-shrink: 0; width: 46px; height: 46px; display: flex;
      align-items: center; justify-content: center; background: rgba(255, 109, 36, 0.10); border-radius: 50%;
    }
    .achievement-card.unlocked .ach-icon { background: rgba(255, 109, 36, 0.16); }
    .ach-info { flex: 1; }
    .ach-name { font-size: 14px; color: var(--gold-bright); font-weight: 600; margin-bottom: 2px; }
    .ach-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .ach-reward { font-size: 12px; color: var(--gold-dark); }

    /* ============ 背包 ============ */
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 11px; }
    .inv-item {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 11px; text-align: center; transition: all 0.2s;
    }
    .inv-item:hover { border-color: var(--gold); transform: translateY(-1px); }
    .inv-item .ii-icon { font-size: 32px; margin-bottom: 3px; }
    .inv-item .ii-name { font-size: 12px; color: var(--text-cream); margin-bottom: 2px; }
    .inv-item .ii-count { font-size: 11px; color: var(--gold-dark); }

    /* ============ 模态框 ============ */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(39, 53, 47, 0.45); display: none;
      align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(3px);
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: linear-gradient(135deg, var(--bg-panel), var(--bg-cave)); border: 1px solid var(--gold-deep);
      border-radius: var(--radius-lg); padding: 20px; max-width: 480px; width: 100%;
      max-height: 82vh; overflow-y: auto;
    }
    .modal-title { font-size: 18px; color: var(--gold-bright); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
    .modal-close { cursor: pointer; font-size: 22px; color: var(--text-muted); }
    .modal-close:hover { color: var(--color-danger); }

    /* 金币飞入动画 */
    @keyframes coinFly { 0% { transform: scale(0) rotate(0); opacity: 0; } 50% { transform: scale(1.25) rotate(180deg); opacity: 1; } 100% { transform: scale(1) rotate(360deg); opacity: 1; } }
    .coin-anim { animation: coinFly 0.6s ease-out; }

    /* Toast */
    .toast-container { position: fixed; top: 64px; right: 14px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; max-width: 80vw; }
    .toast {
      background: linear-gradient(135deg, var(--bg-panel), var(--bg-cave)); border: 1px solid var(--gold-deep);
      border-radius: var(--radius-sm); padding: 11px 16px; color: var(--text-cream); font-size: 14px;
      box-shadow: 0 3px 14px rgba(39, 53, 47, 0.30); display: flex; align-items: center; gap: 9px;
      animation: toastSlide 0.3s ease-out; min-width: 180px;
    }
    .toast.success { border-left: 4px solid var(--color-success); }
    .toast.warning { border-left: 4px solid var(--color-warning); }
    .toast.danger { border-left: 4px solid var(--color-danger); }
    .toast.info { border-left: 4px solid var(--color-info); }
    @keyframes toastSlide { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* 空状态 */
    .empty-state { text-align: center; padding: 36px 18px; color: var(--text-dim); }
    .empty-state .es-icon { font-size: 44px; margin-bottom: 10px; opacity: 0.6; }
    .empty-state .es-text { font-size: 14px; }

    /* 单词卡 */
    .word-card {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-panel)); border: 1px solid var(--gold-deep);
      border-radius: var(--radius-lg); padding: 20px; text-align: center; margin-bottom: 14px;
    }
    .word-card .wc-word { font-size: 30px; font-weight: 700; color: var(--gold-bright); margin-bottom: 6px; }
    .word-card .wc-phonetic { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; font-style: italic; }
    .word-card .wc-meaning { font-size: 16px; color: var(--text-cream); margin-bottom: 14px; }

    /* 副业工坊结果 */
    .generated-content { background: var(--bg-dark); border: 1px solid var(--gold-deep); border-radius: var(--radius-sm); padding: 14px; margin-top: 12px; }
    .generated-section { margin-bottom: 14px; }
    .generated-section:last-child { margin-bottom: 0; }
    .generated-section .gs-title { font-size: 13px; color: var(--gold-dark); font-weight: 600; margin-bottom: 5px; }
    .generated-section .gs-content { font-size: 13px; color: var(--text-cream); line-height: 1.8; white-space: pre-wrap; }

    /* 报表 */
    .report-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; margin-bottom: 18px; }
    .report-stat { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
    .report-stat .rs-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .report-stat .rs-value { font-size: 22px; color: var(--gold-bright); font-weight: 700; }

    /* 设置 */
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--line-soft); gap: 12px; }
    .setting-row:last-child { border-bottom: none; }
    .setting-row .sr-label { font-size: 14px; color: var(--text-cream); }
    .setting-row .sr-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .toggle {
      width: 44px; height: 26px; background: var(--bg-dark); border: 1px solid var(--gold-deep);
      border-radius: 13px; cursor: pointer; position: relative; transition: background 0.2s; flex-shrink: 0;
    }
    .toggle.on { background: rgba(255, 109, 36, 0.22); }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
      background: var(--text-muted); border-radius: 50%; transition: all 0.2s;
    }
    .toggle.on::after { left: 20px; background: var(--gold-bright); }

    /* 页面过渡 */
    .page-content { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ============ iPhone / 移动端适配 ============ */
    @media (max-width: 1024px) {
      .assets-overview { grid-template-columns: 1fr; }
      .task-quick-grid { grid-template-columns: repeat(2, 1fr); }
      .cabin-layout { grid-template-columns: 1fr; }
      .report-summary { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      /* 移动端：侧边栏改为左侧滑出抽屉，顶部显示菜单按钮 */
      .menu-toggle { display: flex; }
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
        width: 82%; max-width: 300px;
        transform: translateX(-100%); transition: transform 0.3s ease;
        border-right: 1px solid var(--side-line);
        box-shadow: 4px 0 24px rgba(39, 53, 47, 0.28);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-header { display: block; }
      .sidebar-bottom { display: flex; }
      .nav-section-title { display: none; }
      .main-content { padding: 14px; }
      .grid-2, .grid-3, .grid-4, .grid-5, .grid-6 { grid-template-columns: 1fr; }
      .task-quick-grid { grid-template-columns: 1fr; }
      .report-summary { grid-template-columns: repeat(2, 1fr); }
      .cabin-canvas { min-height: 300px; }
    }
    @media (max-width: 420px) {
      .report-summary { grid-template-columns: 1fr; }
    }
  /* ============ 江湖·装备三卡（观感） ============ */

    .gear-slot-name { width: 34px; color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
    .gear-name { font-weight: 600; color: var(--text-warm); }

      font-size: 11px; font-weight: 600; line-height: 1.6; vertical-align: 1px; }

    .focus-card .quick-todo { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

    .focus-card .quick-todo .input[type="date"] { max-width: 150px; }

    .quad-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }

    .rv-lb { width: 74px; flex: none; font-size: 12.5px; color: var(--ink-2); }
    .rv-num { width: 42px; flex: none; text-align: right; font-size: 12px; font-weight: 800; color: var(--text-warm); }
    .rv-sub { width: 40px; flex: none; text-align: right; font-size: 11px; color: var(--ink-3); }
    .rv-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 4px; }
    .rv-kcol { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
    .rv-kcol .kv { font-size: 19px; font-weight: 800; color: var(--text-cream); }
    .rv-kcol .kv.ok { color: var(--color-success); }
    .rv-kcol .kv.no { color: var(--color-danger); }
    .rv-kcol .kl { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
    .rv-kcol .kr { font-size: 11.5px; font-weight: 700; margin-top: 3px; color: var(--ink-2); }
    .rv-watch { font-size: 12.5px; color: var(--ink-2); padding: 4px 0; }
    .rv-watch.over { color: var(--color-danger); font-weight: 700; }
    .rv-hint { font-size: 12.5px; color: var(--ink-3); background: rgba(39,53,47,.04); border-radius: var(--radius-sm); padding: 10px 12px; margin: 8px 0 2px; line-height: 1.6; }
    .rv-plat { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; color: var(--ink-2); }
    .rv-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .rv-big { font-size: 22px; font-weight: 800; color: var(--text-cream); }
    .rv-small { font-size: 12px; color: var(--ink-3); }
    @media (max-width: 900px) { .rv-two { grid-template-columns: 1fr; } .rv-mnav { width: 100%; } }

  /* ============================================================
     utopia 移植 · 第四期：任务进程总览（异源叠加日历 + 当日全集）
     ============================================================ */
    .p4-legend { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin: 0 0 10px; padding: 9px 12px; background: var(--sunken); border-radius: var(--radius-sm); }
    .p4-lg { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); cursor: pointer; user-select: none; }
    .p4-lg i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
    .p4-lg.off { opacity: .38; text-decoration: line-through; }
    .p4-mk { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin: 2px 1.5px 0; }
    .p4-days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .p4-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 10px; min-height: 66px; }
    .p4-col-h { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-bottom: 6px; font-weight: 700; }
    .p4-li { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; color: var(--text-cream); padding: 3px 0; line-height: 1.45; }
    .p4-li .s { color: var(--ink-3); font-size: 11px; }
    .p4-li.done { color: var(--ink-3); text-decoration: line-through; }
    .p4-li.over { color: var(--color-danger); }
    .p4-li .chk { cursor: pointer; flex: none; width: 14px; height: 14px; border: 1px solid var(--line); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; margin-top: 1px; }
    .p4-none { font-size: 12px; color: var(--ink-3); padding: 3px 0; }
    .p4-drop { outline: 2px dashed var(--gold) !important; outline-offset: -2px; }
    .p4-drag { opacity: .45; }
    .todo-item[draggable="true"] { cursor: grab; }
    @media (max-width: 900px) { .p4-days { grid-template-columns: 1fr 1fr; } }
    .utp-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .utp-card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .utp-card-title { font-weight: 800; font-size: 15px; color: var(--text-cream); }
    .utp-note { font-size: 12px; color: var(--text-muted); }
    .utp-notice { display: flex; gap: 10px; align-items: flex-start; background: rgba(255,109,36,0.06); border: 1px solid rgba(255,109,36,0.18); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: var(--text-warm); margin-bottom: 14px; line-height: 1.6; }
    .utp-notice b { color: var(--gold-bright); }
    .utp-grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .utp-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 900px) { .utp-grid4, .utp-grid3 { grid-template-columns: repeat(2, 1fr); } }
    .utp-ring { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 12px 8px; }
    .utp-ring svg { display: block; }
    .utp-ring svg circle { fill: none; stroke-width: 7; }
    .utp-ring .tr { stroke: var(--line); }
    .utp-ring .fg { stroke: var(--gold); stroke-linecap: round; transition: stroke-dasharray .35s ease; }
    .utp-ring .pct { font-size: 15px; font-weight: 800; fill: var(--text-cream); }
    .utp-ring .lbl { font-size: 12.5px; font-weight: 700; color: var(--text-warm); }
    .utp-ring .sub { font-size: 11px; color: var(--text-muted); }
    .utp-rows { display: flex; flex-direction: column; gap: 8px; }
    .utp-row { display: flex; align-items: center; gap: 10px; background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 10px 12px; }
    .utp-row .rt { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text-warm); }
    .utp-row .rt .sub { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
    .utp-row.done .rt { text-decoration: line-through; color: var(--text-dim); }
    .utp-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(255,109,36,0.12); color: var(--gold-bright); font-weight: 700; white-space: nowrap; }
    .utp-tag.t-done { background: rgba(39,169,115,0.14); color: var(--color-success); }
    .utp-tag.t-pub  { background: rgba(39,169,115,0.14); color: var(--color-success); }
    .utp-tag.t-make { background: rgba(138,123,232,0.14); color: var(--color-info); }
    .utp-tag.t-adopt{ background: rgba(232,163,61,0.16); color: var(--color-warning); }
    .utp-tag.t-over { background: rgba(232,74,60,0.12); color: var(--color-danger); }
    .utp-act { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--bg-card); color: var(--text-warm); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all .15s ease; }
    .utp-act:hover { border-color: var(--gold); color: var(--gold-bright); background: rgba(255,109,36,0.06); }
    .utp-act.danger:hover { border-color: var(--color-danger); color: var(--color-danger); background: rgba(232,74,60,0.06); }
    .utp-form { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 14px; align-items: end; }
    .utp-form .f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); }
    .utp-form .f.wide { grid-column: span 2; }
    .utp-form .f.full { grid-column: 1 / -1; }
    .utp-form input, .utp-form select, .utp-form textarea { border: 1px solid var(--line); background: var(--bg-card); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; color: var(--text-warm); font-family: inherit; width: 100%; box-sizing: border-box; }
    .utp-form input:focus, .utp-form select:focus, .utp-form textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,109,36,0.12); }
    @media (max-width: 900px) { .utp-form { grid-template-columns: repeat(2, 1fr); } .utp-form .f.full { grid-column: 1 / -1; } }
    .utp-pipe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    @media (max-width: 900px) { .utp-pipe { grid-template-columns: repeat(2, 1fr); } }
    .utp-lane { background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 10px; min-height: 110px; display: flex; flex-direction: column; gap: 8px; }
    .utp-lane-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 800; color: var(--text-warm); padding: 0 2px 6px; border-bottom: 1px dashed var(--line); }
    .utp-lane-head .n { font-size: 11px; color: var(--text-dim); font-weight: 700; }
    .utp-item { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--text-warm); }
    .utp-item .it-t { font-weight: 700; line-height: 1.4; }
    .utp-item .it-m { display: flex; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--text-muted); flex-wrap: wrap; }
    .utp-item .it-ops { display: flex; gap: 6px; margin-top: 7px; }
    .utp-item .it-ops .utp-act { padding: 2px 8px; font-size: 11px; }
    .utp-prog { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
    .utp-prog i { display: block; height: 100%; }
    .utp-prog-legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--text-muted); margin-top: 8px; flex-wrap: wrap; }
    .utp-prog-legend b { color: var(--text-warm); }
    .utp-plat { background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 12px; }
    .utp-plat .ph { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .utp-plat .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .utp-plat .pn { font-weight: 800; font-size: 13.5px; color: var(--text-warm); }
    .utp-plat .pr { font-size: 11.5px; color: var(--gold-bright); font-weight: 700; margin-bottom: 6px; }
    .utp-plat .pd { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }
    .utp-plat .pw { margin-top: 8px; font-size: 11.5px; color: var(--text-warm); font-weight: 700; }
    .utp-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
    @media (max-width: 900px) { .utp-kpi { grid-template-columns: repeat(2, 1fr); } }
    .utp-kpi .k { background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
    .utp-kpi .k .v { font-size: 20px; font-weight: 800; color: var(--text-cream); }
    .utp-kpi .k .v.ok { color: var(--color-success); }
    .utp-kpi .k .v.no { color: var(--color-danger); }
    .utp-kpi .k .l { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
    .utp-filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .utp-fbtn { border: 1px solid var(--line); background: var(--bg-card); color: var(--text-muted); font-size: 12px; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 700; transition: all .15s ease; }
    .utp-fbtn.on { background: var(--gold); border-color: var(--gold); color: #fff; }
    .utp-empty { text-align: center; color: var(--text-dim); font-size: 12.5px; padding: 18px 0; }
    .utp-demo-btn { border: 1px dashed var(--line); background: transparent; color: var(--text-dim); font-size: 11.5px; border-radius: 999px; padding: 3px 12px; cursor: pointer; }
    .utp-demo-btn:hover { color: var(--color-danger); border-color: var(--color-danger); }

  // ============ 工具函数 ============
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function dateStr(d) {
    if (!d) return '';
    const dt = new Date(d);
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }
  function getStreak(records) {
    if (!records || records.length === 0) return 0;
    const dates = [...new Set(records.map(r => dateStr(r.date)))].sort().reverse();
    let streak = 0;
    let checkDate = new Date();
    for (let i = 0; i < dates.length; i++) {
      const ds = dateStr(checkDate);
      if (dates.includes(ds)) {
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      } else if (i === 0) {
        checkDate.setDate(checkDate.getDate() - 1);
        if (dates.includes(dateStr(checkDate))) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else break;
      } else break;
    }
    return streak;
  }
  function getMaxStreak(state) {
    const allDates = new Set();
    Object.values(state.tasks).forEach(task => {
      if (task.records) task.records.forEach(r => allDates.add(dateStr(r.date)));
      if (task.notes) task.notes.forEach(r => allDates.add(dateStr(r.date)));
      if (task.projects) task.projects.forEach(r => allDates.add(dateStr(r.date)));
      if (task.claimDates) task.claimDates.forEach(d => allDates.add(d));
    });
    const sorted = [...allDates].sort();
    if (sorted.length === 0) return 0;
    let maxStreak = 1, currentStreak = 1;
    for (let i = 1; i < sorted.length; i++) {
      const prev = new Date(sorted[i-1]);
      const curr = new Date(sorted[i]);
      const diff = (curr - prev) / (1000 * 60 * 60 * 24);
      if (diff === 1) { currentStreak++; maxStreak = Math.max(maxStreak, currentStreak); }
      else currentStreak = 1;
    }
    return maxStreak;
  }

    });
  }

  // ============ 状态管理 ============
  let _state = null;
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        _state = JSON.parse(raw);
        if (!_state.version || _state.version !== DATA_VERSION) _state = migrateState(_state);
        _state = ensureFields(_state);
      } else {
        _state = defaultState();
        saveState();
      }
      checkDailyReset();
      return _state;
    } catch (e) {
      console.error('加载数据失败:', e);
      _state = defaultState();
      saveState();
      return _state;
    }
  }
  function ensureFields(state) {
    const def = defaultState();
    for (const key in def) {
      if (def[key] && typeof def[key] === 'object' && !Array.isArray(def[key])) {
        if (!state[key]) state[key] = def[key];
        else { for (const subKey in def[key]) { if (state[key][subKey] === undefined) state[key][subKey] = def[key][subKey]; } }
      } else if (state[key] === undefined) {
        state[key] = def[key];
      }
    }
    if (!Array.isArray(state.cabin.placed)) state.cabin.placed = new Array(24).fill(null);
    return state;
  }
  function migrateState(oldState) {
    const newState = defaultState();
    newState.coins = oldState.coins || 0;
    newState.stats = oldState.stats || newState.stats;
    newState.tasks = oldState.tasks || newState.tasks;
    newState.pets = oldState.pets || [];
    newState.inventory = oldState.inventory || [];
    newState.cabin = oldState.cabin || newState.cabin;
    newState.achievements = oldState.achievements || [];
    newState.reports = oldState.reports || newState.reports;
    newState.checkinHistory = oldState.checkinHistory || [];
    newState.jianghu = oldState.jianghu || newState.jianghu;
    newState.version = DATA_VERSION;
    return newState;
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(_state)); }
    catch (e) { console.error('保存数据失败:', e); showToast('数据保存失败！请检查存储空间', 'danger'); }
  }
  function getState() { if (!_state) _state = loadState(); return _state; }

  // ============ 金币系统 ============
  function addCoins(amount, reason) {

      state.stats.totalEarned += amount;
      state.stats.monthlyEarned = (state.stats.monthlyEarned || 0) + amount;
      state.stats.todayEarned = (state.stats.todayEarned || 0) + amount;

      state.stats.monthlySpent = (state.stats.monthlySpent || 0) + Math.abs(amount);
      state.stats.todaySpent = (state.stats.todaySpent || 0) + Math.abs(amount);
    }
    saveState();
  }

    // 桌宠打卡动画：thinking → tool → done
    state.pets.forEach(pet => {
      if (pet.petId) PetManager.playChain(pet, true);
    });
    // 打卡的额外产出：江湖里的「修炼时辰」
    const hours = window.Jianghu ? Jianghu.earnHours(taskKey, config.name) : 0;
    if (hours) showToast(`⚔️ 换来 ${hours} 个修炼时辰，去「江湖」闭关`, 'info');
    return true;
  }

  // ============ 宠物衰减 ============
  function decayPetStats() {
    const state = getState();
    if (!state.pets || state.pets.length === 0) return;
    let changed = false;
    const now = new Date();
    state.pets.forEach(pet => {
      const last = new Date(pet.lastUpdate || pet.adoptedAt);
      const hoursPassed = (now - last) / (1000 * 60 * 60);
      if (hoursPassed >= 6) {
        const decaySteps = Math.floor(hoursPassed / 6);
        pet.hunger = Math.max(0, pet.hunger - decaySteps * 5);
        pet.mood = Math.max(0, pet.mood - decaySteps * 3);
        if (pet.hunger < 20) pet.health = Math.max(0, pet.health - decaySteps * 2);
        pet.lastUpdate = now.toISOString();
        changed = true;
      }
    });
    if (changed) saveState();
  }

  // ============ 成就检查 ============
  function checkAchievements() {
    const state = getState();
    const newlyUnlocked = [];
    ACHIEVEMENTS.forEach(ach => {
      if (!state.achievements.includes(ach.id)) {
        if (ach.check(state)) {
          state.achievements.push(ach.id);
          addCoins(ach.reward, `成就: ${ach.name}`);
          newlyUnlocked.push(ach);
        }
      }
    });
    if (newlyUnlocked.length > 0) {
      saveState();
      newlyUnlocked.forEach(ach => showToast(`🏆 成就解锁: ${ach.name}！获得 ${ach.reward} 金币`, 'success'));
    }
  }

  // ============ 日报 ============
  function generateDailyReport(date) {
    const state = getState();
    const reportDate = date || todayStr();
    const dayTasks = {};
    let dayCoinsEarned = 0, dayCoinsSpent = 0;
    Object.keys(TASK_CONFIG).forEach(key => {
      const task = state.tasks[key];
      const claimed = task.claimDates && task.claimDates.includes(reportDate);
      dayTasks[key] = { claimed, coins: claimed ? TASK_CONFIG[key].coinReward : 0 };
      if (claimed) dayCoinsEarned += TASK_CONFIG[key].coinReward;
    });
    const dietRecords = state.tasks.diet.records.filter(r => dateStr(r.date) === reportDate);
    const exerciseRecords = state.tasks.exercise.records.filter(r => dateStr(r.date) === reportDate);
    const caloriesIn = dietRecords.reduce((s, r) => s + (r.calories || 0), 0);
    const caloriesOut = exerciseRecords.reduce((s, r) => s + (r.caloriesBurned || 0), 0);
    const expenses = state.tasks.accounting.records.filter(r => dateStr(r.date) === reportDate);
    const totalExpense = expenses.reduce((s, r) => s + (r.amount || 0), 0);
    const petInteractions = state.checkinHistory.filter(h => h.date === reportDate && h.taskKey === 'pet_interact');
    const report = {
      date: reportDate,
      tasksCompleted: Object.values(dayTasks).filter(t => t.claimed).length,
      totalTasks: 6,
      coinsEarned: dayCoinsEarned, coinsSpent: dayCoinsSpent,
      caloriesIn, caloriesOut, calorieDeficit: caloriesOut - caloriesIn,
      totalExpense, expenseCount: expenses.length,
      petInteractions: petInteractions.length, taskDetails: dayTasks,
    };
    state.reports.daily = state.reports.daily || [];
    const existIdx = state.reports.daily.findIndex(r => r.date === reportDate);
    if (existIdx >= 0) state.reports.daily[existIdx] = report;
    else state.reports.daily.push(report);
    saveState();
    return report;
  }

  // ============ 周报 ============
  function generateWeeklyReport() {
    const state = getState();
    const now = new Date();
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - now.getDay());
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    const startDate = dateStr(weekStart);
    const endDate = dateStr(weekEnd);
    const dailyReports = state.reports.daily.filter(r => r.date >= startDate && r.date <= endDate);
    return {
      startDate, endDate,
      totalCoinsEarned: dailyReports.reduce((s, r) => s + r.coinsEarned, 0),
      totalTasksCompleted: dailyReports.reduce((s, r) => s + r.tasksCompleted, 0),
      avgTasksPerDay: dailyReports.length > 0 ? (dailyReports.reduce((s, r) => s + r.tasksCompleted, 0) / dailyReports.length).toFixed(1) : 0,
      totalCaloriesIn: dailyReports.reduce((s, r) => s + r.caloriesIn, 0),
      totalCaloriesOut: dailyReports.reduce((s, r) => s + r.caloriesOut, 0),
      totalExpense: dailyReports.reduce((s, r) => s + r.totalExpense, 0),
      activeDays: dailyReports.filter(r => r.tasksCompleted > 0).length,
      dailyBreakdown: dailyReports,
    };
  }

  // ============ 月报 ============
  let _reportMonth = '';   /* '' = 当月；否则 'YYYY-MM' */
  function reportMonth() {
    if (_reportMonth && /^\d{4}-\d{2}$/.test(_reportMonth)) return _reportMonth;
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function reportShiftMonth(n) {
    const ym = reportMonth();
    const d = new Date(parseInt(ym.slice(0, 4), 10), parseInt(ym.slice(5, 7), 10) - 1 + n, 1);
    _reportMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    navTo('report-monthly');
  }
  function reportGotoMonth() {
    const el = document.getElementById('rptMonth');
    if (el && el.value) { _reportMonth = el.value; navTo('report-monthly'); }
  }
  function reportThisMonth() { _reportMonth = ''; navTo('report-monthly'); }

  function generateMonthlyReport(ym) {
    const state = getState();
    const use = ym || reportMonth();
    const year = parseInt(use.slice(0, 4), 10);
    const month = parseInt(use.slice(5, 7), 10) - 1;
    const startDate = `${year}-${String(month+1).padStart(2,'0')}-01`;
    const endDate = `${year}-${String(month+1).padStart(2,'0')}-${String(new Date(year, month+1, 0).getDate()).padStart(2,'0')}`;
    const dailyReports = state.reports.daily.filter(r => r.date >= startDate && r.date <= endDate);
    return {
      year, month: month + 1, startDate, endDate,
      totalCoinsEarned: dailyReports.reduce((s, r) => s + r.coinsEarned, 0),
      totalTasksCompleted: dailyReports.reduce((s, r) => s + r.tasksCompleted, 0),
      activeDays: dailyReports.filter(r => r.tasksCompleted > 0).length,
      totalCaloriesIn: dailyReports.reduce((s, r) => s + r.caloriesIn, 0),
      totalCaloriesOut: dailyReports.reduce((s, r) => s + r.caloriesOut, 0),
      totalExpense: dailyReports.reduce((s, r) => s + r.totalExpense, 0),
      bestDay: dailyReports.reduce((best, r) => (!best || r.coinsEarned > best.coinsEarned) ? r : best, null),
      dailyBreakdown: dailyReports,
    };
  }

  function updateSyncPill() {

  const QUADRANTS = [
    { q: 1, name: '重要且紧急',   hint: '马上做',   color: '#E84A3C' },

  /* 统一刷新入口（铁律 9）：renderXxx() 只返回字符串，必须经此写回 DOM。
     传 page 刷新指定页；不传则刷新当前页。渲染函数之间禁止互调，一律走这里。 */
  function refreshPage(page) {
    const target = page || window.currentPage || 'dashboard';
    navTo(target);
  }
  window.refreshPage = refreshPage;

  /* 每日奖励：同一模块一天只给一次时辰，防止加一条完成一条地刷 */
  function awardDailyHours(key, name) {
    const s = getState();
    const today = todayStr();
    s.dailyBonus = s.dailyBonus || {};
    if (s.dailyBonus[key] === today) return 0;
    s.dailyBonus[key] = today;
    saveState();
    return window.Jianghu ? Jianghu.earnHours(key, name) : 0;
  }
  function isOverdue(t) {
    return !t.done && t.due && t.due < todayStr();
  }

  /* ---------- A. 今日焦点 + 四象限 ---------- */
  function addTodo() {
    const input = document.getElementById('todoInput');
    const text = (input && input.value || '').trim();
    if (!text) { showToast('先写一件要做的事', 'warning'); return; }
    const qSel = document.getElementById('todoQuad');
    const dueEl = document.getElementById('todoDue');
    const q = parseInt(qSel && qSel.value || '2', 10);
    const s = getState();
    s.todos = s.todos || [];
    s.todos.push({
      id: 'td_' + Date.now(), text: text,
      q: [1, 2, 3, 4].indexOf(q) >= 0 ? q : 2,
      due: (dueEl && dueEl.value) || '',
      done: false, createdAt: new Date().toISOString(), demo: false,
    });
    if (input) input.value = '';
    saveState(); refreshPage('dashboard');
  }
  function toggleTodo(id) {
    const s = getState();
    const t = (s.todos || []).find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? new Date().toISOString() : null;
    saveState();
    if (t.done) {
      addCoins(1, '待办完成');
      const h = awardDailyHours('todo', '四象限待办');
      if (h) showToast('⚔️ 今日首次完成待办， +' + h + ' 个修炼时辰', 'info');
    }
    refreshPage('dashboard');
  }
  function moveTodo(id, dir) {
    const s = getState();
    const t = (s.todos || []).find(x => x.id === id);
    if (!t) return;
    t.q = Math.min(4, Math.max(1, t.q + dir));
    saveState(); refreshPage('dashboard');
  }
  function delTodo(id) {
    const s = getState();
    s.todos = (s.todos || []).filter(x => x.id !== id);
    if (s.focusId === id) s.focusId = null;
    saveState(); refreshPage('dashboard');
  }
  function setFocus(id) {
    const s = getState();
    s.focusId = (s.focusId === id) ? null : id;
    saveState(); refreshPage('dashboard');
  }
  function clearDemoTodos() {
    const s = getState();
    s.todos = (s.todos || []).filter(t => !t.demo);
    s.focusId = null; saveState(); refreshPage('dashboard');
    showToast('示例待办已清空', 'info');
  }
  function todoRow(t) {
    const over = isOverdue(t);
    const isFocus = getState().focusId === t.id && !t.done;
    return `
        <div class="todo-item${t.done ? ' done' : ''}${isFocus ? ' is-focus' : ''}${over ? ' over' : ''}"
             draggable="${t.done ? 'false' : 'true'}"
             ondragstart="p4DragStart(event,'${t.id}')" ondragend="p4DragEnd(event)">
          <span class="todo-check" onclick="toggleTodo('${t.id}')">${t.done ? '✓' : ''}</span>
          <span class="todo-body">
            <span class="todo-text">${t.text}</span>
            ${over ? '<span class="todo-over">逾期 ' + t.due + '</span>' : ''}
            ${t.due && !over && !t.done ? '<span class="todo-due">' + t.due + '</span>' : ''}
          </span>
          <span class="todo-ops">
            <span class="op" title="提高重要度" onclick="event.stopPropagation();moveTodo('${t.id}',1)">▲</span>
            <span class="op" title="降低重要度" onclick="event.stopPropagation();moveTodo('${t.id}',-1)">▼</span>
            <span class="op" title="删除" onclick="event.stopPropagation();delTodo('${t.id}')">✕</span>
          </span>
        </div>`;
  }
  function quadCell(q) {
    const all = getState().todos || [];
    const open = all.filter(t => t.q === q.q && !t.done && !isOverdue(t));
    const over = all.filter(t => t.q === q.q && !t.done && isOverdue(t));
    const done = all.filter(t => t.q === q.q && t.done);
    return `
      <div class="quad-cell" style="--qc:${q.color}"
           ondragover="p4Allow(event,${q.q})" ondragleave="p4Leave(event)" ondrop="p4DropOn(event,${q.q})">
        <div class="quad-head">
          <span class="quad-name">${q.name}</span>
          <span class="quad-hint">${q.hint} · ${open.length + over.length}</span>
        </div>
        ${over.map(todoRow).join('')}
        ${open.map(todoRow).join('') || (over.length ? '' : '<div class="quad-empty">这一格空着</div>')}
        ${done.slice(-3).map(todoRow).join('')}
      </div>`;
  }
  function focusBlock() {
    const s = getState();
    const open = (s.todos || []).filter(t => !t.done);
    const focus = open.find(t => t.id === s.focusId);
    if (focus) {
      return `
        <div class="focus-now" onclick="setFocus('${focus.id}')">
          <div class="focus-q">现在就做</div>
          <div class="focus-text">${focus.text}</div>
          <div class="focus-meta">点一下取消焦点</div>
        </div>`;
    }
    if (open.length === 0) {
      return `
        <div class="focus-now empty">
          <div class="focus-q">今天很干净</div>
          <div class="focus-text">下面加一件待办、选个象限，它就是你今天的主角</div>
        </div>`;
    }
    const over = open.filter(isOverdue).sort((a, b) => (a.due < b.due ? -1 : 1));
    const top = over[0] || open.slice().sort((a, b) => a.q - b.q)[0];
    return `
      <div class="focus-now suggest" onclick="setFocus('${top.id}')">
        <div class="focus-q">${isOverdue(top) ? '已经逾期，先清掉' : '建议先做'}</div>
        <div class="focus-text">${top.text}</div>
        <div class="focus-meta">来自「${QUADRANTS[top.q - 1].name}」 · 点一下设为今日焦点</div>
      </div>`;
  }
  function renderFocusAndQuads() {
    const s = getState();
    const hasDemo = (s.todos || []).some(t => t.demo);
    return `
    <!-- utopia 移植：今日焦点 + 四象限待办 -->
    <div class="card focus-card">
      <div class="card-title"><span class="title-icon">🎯</span>今天你要先做哪一件小事？</div>
      ${focusBlock()}
      <div class="quick-todo">
        <select class="select" id="todoQuad">
          ${QUADRANTS.map(q => `<option value="${q.q}">${q.name}</option>`).join('')}
        </select>
        <input class="input" id="todoDue" type="date" title="截止日期（可选）">
        <input class="input" id="todoInput" placeholder="加一件待办，回车进四象限…"
               onkeydown="if(event.key==='Enter')addTodo()">
        <button class="btn btn-gold" onclick="addTodo()">＋添加</button>
      </div>
    </div>
    <div class="quad-grid">
      ${QUADRANTS.map(quadCell).join('')}
    </div>
    ${hasDemo ? '<div style="text-align:right;margin:-6px 0 14px;"><button class="btn btn-outline btn-sm" onclick="clearDemoTodos()">清空示例待办</button></div>' : ''}`;
  }

  /* ---------- B. 计划月历 ---------- */
  function addPlan() {
    const g = id => document.getElementById(id);
    const date = g('planDate') && g('planDate').value;
    const text = (g('planText') && g('planText').value || '').trim();
    if (!date) { showToast('先选日期', 'warning'); return; }
    if (!text) { showToast('写一句计划内容', 'warning'); return; }
    const s = getState();
    s.plans = s.plans || [];
    s.plans.push({
      id: 'pl_' + Date.now(), date: date, text: text,
      cat: (g('planCat') && g('planCat').value) || '其他',
      note: (g('planNote') && g('planNote').value) || '',
      span: (g('planSpan') && g('planSpan').value) || '单日',
      done: false, createdAt: new Date().toISOString(), demo: false,
    });
    _plannerSelDate = date;
    saveState(); refreshPage('planner');
  }
  function togglePlan(id) {
    const s = getState();
    const p = (s.plans || []).find(x => x.id === id);
    if (!p) return;
    p.done = !p.done;
    p.doneAt = p.done ? new Date().toISOString() : null;
    saveState();
    if (p.done) {
      const h = awardDailyHours('planner', '计划月历');
      if (h) showToast('⚔️ 今日首次完成计划， +' + h + ' 个修炼时辰', 'info');
    }
    refreshPage('planner');
  }
  function delPlan(id) {
    const s = getState();
    s.plans = (s.plans || []).filter(x => x.id !== id);
    saveState(); refreshPage('planner');
  }
  function pickPlanDate(d) {
    _plannerSelDate = d; refreshPage('planner');
  }
  function planRow(p) {
    const over = !p.done && p.date < todayStr();
    return `
        <div class="record-item plan-item${p.done ? ' done' : ''}${over ? ' over' : ''}">
          <span class="todo-check" onclick="togglePlan('${p.id}')">${p.done ? '✓' : ''}</span>
          <div class="ri-content">
            <div class="ri-title">${p.text} <span class="plan-cat">${p.cat}</span></div>
            <div class="ri-meta">${p.date} · ${p.span}${p.note ? ' · ' + p.note : ''}${over ? ' · <b style="color:var(--color-danger)">逾期</b>' : ''}</div>
          </div>
          <span class="op" title="删除" onclick="delPlan('${p.id}')">✕</span>
        </div>`;
  }
  /* ---- 第四期：异源叠加（计划 / 待办 / 成长 / 经期 / 在制内容） ---- */
  const P4_LAYERS = [
    { k: 'plan',   n: '计划',     c: '#FF6D24' },
    { k: 'todo',   n: '待办截止', c: '#E84A3C' },
    { k: 'grow',   n: '成长截止', c: '#E8A33D' },
    { k: 'period', n: '经期',     c: '#C2456B' },
    { k: 'media',  n: '在制内容', c: '#8A7BE8' },
  ];
  function p4On(s, k) { return !(s.lay && s.lay[k] === false); }
  function p4Toggle(k) {
    const s = getState();
    s.lay = s.lay || {};
    s.lay[k] = !p4On(s, k);
    saveState(); refreshPage('planner');
  }
  function p4Counts(s, iso, today) {
    const c = { plan: 0, todo: 0, grow: 0, period: 0, media: 0 };
    if (p4On(s, 'plan')) c.plan = (s.plans || []).filter(function (p) { return p.date === iso; }).length;
    if (p4On(s, 'todo')) c.todo = (s.todos || []).filter(function (t) { return t.due === iso; }).length;
    if (p4On(s, 'grow')) c.grow = (s.growth || []).filter(function (g) { return g.due === iso; }).length;
    if (p4On(s, 'media')) c.media = ((s.media && s.media.items) || []).filter(function (x) { return x.pub === iso && x.stage !== '已发布'; }).length;
    if (p4On(s, 'period')) {
      const b = s.body || {};
      c.period = (b.records || []).some(function (r) { return r.date === iso && r.periodDay; }) ? 1 : 0;
    }
    return c;
  }
  /* 某日跨模块全集 */
  function p4DayItems(s, iso, today) {
    const out = [];
    if (p4On(s, 'plan')) {
      (s.plans || []).filter(function (p) { return p.date === iso; }).forEach(function (p) {
        out.push({ k: 'plan', text: p.text, done: !!p.done, over: !p.done && iso < today, id: p.id, kind: 'plan', sub: p.cat + (p.span && p.span !== '单日' ? ' · ' + p.span : '') });
      });
    }
    if (p4On(s, 'todo')) {
      (s.todos || []).filter(function (t) { return t.due === iso; }).forEach(function (t) {
        const q = QUADRANTS[t.q - 1];
        out.push({ k: 'todo', text: t.text, done: !!t.done, over: !t.done && iso < today, id: t.id, kind: 'todo', sub: '四象限 · ' + (q ? q.name : '') });
      });
    }
    if (p4On(s, 'grow')) {
      (s.growth || []).filter(function (g) { return g.due === iso; }).forEach(function (g) {
        out.push({ k: 'grow', text: g.name, done: !!g.done, over: !g.done && iso < today, id: g.id, kind: 'grow', sub: (g.dir || '') + ' · ' + (g.pct || 0) + '%' });
      });
    }
    if (p4On(s, 'media')) {
      ((s.media && s.media.items) || []).filter(function (x) { return x.pub === iso && x.stage !== '已发布'; }).forEach(function (x) {
        out.push({ k: 'media', text: x.title, done: false, over: iso < today, id: x.id, kind: 'media', sub: x.stage + ' · ' + x.plat });
      });
    }
    if (p4On(s, 'period')) {
      const b = s.body || {};
      const recs = (b.records || []).filter(function (r) { return r.date === iso && r.periodDay; });
      if (recs.length) out.push({ k: 'period', text: '经期记录', done: true, over: false, id: 'pd_' + iso, kind: 'period', sub: (recs[0].weight ? recs[0].weight + ' 斤' : '') });
    }
    return out;
  }

  function calCell(d, plans, sel, today) {
    const iso = d.iso;
    const s = getState();
    const c = p4Counts(s, iso, today);
    const total = c.plan + c.todo + c.grow + c.period + c.media;
    const cls = ['cal-cell'];
    if (iso === today) cls.push('today');
    if (iso === sel) cls.push('sel');
    if (d.dim) cls.push('dim');
    let dots = '';
    P4_LAYERS.forEach(function (L) {
      const n = c[L.k] || 0;
      if (n) for (let q = 0; q < Math.min(n, 2); q++) dots += '<span class="p4-mk" style="background:' + L.c + '"></span>';
    });
    return `
      <div class="${cls.join(' ')}" onclick="pickPlanDate('${iso}')">
        <span class="cal-day">${d.day}</span>
        ${total ? '<span class="cal-count">' + total + '</span>' : ''}
        <span class="cal-dots">${dots}</span>
      </div>`;
  }

  function renderPlanner() {
    const s = getState();
    const plans = s.plans || [];
    const today = todayStr();
    if (!_plannerSelDate) _plannerSelDate = today;
    const sel = _plannerSelDate;

    /* 四周日程窗：从本周周一开始，28 天 */
    const base = new Date();
    base.setHours(0, 0, 0, 0);
    const dow = (base.getDay() + 6) % 7;              // 周一=0
    base.setDate(base.getDate() - dow);
    const cells = [];
    for (let i = 0; i < 28; i++) {
      const d = new Date(base);
      d.setDate(base.getDate() + i);
      cells.push({
        iso: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'),
        day: d.getDate(), dim: i >= 14 ? true : false,
      });
    }

    const dayPlans = plans.filter(p => p.date === sel).sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
    const overdue = plans.filter(p => !p.done && p.date < today);
    const archived = plans.filter(p => p.done).sort((a, b) => ((b.doneAt || '') < (a.doneAt || '') ? -1 : 1)).slice(0, 12);

    /* 第四期：图例 + 当日跨模块全集 */
    const selCounts = p4Counts(s, sel, today);
    const legend = P4_LAYERS.map(function (L) {
      const on = p4On(s, L.k);
      const n = selCounts[L.k] || 0;
      return '<span class="p4-lg' + (on ? '' : ' off') + '" onclick="p4Toggle(\'' + L.k + '\')" title="点一下切换显示">' +
        '<i style="background:' + L.c + '"></i>' + L.n + (n ? ' ' + n : '') + '</span>';
    }).join('');

    const dayAll = p4DayItems(s, sel, today);
    const groups = [
      { k: 'plan', t: '📆 计划' },
      { k: 'todo', t: '🎯 待办' },
      { k: 'grow', t: '🌱 成长' },
      { k: 'other', t: '📌 其他' },
    ];
    const dayCols = groups.map(function (G) {
      const arr = (G.k === 'other')
        ? dayAll.filter(function (x) { return x.k === 'media' || x.k === 'period'; })
        : dayAll.filter(function (x) { return x.k === G.k; });
      const body = arr.length ? arr.map(function (x) {
        const cls = 'p4-li' + (x.done ? ' done' : '') + (x.over ? ' over' : '');
        let chk = '<span class="chk"></span>';
        if (x.kind === 'plan' || x.kind === 'todo') {
          const fn = x.kind === 'plan' ? 'togglePlan' : 'toggleTodo';
          chk = '<span class="chk" onclick="event.stopPropagation();' + fn + '(\'' + x.id + '\')">' + (x.done ? '✓' : '') + '</span>';
        }
        return '<div class="' + cls + '">' + chk + '<span style="flex:1">' + x.text +
          (x.sub ? '<br><span class="s">' + x.sub + '</span>' : '') + '</span></div>';
      }).join('') : '<div class="p4-none">无</div>';
      return '<div class="p4-col"><div class="p4-col-h"><span>' + G.t + '</span><span>' + arr.length + '</span></div>' + body + '</div>';
    }).join('');

    return `
    <div class="module-header">
      <div class="mh-icon">🧭</div>
      <div><div class="mh-title">计划月历</div><div class="mh-desc">四周日程窗 · 计划 / 待办 / 成长 / 内容 异源叠加</div></div>
      <div class="mh-spacer"></div>
      <div class="header-coin-display"><span class="coin-icon">🗓️</span><span class="coin-amount">${plans.filter(p => !p.done).length}</span></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="title-icon">📆</span>四周日程窗
        <span style="margin-left:auto"><button class="btn btn-outline btn-sm" onclick="pickPlanDate('${today}')">回到今天</button></span></div>
      <div class="p4-legend">${legend}</div>
      <div class="cal-head">${['一', '二', '三', '四', '五', '六', '日'].map(d => '<span>' + d + '</span>').join('')}</div>
      <div class="cal-grid">${cells.map(d => calCell(d, plans, sel, today)).join('')}</div>
      ${overdue.length ? '<div class="overdue-bar">⚠️ 有 ' + overdue.length + ' 条计划过了日期还没做完：<b style="color:var(--color-danger)">' + overdue.slice(0, 3).map(p => p.text).join('、') + '</b></div>' : ''}
    </div>
    <div class="card">
      <div class="card-title"><span class="title-icon">🧭</span>${sel} 任务进程
        <span style="margin-left:auto;font-size:13px;color:var(--ink-3)">共 ${dayAll.length} 项</span></div>
      <div class="p4-days">${dayCols}</div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-title"><span class="title-icon">📝</span>加一条计划</div>
        <div class="form-group"><label class="form-label">日期</label>
          <input class="input" id="planDate" type="date" value="${sel}"></div>
        <div class="form-group"><label class="form-label">计划内容</label>
          <input class="input" id="planText" placeholder="这一天要做什么…" onkeydown="if(event.key==='Enter')addPlan()"></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">归类</label>
            <select class="select" id="planCat">${PLAN_CATS.map(c => '<option>' + c + '</option>').join('')}</select></div>
          <div class="form-group"><label class="form-label">时间周期</label>
            <select class="select" id="planSpan">${PLAN_SPANS.map(c => '<option>' + c + '</option>').join('')}</select></div>
        </div>
        <div class="form-group"><label class="form-label">备注（可选）</label>
          <input class="input" id="planNote" placeholder="补充说明"></div>
        <button class="btn btn-gold" style="width:100%" onclick="addPlan()">＋添加计划</button>
      </div>
      <div class="card">
        <div class="card-title"><span class="title-icon">📋</span>${sel} 的计划
          <span style="margin-left:auto;font-size:13px;color:var(--ink-3)">${dayPlans.length} 条</span></div>
        <div class="record-list">
          ${dayPlans.length ? dayPlans.map(planRow).join('') : emptyState('🗓️', '这一天还没排计划，左边加一条')}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="title-icon">🗄️</span>已完成归档
        <span style="margin-left:auto;font-size:13px;color:var(--ink-3)">${archived.length} 条</span></div>
      <div class="record-list">
        ${archived.length ? archived.map(planRow).join('') : emptyState('🗄️', '做完的计划会自动归到这里')}
      </div>
    </div>`;
  }

  /* ---- 第四期：四象限拖拽分诊 ---- */
  let _p4DragId = null;
  function p4DragStart(ev, id) {
    _p4DragId = id;
    try {
      ev.dataTransfer.setData('text/plain', id);
      ev.dataTransfer.effectAllowed = 'move';
    } catch (e) {}
    if (ev.target && ev.target.classList) ev.target.classList.add('p4-drag');
  }
  function p4DragEnd(ev) {
    if (ev.target && ev.target.classList) ev.target.classList.remove('p4-drag');
    Array.prototype.forEach.call(document.querySelectorAll('.p4-drop'), function (el) { el.classList.remove('p4-drop'); });
    _p4DragId = null;
  }
  function p4Allow(ev, q) {
    ev.preventDefault();
    try { ev.dataTransfer.dropEffect = 'move'; } catch (e) {}
    const cell = ev.currentTarget;
    if (cell && cell.classList) cell.classList.add('p4-drop');
  }
  function p4Leave(ev) {
    const cell = ev.currentTarget;
    if (cell && cell.classList) cell.classList.remove('p4-drop');
  }
  function p4DropOn(ev, q) {
    ev.preventDefault();
    Array.prototype.forEach.call(document.querySelectorAll('.p4-drop'), function (el) { el.classList.remove('p4-drop'); });
    let id = _p4DragId;
    try { id = id || ev.dataTransfer.getData('text/plain'); } catch (e) {}
    if (!id) return;
    const s = getState();
    const t = (s.todos || []).find(function (x) { return x.id === id; });
    if (!t) return;
    _p4DragId = null;
    if (t.q === q) return;
    t.q = q;
    saveState();
    /* 铁律 9：渲染函数互不调用，统一走当前页刷新入口 */
    if (typeof window.currentPage !== 'undefined' && window.currentPage === 'dashboard') renderDashboard();
    else refreshPage('planner');
    showToast('已移到「' + QUADRANTS[q - 1].name + '」', 'success');
  }
  window.p4Toggle = p4Toggle;
  window.p4DayItems = p4DayItems;
  window.p4DragStart = p4DragStart;
  window.p4DragEnd = p4DragEnd;
  window.p4Allow = p4Allow;
  window.p4Leave = p4Leave;
  window.p4DropOn = p4DropOn;

  window.init_planner = function () {};

  /* ---------- C. 身体台账 ---------- */
  function saveBodyRecord() {
    const g = id => document.getElementById(id);
    const date = (g('bdDate') && g('bdDate').value) || todayStr();
    const weight = parseFloat(g('bdWeight') && g('bdWeight').value);
    const bf = parseFloat(g('bdBf') && g('bdBf').value);
    if (!weight || weight <= 0) { showToast('填一下体重（斤）', 'warning'); return; }
    const s = getState();
    s.body = s.body || { records: [] };
    s.body.records = s.body.records || [];
    if ((s.body.records || []).some(r => r.date === date)) {
      showToast('这一天已经记过了，要改就先删掉那条', 'warning'); return;
    }
    s.body.records.push({
      id: 'bd_' + Date.now(), date: date,
      weight: weight, bodyfat: isNaN(bf) ? null : bf,
      dayType: (g('bdType') && g('bdType').value) || '训练日',
      diet: (g('bdDiet') && g('bdDiet').value) || '标准健康饮食',
      periodDay: !!(g('bdPeriod') && g('bdPeriod').checked),
      training: (g('bdTrain') && g('bdTrain').value) || '',
      note: (g('bdNote') && g('bdNote').value) || '',
      createdAt: new Date().toISOString(),
    });
    saveState();
    const h = awardDailyHours('body', '身体台账');
    if (h) showToast('⚖️ 已记录， +' + h + ' 个修炼时辰', 'info');
    else showToast('已记录', 'success');
    navTo('exercise');
  }
  function delBodyRecord(id) {
    const s = getState();
