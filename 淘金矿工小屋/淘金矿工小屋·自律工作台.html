  <title data-page-node-id="gDtKUyTHqHFfYpPZWPg5YB" data-pnid-children="W5lzac3Z9s5RkabMombpvk">淘金矿工小屋｜自律工作台</title>
  <style data-page-node-id="AjPYSZxBHRsP83iTLO7KMM" data-pnid-children="UqE8YFcbds8FDmVAdiSCYl">
    /* ============================================
       淘金矿工小屋 - 柔和护眼·暖调低对比
       配色：浅沙土黄底 / 奶油米黄卡 / 温润暖金
       ============================================ */
    :root {
      /* 柔和基底（浅沙土黄，低饱和护眼） */
      --bg-deepest: #E9DFC9;
      --bg-dark: #EDE3CC;
      --bg-cave: #E7DCC0;
      --bg-panel: #F4ECDB;
      --bg-card: #FBF6EA;
      --bg-card-hover: #F7EFDD;
      /* 温润暖金（调低亮度与对比，非强光亮金） */
      --gold-bright: #B8893B;
      --gold: #C9A24E;
      --gold-dark: #A87C32;
      --gold-deep: #8C6A2A;
      /* 文字：深卡其棕标题 / 中度灰正文（纯黑禁用） */
      --text-cream: #6F665A;
      --text-warm: #5E5640;
      --text-gold: #B8893B;
      --text-muted: #A0927A;
      --text-dim: #B8AC94;
      /* 辅助色（柔化，降低刺眼） */
      --color-success: #7C9A6E;
      --color-danger: #C2846E;
      --color-info: #8AA0A8;
      --color-warning: #C9A24E;
      /* 边框 / 分割线：浅棕灰，弱化 */
      --line: #DDD2BC;
      --line-soft: #E8DECB;
      /* 尺寸 */
      --sidebar-w: 248px;
      --bottombar-h: 60px;
      --radius: 14px;
      --radius-sm: 10px;
      --radius-lg: 18px;
      --shadow: 0 2px 10px rgba(110, 94, 66, 0.10);
      --font-base: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --font-mono: "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-base);
      background: linear-gradient(160deg, var(--bg-dark), var(--bg-cave));
      color: var(--text-cream);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }
    /* 防止 iOS Safari 橡皮筋回弹 */
    body { position: fixed; width: 100%; overscroll-behavior-y: contain; }

    /* ============ 布局 ============ */
    .app-layout { display: flex; height: 100vh; width: 100vw; }

    /* ============ 侧边导航 ============ */
    .sidebar {
      width: var(--sidebar-w);
      background: linear-gradient(180deg, var(--bg-cave), var(--bg-dark));
      border-right: 1px solid var(--gold-deep);
      display: flex; flex-direction: column; overflow: hidden;
      flex-shrink: 0; box-shadow: 3px 0 16px rgba(110, 94, 66, 0.08);
    }
    .sidebar-header {
      padding: 18px 14px; text-align: center; border-bottom: 1px solid var(--gold-deep);
      background: rgba(184, 137, 59, 0.10); flex-shrink: 0;
    }
    .sidebar-logo {
      font-size: 20px; color: var(--gold-bright); letter-spacing: 1px; font-weight: 700;
    }
    .sidebar-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 4px; letter-spacing: 1px; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 6px 0; }
    .sidebar-nav::-webkit-scrollbar { width: 0; }
    .nav-section-title {
      padding: 14px 18px 6px; font-size: 11px; font-weight: 700;
      color: var(--gold-dark); letter-spacing: 2px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 18px;
      color: var(--text-cream); cursor: pointer; transition: background 0.2s;
      border-left: 3px solid transparent; font-size: 14px;
    }
    .nav-item:hover { background: rgba(184, 137, 59, 0.10); color: var(--gold-bright); }
    .nav-item.active {
      background: rgba(184, 137, 59, 0.18); border-left-color: var(--gold-bright);
      color: var(--gold-bright); font-weight: 600;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .nav-item .nav-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
    .nav-item .nav-badge {
      margin-left: auto; background: var(--color-danger); color: #fff; font-size: 10px;
      padding: 1px 6px; border-radius: 10px; font-weight: 700;
    }
    .nav-item .nav-coin { margin-left: auto; font-size: 11px; color: var(--gold-dark); font-weight: 600; }
    .sidebar-footer {
      padding: 10px 14px; border-top: 1px solid rgba(184, 137, 59, 0.20);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .sidebar-footer .miner-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    .sidebar-footer .miner-info { flex: 1; min-width: 0; }
    .sidebar-footer .miner-name { font-size: 13px; color: var(--text-cream); font-weight: 500; }
    .sidebar-footer .miner-level { font-size: 11px; color: var(--gold-dark); }

    /* ============ 主内容 ============ */
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .main-header {
      height: 54px; background: linear-gradient(180deg, var(--bg-cave), var(--bg-panel));
      border-bottom: 1px solid var(--gold-deep); display: flex; align-items: center;
      padding: 0 18px; gap: 12px; flex-shrink: 0;
    }
    .main-header .page-title { font-size: 18px; color: var(--gold-bright); letter-spacing: 1px; font-weight: 700; }
    .main-header .header-spacer { flex: 1; }
    .header-date { font-size: 12px; color: var(--text-muted); }
    .header-coin-display {
      display: flex; align-items: center; gap: 7px; padding: 5px 14px;
      background: rgba(184, 137, 59, 0.14); border: 1px solid var(--gold-deep); border-radius: 20px;
    }
    .header-coin-display .coin-icon { font-size: 16px; }
    .header-coin-display .coin-amount { font-size: 17px; font-weight: 700; color: var(--gold-bright); }
    .main-content {
      flex: 1; overflow-y: auto; padding: 18px; overscroll-behavior-y: contain;
      padding-bottom: calc(var(--bottombar-h) + 18px); -webkit-overflow-scrolling: touch;
    }
    .main-content::-webkit-scrollbar { width: 0; }

    /* 菜单按钮（仅移动端显示） */
    .menu-toggle {
      display: none; align-items: center; justify-content: center;
      width: 44px; height: 44px; flex-shrink: 0; cursor: pointer;
      background: rgba(184, 137, 59, 0.14); border: 1px solid var(--gold-deep);
      border-radius: var(--radius-sm); color: var(--gold-bright); font-size: 20px;
    }
    /* 移动端抽屉遮罩 */
    .sidebar-backdrop {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(60, 48, 30, 0.42);
      opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s;
    }
    .sidebar-backdrop.show { opacity: 1; visibility: visible; }
    @media (min-width: 769px) { .sidebar-backdrop { display: none !important; } }

    /* ============ 底部栏 ============ */
    .bottom-bar {
      height: var(--bottombar-h); background: linear-gradient(180deg, var(--bg-panel), var(--bg-cave));
      border-top: 1px solid var(--gold-deep); display: flex; align-items: center;
      padding: 0 14px; gap: 6px; flex-shrink: 0; overflow-x: auto;
    }
    .bottom-bar .bb-item {
      display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px;
      border-radius: var(--radius-sm); cursor: pointer; color: var(--text-cream);
      transition: background 0.2s; font-size: 13px; white-space: nowrap; flex-shrink: 0;
    }
    .bottom-bar .bb-item:hover { background: rgba(184, 137, 59, 0.14); color: var(--gold-bright); }
    .bottom-bar .bb-icon { font-size: 18px; }
    .bottom-bar .bb-divider { width: 1px; height: 24px; background: rgba(184, 137, 59, 0.18); margin: 0 2px; flex-shrink: 0; }
    .bottom-bar .bb-spacer { flex: 1; }

    /* ============ 通用组件 ============ */
    .card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px; box-shadow: var(--shadow); transition: border-color 0.3s;
    }
    .card-title {
      font-size: 16px; color: var(--gold-bright); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px; font-weight: 700;
    }
    .card-title .title-icon { font-size: 19px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 0 20px; border: none; border-radius: var(--radius-sm);
      font-family: var(--font-base); font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #FBF6EA; box-shadow: 0 2px 8px rgba(184, 137, 59, 0.22);
    }
    .btn-gold:hover { filter: brightness(1.04); }
    .btn-gold:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid var(--gold-deep); color: var(--gold-dark); }
    .btn-outline:hover { background: rgba(184, 137, 59, 0.10); color: var(--gold-bright); }
    .btn-danger { background: var(--color-danger); color: #fff; }
    .btn-sm { min-height: 38px; padding: 0 14px; font-size: 13px; }
    .btn-lg { min-height: 50px; padding: 0 30px; font-size: 16px; }
    /* 输入框（font-size>=16px 防 iOS 聚焦放大） */
    .input, .textarea, .select {
      width: 100%; background: var(--bg-dark); border: 1px solid var(--line);
      border-radius: var(--radius-sm); padding: 11px 13px; color: var(--text-cream);
      font-size: 16px; font-family: var(--font-base); transition: border-color 0.2s;
    }
    .input:focus, .textarea:focus, .select:focus {
      outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(184, 137, 59, 0.12);
    }
    .textarea { resize: vertical; min-height: 80px; }
    .input::placeholder, .textarea::placeholder { color: var(--text-dim); }
    .tag {
      display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 500;
    }
    .tag-gold { background: rgba(184, 137, 59, 0.14); color: var(--gold-bright); border: 1px solid rgba(184, 137, 59, 0.26); }
    .tag-success { background: rgba(124, 154, 110, 0.16); color: var(--color-success); border: 1px solid rgba(124, 154, 110, 0.30); }
    .tag-danger { background: rgba(194, 132, 110, 0.16); color: var(--color-danger); border: 1px solid rgba(194, 132, 110, 0.30); }
    .tag-info { background: rgba(138, 160, 168, 0.16); color: var(--color-info); border: 1px solid rgba(138, 160, 168, 0.30); }
    .progress-bar {
      width: 100%; height: 8px; background: var(--bg-dark);
      border-radius: 4px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(110, 94, 66, 0.18);
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold-bright));
      border-radius: 4px; transition: width 0.5s ease;
    }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th {
      text-align: left; padding: 9px 10px; color: var(--gold-dark); font-weight: 600;
      border-bottom: 2px solid var(--gold-deep); white-space: nowrap;
    }
    .data-table td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); color: var(--text-cream); }
    .data-table tr:hover td { background: rgba(184, 137, 59, 0.06); }
    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-5 { grid-template-columns: repeat(5, 1fr); }
    .grid-6 { grid-template-columns: repeat(6, 1fr); }

    /* ============ 首页-金矿主控 ============ */
    .assets-overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
    .asset-card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px; text-align: center; box-shadow: var(--shadow);
    }
    .asset-card .asset-icon { font-size: 30px; margin-bottom: 6px; }
    .asset-card .asset-label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
    .asset-card .asset-value {
      font-size: 30px; color: var(--gold-bright); font-weight: 700; line-height: 1;
    }
    .asset-card .asset-unit { font-size: 13px; color: var(--gold-dark); margin-left: 3px; }
    .task-quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
    .task-quick-card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; cursor: pointer; transition: all 0.25s;
    }
    .task-quick-card:hover { border-color: var(--gold); background: var(--bg-card-hover); }
    .task-quick-card .tq-header { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
    .task-quick-card .tq-icon {
      font-size: 22px; width: 38px; height: 38px; display: flex; align-items: center;
      justify-content: center; background: rgba(184, 137, 59, 0.10); border-radius: var(--radius-sm);
    }
    .task-quick-card .tq-name { font-size: 14px; color: var(--text-cream); font-weight: 500; }
    .task-quick-card .tq-coin { font-size: 12px; color: var(--gold-dark); }
    .task-quick-card .tq-status { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .task-quick-card.completed { opacity: 0.62; }
    .task-quick-card.completed .tq-icon { background: rgba(124, 154, 110, 0.12); }
    .notification-item {
      display: flex; align-items: flex-start; gap: 11px; padding: 11px;
      border-radius: var(--radius-sm); background: rgba(110, 94, 66, 0.06); margin-bottom: 7px;
    }
    .notification-item .notif-icon { font-size: 19px; flex-shrink: 0; margin-top: 1px; }
    .notification-item .notif-content { flex: 1; }
    .notification-item .notif-title { font-size: 13px; color: var(--text-cream); font-weight: 500; }
    .notification-item .notif-desc { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .notification-item .notif-time { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
    .briefing-stat {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 0; border-bottom: 1px solid var(--line-soft);
    }
    .briefing-stat:last-child { border-bottom: none; }
    .briefing-stat .bs-label { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .briefing-stat .bs-value { font-size: 16px; color: var(--gold-bright); font-weight: 600; }

    /* ============ 模块头 ============ */
    .module-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .module-header .mh-icon {
      font-size: 26px; width: 46px; height: 46px; display: flex; align-items: center;
      justify-content: center; background: rgba(184, 137, 59, 0.10);
      border: 1px solid var(--gold-deep); border-radius: var(--radius);
    }
    .module-header .mh-title { font-size: 20px; color: var(--gold-bright); font-weight: 700; }
    .module-header .mh-desc { font-size: 12px; color: var(--text-muted); }
    .module-header .mh-spacer { flex: 1; }
    .module-header .mh-coin-reward {
      display: flex; align-items: center; gap: 6px; padding: 6px 13px;
      background: rgba(184, 137, 59, 0.12); border: 1px solid var(--gold-deep);
      border-radius: 20px; font-size: 14px; color: var(--gold-bright); font-weight: 600;
    }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    .form-row { display: flex; gap: 11px; }
    .form-row > * { flex: 1; }
    .image-upload {
      width: 100%; min-height: 64px; border: 1px dashed var(--gold-deep); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px;
      cursor: pointer; transition: all 0.2s; background: var(--bg-dark); color: var(--text-muted);
      padding: 10px; word-break: break-all; text-align: center; font-size: 13px;
    }
    .image-upload:hover { border-color: var(--gold); color: var(--gold-dark); background: rgba(184, 137, 59, 0.06); }
    .image-upload .upload-text { font-size: 13px; }
    .image-upload .upload-icon { font-size: 24px; }
    .record-list { max-height: 400px; overflow-y: auto; }
    .record-item {
      display: flex; align-items: center; gap: 11px; padding: 9px 11px;
      background: rgba(110, 94, 66, 0.06); border-radius: var(--radius-sm); margin-bottom: 7px;
      border-left: 3px solid var(--gold-deep);
    }
    .record-item .ri-content { flex: 1; min-width: 0; }
    .record-item .ri-title { font-size: 14px; color: var(--text-cream); }
    .record-item .ri-meta { font-size: 12px; color: var(--text-muted); }
    .record-item .ri-value { font-size: 14px; color: var(--gold-bright); font-weight: 600; flex-shrink: 0; }

    /* ============ 商城 ============ */
    .shop-tabs { display: flex; gap: 3px; margin-bottom: 14px; border-bottom: 1px solid var(--gold-deep); overflow-x: auto; }
    .shop-tab { padding: 9px 16px; cursor: pointer; color: var(--text-muted); font-size: 14px; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
    .shop-tab:hover { color: var(--gold-dark); }
    .shop-tab.active { color: var(--gold-bright); border-bottom-color: var(--gold-bright); font-weight: 600; }
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    .shop-item {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; text-align: center; transition: all 0.25s;
    }
    .shop-item:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: var(--shadow); }
    .shop-item .si-image { font-size: 44px; margin-bottom: 6px; min-height: 56px; display: flex; align-items: center; justify-content: center; }
    .shop-item .si-name { font-size: 14px; color: var(--text-cream); font-weight: 500; margin-bottom: 4px; }
    .shop-item .si-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; min-height: 30px; }
    .shop-item .si-price {
      display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 17px;
      color: var(--gold-bright); font-weight: 700; margin-bottom: 8px;
    }
    .shop-item .si-owned {
      position: absolute; top: 7px; right: 7px; font-size: 10px; padding: 2px 7px;
      background: rgba(124, 154, 110, 0.18); color: var(--color-success); border-radius: 10px;
    }

    /* ============ 小屋 ============ */
    .cabin-layout { display: grid; grid-template-columns: 1fr 260px; gap: 14px; }
    .cabin-canvas {
      background: linear-gradient(135deg, var(--bg-cave), var(--bg-dark));
      border: 1px solid var(--gold-deep); border-radius: var(--radius);
      min-height: 360px; padding: 14px; display: grid;
      grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(4, 1fr); gap: 6px;
    }
    .cabin-tile {
      background: rgba(184, 137, 59, 0.06); border: 1px dashed rgba(184, 137, 59, 0.18);
      border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; min-height: 70px; position: relative; padding: 4px;
    }
    .cabin-tile:hover { background: rgba(184, 137, 59, 0.12); border-color: var(--gold); }
    .cabin-tile.has-item { background: rgba(184, 137, 59, 0.10); border-style: solid; border-color: rgba(184, 137, 59, 0.28); }
    .cabin-tile .tile-furniture { font-size: clamp(20px, 5vw, 34px); text-align: center; }
    .cabin-tile .tile-label { position: absolute; bottom: 2px; font-size: 9px; color: var(--text-muted); }
    .cabin-inventory { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; max-height: 420px; overflow-y: auto; }
    .cabin-inv-item {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px;
      background: rgba(110, 94, 66, 0.06); border-radius: var(--radius-sm); margin-bottom: 6px;
      cursor: pointer; transition: all 0.2s;
    }
    .cabin-inv-item:hover { background: rgba(184, 137, 59, 0.10); }
    .cabin-inv-item.selected { background: rgba(184, 137, 59, 0.14); border: 1px solid var(--gold); }
    .cabin-inv-item .cii-icon { font-size: 22px; }
    .cabin-inv-item .cii-name { font-size: 13px; color: var(--text-cream); flex: 1; }
    .cabin-inv-item .cii-count { font-size: 12px; color: var(--text-muted); }

    /* ============ 宠物 ============ */
    .pet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .pet-card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-lg);
      padding: 18px; text-align: center; transition: all 0.3s;
    }
    .pet-card:hover { border-color: var(--gold); box-shadow: var(--shadow); }
    .pet-avatar { font-size: 50px; margin-bottom: 6px; }
    .pet-name { font-size: 17px; color: var(--gold-bright); margin-bottom: 3px; font-weight: 700; }
    .pet-type { font-size: 12px; color: var(--text-muted); margin-bottom: 11px; }
    .pet-stats { text-align: left; margin-bottom: 11px; }
    .pet-stat { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .pet-stat .ps-label { font-size: 12px; color: var(--text-muted); width: 46px; flex-shrink: 0; }
    .pet-stat .ps-bar { flex: 1; height: 9px; background: var(--bg-dark); border-radius: 5px; overflow: hidden; }
    .pet-stat .ps-fill { height: 100%; border-radius: 5px; transition: width 0.5s; }
    .ps-fill.hunger { background: linear-gradient(90deg, #C99A6E, #C9A24E); }
    .ps-fill.mood { background: linear-gradient(90deg, #9CB07C, #7C9A6E); }
    .ps-fill.health { background: linear-gradient(90deg, #8AA0A8, #6E8C98); }
    .pet-stat .ps-value { font-size: 11px; color: var(--text-muted); width: 26px; text-align: right; }
    .pet-actions { display: flex; gap: 6px; justify-content: center; }
    .pet-action-btn {
      padding: 8px 11px; border: 1px solid var(--gold-deep); background: transparent;
      color: var(--gold-dark); border-radius: var(--radius-sm); cursor: pointer; font-size: 12px;
      display: flex; align-items: center; gap: 4px; min-height: 40px;
    }
    .pet-action-btn:hover { background: rgba(184, 137, 59, 0.10); color: var(--gold-bright); }
    .pet-action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ============ 成就 ============ */
    .achievement-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .achievement-card {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; display: flex; gap: 11px; transition: all 0.25s;
    }
    .achievement-card.unlocked { border-color: var(--gold); background: linear-gradient(135deg, rgba(184, 137, 59, 0.06), var(--bg-card)); }
    .achievement-card.locked { opacity: 0.6; }
    .ach-icon {
      font-size: 32px; flex-shrink: 0; width: 46px; height: 46px; display: flex;
      align-items: center; justify-content: center; background: rgba(184, 137, 59, 0.10); border-radius: 50%;
    }
    .achievement-card.unlocked .ach-icon { background: rgba(184, 137, 59, 0.16); }
    .ach-info { flex: 1; }
    .ach-name { font-size: 14px; color: var(--gold-bright); font-weight: 600; margin-bottom: 2px; }
    .ach-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .ach-reward { font-size: 12px; color: var(--gold-dark); }

    /* ============ 背包 ============ */
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 11px; }
    .inv-item {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 11px; text-align: center; transition: all 0.2s;
    }
    .inv-item:hover { border-color: var(--gold); transform: translateY(-1px); }
    .inv-item .ii-icon { font-size: 32px; margin-bottom: 3px; }
    .inv-item .ii-name { font-size: 12px; color: var(--text-cream); margin-bottom: 2px; }
    .inv-item .ii-count { font-size: 11px; color: var(--gold-dark); }

    /* ============ 模态框 ============ */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(94, 86, 64, 0.45); display: none;
      align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(3px);
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: linear-gradient(135deg, var(--bg-panel), var(--bg-cave)); border: 1px solid var(--gold-deep);
      border-radius: var(--radius-lg); padding: 20px; max-width: 480px; width: 100%;
      max-height: 82vh; overflow-y: auto;
    }
    .modal-title { font-size: 18px; color: var(--gold-bright); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
    .modal-close { cursor: pointer; font-size: 22px; color: var(--text-muted); }
    .modal-close:hover { color: var(--color-danger); }

    /* 金币飞入动画 */
    @keyframes coinFly { 0% { transform: scale(0) rotate(0); opacity: 0; } 50% { transform: scale(1.25) rotate(180deg); opacity: 1; } 100% { transform: scale(1) rotate(360deg); opacity: 1; } }
    .coin-anim { animation: coinFly 0.6s ease-out; }

    /* Toast */
    .toast-container { position: fixed; top: 64px; right: 14px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; max-width: 80vw; }
    .toast {
      background: linear-gradient(135deg, var(--bg-panel), var(--bg-cave)); border: 1px solid var(--gold-deep);
      border-radius: var(--radius-sm); padding: 11px 16px; color: var(--text-cream); font-size: 14px;
      box-shadow: 0 3px 14px rgba(110, 94, 66, 0.30); display: flex; align-items: center; gap: 9px;
      animation: toastSlide 0.3s ease-out; min-width: 180px;
    }
    .toast.success { border-left: 4px solid var(--color-success); }
    .toast.warning { border-left: 4px solid var(--color-warning); }
    .toast.danger { border-left: 4px solid var(--color-danger); }
    .toast.info { border-left: 4px solid var(--color-info); }
    @keyframes toastSlide { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* 空状态 */
    .empty-state { text-align: center; padding: 36px 18px; color: var(--text-dim); }
    .empty-state .es-icon { font-size: 44px; margin-bottom: 10px; opacity: 0.6; }
    .empty-state .es-text { font-size: 14px; }

    /* 单词卡 */
    .word-card {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-panel)); border: 1px solid var(--gold-deep);
      border-radius: var(--radius-lg); padding: 20px; text-align: center; margin-bottom: 14px;
    }
    .word-card .wc-word { font-size: 30px; font-weight: 700; color: var(--gold-bright); margin-bottom: 6px; }
    .word-card .wc-phonetic { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; font-style: italic; }
    .word-card .wc-meaning { font-size: 16px; color: var(--text-cream); margin-bottom: 14px; }

    /* 副业工坊结果 */
    .generated-content { background: var(--bg-dark); border: 1px solid var(--gold-deep); border-radius: var(--radius-sm); padding: 14px; margin-top: 12px; }
    .generated-section { margin-bottom: 14px; }
    .generated-section:last-child { margin-bottom: 0; }
    .generated-section .gs-title { font-size: 13px; color: var(--gold-dark); font-weight: 600; margin-bottom: 5px; }
    .generated-section .gs-content { font-size: 13px; color: var(--text-cream); line-height: 1.8; white-space: pre-wrap; }

    /* 报表 */
    .report-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; margin-bottom: 18px; }
    .report-stat { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
    .report-stat .rs-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .report-stat .rs-value { font-size: 22px; color: var(--gold-bright); font-weight: 700; }

    /* 设置 */
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--line-soft); gap: 12px; }
    .setting-row:last-child { border-bottom: none; }
    .setting-row .sr-label { font-size: 14px; color: var(--text-cream); }
    .setting-row .sr-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .toggle {
      width: 44px; height: 26px; background: var(--bg-dark); border: 1px solid var(--gold-deep);
      border-radius: 13px; cursor: pointer; position: relative; transition: background 0.2s; flex-shrink: 0;
    }
    .toggle.on { background: rgba(184, 137, 59, 0.22); }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
      background: var(--text-muted); border-radius: 50%; transition: all 0.2s;
    }
    .toggle.on::after { left: 20px; background: var(--gold-bright); }

    /* 页面过渡 */
    .page-content { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ============ iPhone / 移动端适配 ============ */
    @media (max-width: 1024px) {
      .assets-overview { grid-template-columns: 1fr; }
      .task-quick-grid { grid-template-columns: repeat(2, 1fr); }
      .cabin-layout { grid-template-columns: 1fr; }
      .report-summary { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {

      .menu-toggle { display: flex; }
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
        width: 82%; max-width: 300px;
        transform: translateX(-100%); transition: transform 0.3s ease;
        border-right: 1px solid var(--gold-deep);
        box-shadow: 4px 0 24px rgba(60, 48, 30, 0.28);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-header { display: block; }
      .sidebar-footer { display: flex; }
      .nav-section-title { display: none; }
      .main-content { padding: 14px; }
      .grid-2, .grid-3, .grid-4, .grid-5, .grid-6 { grid-template-columns: 1fr; }
      .task-quick-grid { grid-template-columns: 1fr; }
      .report-summary { grid-template-columns: repeat(2, 1fr); }
      .cabin-canvas { min-height: 300px; }
    }
    @media (max-width: 420px) {
      .report-summary { grid-template-columns: 1fr; }
    }
  </style>
</head>

  // ============ 工具函数 ============
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function dateStr(d) {
    if (!d) return '';
    const dt = new Date(d);
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }
  function getStreak(records) {
    if (!records || records.length === 0) return 0;
    const dates = [...new Set(records.map(r => dateStr(r.date)))].sort().reverse();
    let streak = 0;
    let checkDate = new Date();
    for (let i = 0; i < dates.length; i++) {
      const ds = dateStr(checkDate);
      if (dates.includes(ds)) {
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      } else if (i === 0) {
        checkDate.setDate(checkDate.getDate() - 1);
        if (dates.includes(dateStr(checkDate))) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else break;
      } else break;
    }
    return streak;
  }
  function getMaxStreak(state) {
    const allDates = new Set();
    Object.values(state.tasks).forEach(task => {
      if (task.records) task.records.forEach(r => allDates.add(dateStr(r.date)));
      if (task.notes) task.notes.forEach(r => allDates.add(dateStr(r.date)));
      if (task.projects) task.projects.forEach(r => allDates.add(dateStr(r.date)));
      if (task.claimDates) task.claimDates.forEach(d => allDates.add(d));
    });
    const sorted = [...allDates].sort();
    if (sorted.length === 0) return 0;
    let maxStreak = 1, currentStreak = 1;
    for (let i = 1; i < sorted.length; i++) {
      const prev = new Date(sorted[i-1]);
      const curr = new Date(sorted[i]);
      const diff = (curr - prev) / (1000 * 60 * 60 * 24);
      if (diff === 1) { currentStreak++; maxStreak = Math.max(maxStreak, currentStreak); }
      else currentStreak = 1;
    }
    return maxStreak;
  }
  function isAllTasksDoneToday(state) {
    const today = todayStr();
    return Object.keys(TASK_CONFIG).every(key => {
      const task = state.tasks[key];
      return task.claimDates && task.claimDates.includes(today);
    });
  }
  function isTaskClaimedToday(taskKey) {
    const state = getState();
    const task = state.tasks[taskKey];
    return task.claimDates && task.claimDates.includes(todayStr());
  }

  // ============ 状态管理 ============
  let _state = null;
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        _state = JSON.parse(raw);
        if (!_state.version || _state.version !== DATA_VERSION) _state = migrateState(_state);
        _state = ensureFields(_state);
      } else {
        _state = defaultState();
        saveState();
      }
      checkDailyReset();
      return _state;
    } catch (e) {
      console.error('加载数据失败:', e);
      _state = defaultState();
      saveState();
      return _state;
    }
  }
  function ensureFields(state) {
    const def = defaultState();
    for (const key in def) {
      if (def[key] && typeof def[key] === 'object' && !Array.isArray(def[key])) {
        if (!state[key]) state[key] = def[key];
        else { for (const subKey in def[key]) { if (state[key][subKey] === undefined) state[key][subKey] = def[key][subKey]; } }
      } else if (state[key] === undefined) {
        state[key] = def[key];
      }
    }
    if (!Array.isArray(state.cabin.placed)) state.cabin.placed = new Array(24).fill(null);
    return state;
  }
  function migrateState(oldState) {
    const newState = defaultState();
    newState.coins = oldState.coins || 0;
    newState.stats = oldState.stats || newState.stats;
    newState.tasks = oldState.tasks || newState.tasks;
    newState.pets = oldState.pets || [];
    newState.inventory = oldState.inventory || [];
    newState.cabin = oldState.cabin || newState.cabin;
    newState.achievements = oldState.achievements || [];
    newState.reports = oldState.reports || newState.reports;
    newState.checkinHistory = oldState.checkinHistory || [];
    newState.jianghu = oldState.jianghu || newState.jianghu;
    newState.version = DATA_VERSION;
    return newState;
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(_state)); }
    catch (e) { console.error('保存数据失败:', e); showToast('数据保存失败！请检查存储空间', 'danger'); }
  }
  function getState() { if (!_state) _state = loadState(); return _state; }
  function updateState(updater) { const state = getState(); updater(state); saveState(); }

  // ============ 每日重置 ============
  function checkDailyReset() {
    const state = getState();
    const today = todayStr();
    if (state.lastActiveDate !== today) {
      generateDailyReport(state.lastActiveDate);
      state.stats.todayEarned = 0;
      state.stats.todaySpent = 0;
      state.tasks.vocabulary.todayWords = [];
      state.tasks.vocabulary.todayWordsDate = null;
      state.tasks.amazon.todayVideoDate = null;
      state.lastActiveDate = today;
      const lastDate = new Date(state.lastActiveDate);
      const todayDate = new Date(today);
      if (lastDate.getMonth() !== todayDate.getMonth() || lastDate.getFullYear() !== todayDate.getFullYear()) {
        state.stats.monthlyEarned = 0;
        state.stats.monthlySpent = 0;
      }
      saveState();
    }
    decayPetStats();
  }

  // ============ 金币系统 ============
  function addCoins(amount, reason) {
    const state = getState();
    state.coins += amount;
    if (amount > 0) {
      state.stats.totalEarned += amount;
      state.stats.monthlyEarned = (state.stats.monthlyEarned || 0) + amount;
      state.stats.todayEarned = (state.stats.todayEarned || 0) + amount;
    } else {
      state.stats.totalSpent += Math.abs(amount);
      state.stats.monthlySpent = (state.stats.monthlySpent || 0) + Math.abs(amount);
      state.stats.todaySpent = (state.stats.todaySpent || 0) + Math.abs(amount);
    }
    saveState();
  }
  function claimTaskCoins(taskKey) {
    const state = getState();
    const task = state.tasks[taskKey];
    const today = todayStr();
    if (task.claimDates && task.claimDates.includes(today)) {
      showToast('今天已经领取过这个矿道的金币啦！', 'warning');
      return false;
    }
    const config = TASK_CONFIG[taskKey];
    addCoins(config.coinReward, `任务: ${config.name}`);
    task.claimDates = task.claimDates || [];
    task.claimDates.push(today);
    state.stats.totalClaims = (state.stats.totalClaims || 0) + 1;
    state.checkinHistory.push({ date: today, timestamp: new Date().toISOString(), taskKey, taskName: config.name, coins: config.coinReward });
    saveState();
    showToast(`⛏️💰 挖矿成功！获得 ${config.coinReward} 金币！`, 'success');
    checkAchievements();
    // 桌宠打卡动画：thinking → tool → done
    state.pets.forEach(pet => {
      if (pet.petId) PetManager.playChain(pet, true);
    });
    // 打卡的额外产出：江湖里的「修炼时辰」
    const hours = window.Jianghu ? Jianghu.earnHours(taskKey, config.name) : 0;
    if (hours) showToast(`⚔️ 换来 ${hours} 个修炼时辰，去「江湖」闭关`, 'info');
    return true;
  }

  // ============ 宠物衰减 ============
  function decayPetStats() {
    const state = getState();
    if (!state.pets || state.pets.length === 0) return;
    let changed = false;
    const now = new Date();
    state.pets.forEach(pet => {
      const last = new Date(pet.lastUpdate || pet.adoptedAt);
      const hoursPassed = (now - last) / (1000 * 60 * 60);
      if (hoursPassed >= 6) {
        const decaySteps = Math.floor(hoursPassed / 6);
        pet.hunger = Math.max(0, pet.hunger - decaySteps * 5);
        pet.mood = Math.max(0, pet.mood - decaySteps * 3);
        if (pet.hunger < 20) pet.health = Math.max(0, pet.health - decaySteps * 2);
        pet.lastUpdate = now.toISOString();
        changed = true;
      }
    });
    if (changed) saveState();
  }

  // ============ 成就检查 ============
  function checkAchievements() {
    const state = getState();
    const newlyUnlocked = [];
    ACHIEVEMENTS.forEach(ach => {
      if (!state.achievements.includes(ach.id)) {
        if (ach.check(state)) {
          state.achievements.push(ach.id);
          addCoins(ach.reward, `成就: ${ach.name}`);
          newlyUnlocked.push(ach);
        }
      }
    });
    if (newlyUnlocked.length > 0) {
      saveState();
      newlyUnlocked.forEach(ach => showToast(`🏆 成就解锁: ${ach.name}！获得 ${ach.reward} 金币`, 'success'));
    }
  }

  // ============ 日报 ============
  function generateDailyReport(date) {
    const state = getState();
    const reportDate = date || todayStr();
    const dayTasks = {};
    let dayCoinsEarned = 0, dayCoinsSpent = 0;
    Object.keys(TASK_CONFIG).forEach(key => {
      const task = state.tasks[key];
      const claimed = task.claimDates && task.claimDates.includes(reportDate);
      dayTasks[key] = { claimed, coins: claimed ? TASK_CONFIG[key].coinReward : 0 };
      if (claimed) dayCoinsEarned += TASK_CONFIG[key].coinReward;
    });
    const dietRecords = state.tasks.diet.records.filter(r => dateStr(r.date) === reportDate);
    const exerciseRecords = state.tasks.exercise.records.filter(r => dateStr(r.date) === reportDate);
    const caloriesIn = dietRecords.reduce((s, r) => s + (r.calories || 0), 0);
    const caloriesOut = exerciseRecords.reduce((s, r) => s + (r.caloriesBurned || 0), 0);
    const expenses = state.tasks.accounting.records.filter(r => dateStr(r.date) === reportDate);
    const totalExpense = expenses.reduce((s, r) => s + (r.amount || 0), 0);
    const petInteractions = state.checkinHistory.filter(h => h.date === reportDate && h.taskKey === 'pet_interact');
    const report = {
      date: reportDate,
      tasksCompleted: Object.values(dayTasks).filter(t => t.claimed).length,
      totalTasks: 6,
      coinsEarned: dayCoinsEarned, coinsSpent: dayCoinsSpent,
      caloriesIn, caloriesOut, calorieDeficit: caloriesOut - caloriesIn,
      totalExpense, expenseCount: expenses.length,
      petInteractions: petInteractions.length, taskDetails: dayTasks,
    };
    state.reports.daily = state.reports.daily || [];
    const existIdx = state.reports.daily.findIndex(r => r.date === reportDate);
    if (existIdx >= 0) state.reports.daily[existIdx] = report;
    else state.reports.daily.push(report);
    saveState();
    return report;
  }

  // ============ 周报 ============
  function generateWeeklyReport() {
    const state = getState();
    const now = new Date();
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - now.getDay());
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    const startDate = dateStr(weekStart);
    const endDate = dateStr(weekEnd);
    const dailyReports = state.reports.daily.filter(r => r.date >= startDate && r.date <= endDate);
    return {
      startDate, endDate,
      totalCoinsEarned: dailyReports.reduce((s, r) => s + r.coinsEarned, 0),
      totalTasksCompleted: dailyReports.reduce((s, r) => s + r.tasksCompleted, 0),
      avgTasksPerDay: dailyReports.length > 0 ? (dailyReports.reduce((s, r) => s + r.tasksCompleted, 0) / dailyReports.length).toFixed(1) : 0,
      totalCaloriesIn: dailyReports.reduce((s, r) => s + r.caloriesIn, 0),
      totalCaloriesOut: dailyReports.reduce((s, r) => s + r.caloriesOut, 0),
      totalExpense: dailyReports.reduce((s, r) => s + r.totalExpense, 0),
      activeDays: dailyReports.filter(r => r.tasksCompleted > 0).length,
      dailyBreakdown: dailyReports,
    };
  }

  // ============ 月报 ============
  function generateMonthlyReport() {
    const state = getState();
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const startDate = `${year}-${String(month+1).padStart(2,'0')}-01`;
    const endDate = `${year}-${String(month+1).padStart(2,'0')}-${String(new Date(year, month+1, 0).getDate()).padStart(2,'0')}`;
    const dailyReports = state.reports.daily.filter(r => r.date >= startDate && r.date <= endDate);
    return {
      year, month: month + 1, startDate, endDate,
      totalCoinsEarned: dailyReports.reduce((s, r) => s + r.coinsEarned, 0),
      totalTasksCompleted: dailyReports.reduce((s, r) => s + r.tasksCompleted, 0),
      activeDays: dailyReports.filter(r => r.tasksCompleted > 0).length,
      totalCaloriesIn: dailyReports.reduce((s, r) => s + r.caloriesIn, 0),
      totalCaloriesOut: dailyReports.reduce((s, r) => s + r.caloriesOut, 0),
      totalExpense: dailyReports.reduce((s, r) => s + r.totalExpense, 0),
      bestDay: dailyReports.reduce((best, r) => (!best || r.coinsEarned > best.coinsEarned) ? r : best, null),
      dailyBreakdown: dailyReports,
    };
  }

  /* ===== 图标渲染：emoji 原样输出，图片路径输出 <img>，桌宠输出 pet-stage 占位 ===== */
  function isImgIcon(ic) { return typeof ic === 'string' && /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(ic); }
  function isDeskpetIcon(ic) { return typeof ic === 'string' && ic.indexOf('deskpet:') === 0; }

    if (!ic) return '';
    if (isDeskpetIcon(ic)) {

      return `<div class="pet-stage" data-petid="${petId}" style="width:${size}px;height:${size}px;margin:0 auto;"></div>`;

    if (isImgIcon(ic)) {
      return `<img src="${ic}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;display:block;margin:0 auto;">`;
    }
    return ic;
  }
  /* 纯文本场景（如 <option> 不能放 <img>）：图片/桌宠图标返回空串，避免把路径当文字显示 */
  function iconText(ic) { return (typeof ic === 'string' && !isImgIcon(ic) && !isDeskpetIcon(ic)) ? ic : ''; }
  function formatDate(dateStr) { if (!dateStr) return ''; const d = new Date(dateStr); return `${d.getMonth()+1}月${d.getDate()}日`; }
  function formatTime(isoStr) { if (!isoStr) return ''; const d = new Date(isoStr); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

  // 图片转 Base64（仅本地存储，不渲染外部图片）
  function handleImageUpload(inputId, callback) {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { showToast('图片太大了，请选择2MB以下的图片', 'warning'); return; }
      const reader = new FileReader();
      reader.onload = function(ev) { callback(ev.target.result); };
      reader.readAsDataURL(file);
    };
  }

function submitDiet() {
  const meal = document.getElementById('dietMeal').value;
  const food = document.getElementById('dietFood').value.trim();
  const note = document.getElementById('dietNote').value.trim();
  const manualCal = document.getElementById('dietManualCal').value;
  const imageArea = document.getElementById('dietUploadArea');
  const image = imageArea.dataset.image || '';

  if (!food) {
    showToast('请输入食物名称！', 'warning');
    return;
  }

  // 自动估算热量
  let calories = 0;
  if (manualCal) {
    calories = parseInt(manualCal);
  } else {
    const foods = food.split(/[,，、]/).map(f => f.trim());
    foods.forEach(f => {
      // 模糊匹配
      let matched = false;
      for (const key in FOOD_CALORIES) {
        if (f.includes(key) || key.includes(f)) {
          calories += FOOD_CALORIES[key];
          matched = true;
          break;
        }
      }
      if (!matched) calories += 150; // 默认估算
    });
  }

  updateState(state => {
    state.tasks.diet.records.push({
      date: new Date().toISOString(),
      meal, food, note, calories, image,
    });
  });

  showToast(`🍚 记录成功！估算热量 ${calories} kcal`, 'success');
  navTo('diet');
}

function init_exercise() {}

function submitExercise() {
  const type = document.getElementById('exType').value;
  const duration = parseInt(document.getElementById('exDuration').value);
  const weight = parseInt(document.getElementById('exWeight').value);
  const feeling = document.getElementById('exFeeling').value;
  const note = document.getElementById('exNote').value.trim();

  if (!duration || duration < 1) {
    showToast('请输入有效的运动时长！', 'warning');
    return;
  }

  // 计算消耗热量：每分钟消耗 * 时长 * (体重/60) 调整
  const baseRate = EXERCISE_CALORIES[type] || 5;
  const caloriesBurned = Math.round(baseRate * duration * (weight / 60));

  updateState(state => {
    state.tasks.exercise.records.push({
      date: new Date().toISOString(),
      type, duration, weight, feeling, note, caloriesBurned,
    });
  });

  showToast(`🏃 记录成功！消耗 ${caloriesBurned} kcal`, 'success');
  navTo('exercise');
}

function init_vocabulary() {}

function revealWord(index) {
  const meaning = document.getElementById(`wordMeaning_${index}`);
  const actions = document.getElementById(`wordActions_${index}`);
  if (meaning.style.display === 'none') {
    meaning.style.display = 'block';
    actions.innerHTML = `
      <button class="btn btn-outline btn-sm" onclick="revealWord(${index})">🙈 隐藏释义</button>
      <button class="btn btn-gold btn-sm" onclick="markWordMemorized(${index})">✅ 已记住</button>
    `;
  } else {
    meaning.style.display = 'none';
    actions.innerHTML = `<button class="btn btn-outline btn-sm" onclick="revealWord(${index})">👀 查看释义</button>`;
  }
}

function markWordMemorized(index) {
  const state = getState();
  const word = state.tasks.vocabulary.todayWords[index];
  if (!word) return;

  const existIdx = state.tasks.vocabulary.words.findIndex(w => w.word === word.word);
  if (existIdx >= 0) {
    state.tasks.vocabulary.words[existIdx].memorized = true;
  } else {
    state.tasks.vocabulary.words.push({
      ...word,
      memorized: true,
      date: new Date().toISOString(),
    });
  }
  saveState();
  showToast(`✅ "${word.word}" 已加入单词库！`, 'success');
  navTo('vocabulary');
}

function memorizeAllWords() {
  const state = getState();
  const todayWords = state.tasks.vocabulary.todayWords || [];
  let added = 0;

  todayWords.forEach(word => {
    const existIdx = state.tasks.vocabulary.words.findIndex(w => w.word === word.word);
    if (existIdx >= 0) {
      if (!state.tasks.vocabulary.words[existIdx].memorized) {
        state.tasks.vocabulary.words[existIdx].memorized = true;
        added++;
      }
    } else {
      state.tasks.vocabulary.words.push({
        ...word,
        memorized: true,
        date: new Date().toISOString(),
      });
      added++;
    }
  });

  saveState();
  if (added > 0) {
    showToast(`📖 成功背诵 ${added} 个单词！`, 'success');
  } else {
    showToast('今天的单词已经背完啦！', 'info');
  }
  navTo('vocabulary');
}

function init_shop() {}

function switchShopTab(tab) {
  _shopTab = tab;
  navTo('shop');
}

function buyShopItem(category, itemId) {
  const state = getState();
  const item = SHOP_DATA[category].find(i => i.id === itemId);
  if (!item) return;

  if (state.coins < item.price) {
    showToast('金币不足！快去挖矿赚钱吧！', 'danger');
    return;
  }

  // 检查是否已拥有
  if (category === 'pets') {
    if (state.pets.find(p => p.shopId === item.id)) {
      showToast('已经拥有这只宠物了！', 'warning');
      return;
    }
    // 购买宠物 -> 弹窗命名
    showPetNamingModal(item);
    return;
  }

  // 扣金币
  addCoins(-item.price, `购买: ${item.name}`);

  // 加入背包
  const existInv = state.inventory.find(i => i.id === item.id);
  if (existInv) {
    existInv.count++;
  } else {
    state.inventory.push({
      id: item.id,
      type: category,
      name: item.name,
      icon: item.icon,
      desc: item.desc,
      count: 1,
      effect: item.effect || null,
      size: item.size || null,
      price: item.price,
    });
  }

  saveState();
  showToast(`🛒 购买成功！${item.name} 已存入背包`, 'success');
  renderHeader();
  navTo('shop');
  checkAchievements();
}

function showPetNamingModal(petItem) {
  const content = `
    <div style="text-align:center;margin-bottom:16px;">
      <div style="font-size:56px;">${petItem.petId ? PetManager.thumb(petItem.petId, 64) : iconHtml(petItem.icon, 64)}</div>
      <div style="font-size:16px;color:var(--text-cream);margin-top:8px;">${petItem.name}</div>
      <div style="font-size:13px;color:var(--text-muted);">${petItem.desc}</div>
    </div>
    <div class="form-group">
      <label class="form-label">给宠物起个名字</label>
      <input class="input" id="petNameInput" placeholder="输入宠物名字..." maxlength="10">
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeModal()">取消</button>
      <button class="btn btn-gold" style="flex:1;" onclick="confirmAdoptPet('${petItem.id}')">🐾 确认领养 (🪙${petItem.price})</button>
    </div>
  `;
  showModal('领养宠物', content, () => {
    document.getElementById('petNameInput').focus();
  });
}

function confirmAdoptPet(petItemId) {
  const state = getState();
  const petItem = SHOP_DATA.pets.find(p => p.id === petItemId);
  if (!petItem) return;

  const name = document.getElementById('petNameInput').value.trim() || petItem.name;

  if (state.coins < petItem.price) {
    showToast('金币不足！', 'danger');
    return;
  }

  // 扣金币
  addCoins(-petItem.price, `领养宠物: ${name}`);

  // 添加宠物
  state.pets.push({
    id: 'pet_' + Date.now(),
    shopId: petItem.id,
    petId: petItem.petId,
    name,
    type: petItem.name,
    icon: petItem.icon,
    hunger: 80,
    mood: 80,
    health: 100,
    level: 1,
    exp: 0,
    adoptedAt: new Date().toISOString(),
    lastUpdate: new Date().toISOString(),
    lastInteract: null,
  });

  saveState();
  closeModal();
  showToast(`🐾 领养成功！欢迎 ${name} 加入矿工小屋！`, 'success');
  renderHeader();
  navTo('pet-yard');
  checkAchievements();
}

function init_cabin() {}

function selectFurniture(itemId) {
  _selectedFurniture = _selectedFurniture === itemId ? null : itemId;
  navTo('cabin');
}

function placeFurniture(tileIndex) {
  if (!_selectedFurniture) {
    showToast('请先从右侧选择家具！', 'info');
    return;
  }

  const state = getState();
  if (state.cabin.placed[tileIndex]) {
    showToast('这个位置已经有家具了！', 'warning');
    return;
  }

  const invItem = state.inventory.find(i => i.id === _selectedFurniture);
  if (!invItem) return;

  // 放置家具
  state.cabin.placed[tileIndex] = {
    id: invItem.id,
    name: invItem.name,
    icon: invItem.icon,
  };

  // 减少背包数量
  invItem.count--;
  if (invItem.count <= 0) {
    state.inventory = state.inventory.filter(i => i.id !== _selectedFurniture);
  }

  _selectedFurniture = null;
  saveState();
  showToast(`🪑 ${invItem.name} 已放置！`, 'success');
  navTo('cabin');
  checkAchievements();
}

function removeFurniture(tileIndex) {
  const state = getState();
  const item = state.cabin.placed[tileIndex];
  if (!item) return;

  // 放回背包
  const existInv = state.inventory.find(i => i.id === item.id);
  if (existInv) {
    existInv.count++;
  } else {
    const shopItem = SHOP_DATA.furniture.find(f => f.id === item.id);
    state.inventory.push({
      id: item.id,
      type: 'furniture',
      name: item.name,
      icon: item.icon,
      desc: shopItem ? shopItem.desc : '',
      count: 1,
    });
  }

  state.cabin.placed[tileIndex] = null;
  saveState();
  showToast(`📦 ${item.name} 已收回背包`, 'info');
  navTo('cabin');
}

// 避免渲染出失效图片，同时保持 shopId='p_bobo' 兼容（领养/互动逻辑不受影响）。
function normalizePet(pet) {
  if (!pet.petId && (pet.icon === 'images/bobo.png' || pet.shopId === 'p_bobo')) {
    pet.petId = 'huhu-carrot';
    pet.icon = 'deskpet:huhu-carrot';
  }
  return pet;
}

function interactPet(petId, action) {
  const state = getState();
  const pet = state.pets.find(p => p.id === petId);
  if (!pet) return;

  const today = todayStr();
  const interactedToday = pet.lastInteract && dateStr(pet.lastInteract) === today;

  if (action === 'feed') {
    // 检查是否有食物
    const foods = state.inventory.filter(i => i.type === 'petFood');
    if (foods.length === 0) {
      showToast('背包里没有宠物粮食！去商城购买吧', 'warning');
      return;
    }
    // 使用第一个食物
    const food = foods[0];
    if (food.effect) {
      if (food.effect.hunger) pet.hunger = Math.min(100, pet.hunger + food.effect.hunger);
      if (food.effect.mood) pet.mood = Math.min(100, pet.mood + food.effect.mood);
      if (food.effect.health) pet.health = Math.min(100, pet.health + food.effect.health);
    }
    food.count--;
    if (food.count <= 0) state.inventory = state.inventory.filter(i => i.id !== food.id);
    showToast(`🍖 喂了${pet.name}一份${food.name}！`, 'success');
  }

  if (action === 'pet') {
    if (interactedToday) {
      showToast('今天已经抚摸过啦，明天再来吧！', 'info');
      return;
    }
    pet.mood = Math.min(100, pet.mood + 15);
    pet.lastInteract = new Date().toISOString();
    // 每日互动奖励3金币
    addCoins(3, `宠物互动: ${pet.name}`);
    state.checkinHistory.push({
      date: today,
      timestamp: new Date().toISOString(),
      taskKey: 'pet_interact',
      taskName: `互动${pet.name}`,
      coins: 3,
    });
    showToast(`🤚 抚摸了${pet.name}！心情+15，获得3金币！`, 'success');
  }

  if (action === 'bath') {
    // 检查是否有泡泡浴液
    const bathItem = state.inventory.find(i => i.id === 'pp_bath');
    if (bathItem) {
      pet.health = Math.min(100, pet.health + 20);
      pet.mood = Math.min(100, pet.mood + 5);
      bathItem.count--;
      if (bathItem.count <= 0) state.inventory = state.inventory.filter(i => i.id !== bathItem.id);
      showToast(`🛁 给${pet.name}洗了个泡泡浴！健康+20`, 'success');
    } else {
      pet.health = Math.min(100, pet.health + 5);
      showToast(`🛁 给${pet.name}洗了个澡！健康+5`, 'success');
    }
  }

  // 经验增长
  pet.exp = (pet.exp || 0) + 10;
  if (pet.exp >= 100) {
    pet.level++;
    pet.exp = 0;
    showToast(`🎉 ${pet.name} 升级了！Lv.${pet.level}`, 'success');
  }

  pet.lastUpdate = new Date().toISOString();
  saveState();
  renderHeader();
  navTo('pet-yard');
  const anyCheckedToday = state.checkinHistory.some(r => dateStr(r.timestamp) === todayStr());
  PetManager.playTransient(pet, action === 'pet' ? 'review' : 'done', anyCheckedToday);
}

function useItemOnPet(itemId) {
  const state = getState();
  const item = state.inventory.find(i => i.id === itemId);
  if (!item) return;

  const selectEl = document.getElementById(`petSelect_${itemId}`);
  if (!selectEl) return;
  const petId = selectEl.value;
  const pet = state.pets.find(p => p.id === petId);
  if (!pet) return;

  if (item.effect) {
    if (item.effect.hunger) pet.hunger = Math.min(100, pet.hunger + item.effect.hunger);
    if (item.effect.mood) pet.mood = Math.min(100, pet.mood + item.effect.mood);
    if (item.effect.health) pet.health = Math.min(100, pet.health + item.effect.health);
    if (item.effect.exp) {
      pet.exp = (pet.exp || 0) + item.effect.exp;
      while (pet.exp >= 100) { pet.level++; pet.exp -= 100; }
    }
  }

  item.count--;
  if (item.count <= 0) state.inventory = state.inventory.filter(i => i.id !== itemId);

  pet.lastUpdate = new Date().toISOString();
  saveState();
  showToast(`✅ 对${pet.name}使用了${item.name}！`, 'success');
  navTo('pet-yard');
  const anyCheckedToday = state.checkinHistory.some(r => dateStr(r.timestamp) === todayStr());
  PetManager.playTransient(pet, 'done', anyCheckedToday);
}

function renderMonthlyReport() {
  const state = getState();
  const report = generateMonthlyReport();
  const daysInMonth = new Date(report.year, report.month, 0).getDate();

  // 按周分组数据
  const weeks = [];
  for (let w = 0; w < 5; w++) {
    const weekData = [];
    for (let d = 0; d < 7; d++) {
      const dayNum = w * 7 + d + 1;
      if (dayNum > daysInMonth) break;
      const ds = `${report.year}-${String(report.month).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      const dayData = report.dailyBreakdown.find(r => r.date === ds);
      weekData.push({ date: ds, day: dayNum, coins: dayData ? dayData.coinsEarned : 0, tasks: dayData ? dayData.tasksCompleted : 0 });
    }
    if (weekData.length > 0) weeks.push(weekData);
  }

  return `
    <div class="page-content">
      <div class="module-header">
        <div class="mh-icon">📈</div>
        <div>
          <div class="mh-title">挖矿月报</div>
          <div class="mh-desc">${report.year}年${report.month}月 (${report.startDate} ~ ${report.endDate})</div>
        </div>
        <div class="mh-spacer"></div>
        <button class="btn btn-outline btn-sm" onclick="navTo('report-weekly')">查看周报 →</button>
      </div>

      <div class="report-summary">
        <div class="report-stat">
          <div class="rs-label">🪙 本月金币</div>
          <div class="rs-value">${report.totalCoinsEarned}</div>
        </div>
        <div class="report-stat">
          <div class="rs-label">✅ 任务完成</div>
          <div class="rs-value">${report.totalTasksCompleted}</div>
        </div>
        <div class="report-stat">
          <div class="rs-label">📅 活跃天数</div>
          <div class="rs-value">${report.activeDays}<span style="font-size:14px;color:var(--text-muted);">/${daysInMonth}</span></div>
        </div>
        <div class="report-stat">
          <div class="rs-label">🏆 最佳日</div>
          <div class="rs-value" style="font-size:16px;">${report.bestDay ? formatDate(report.bestDay.date) + ' ' + report.bestDay.coinsEarned + '🪙' : '-'}</div>
        </div>
      </div>

      <!-- 月度热力图 -->
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title"><span class="title-icon">🔥</span>挖矿热力图</div>

          ${weeks.map(week => `
            <div style="display:flex;gap:4px;">
              ${week.map(day => {
                const intensity = day.coins > 0 ? Math.min(day.coins / 37, 1) : 0; // 37 = max possible daily coins
                const bg = day.coins === 0 ? 'rgba(218,165,32,0.05)' : `rgba(255,215,0,${0.15 + intensity * 0.6})`;

                  <div style="
                    flex:1;aspect-ratio:1;min-height:32px;

                    font-size:10px;color:${day.coins > 15 ? 'var(--bg-dark)' : 'var(--text-muted)'};

function generateMonthlyEvaluation(report, daysInMonth) {
  const evaluations = [];
  const activeRate = (report.activeDays / daysInMonth * 100).toFixed(0);

  evaluations.push(`📊 ${report.year}年${report.month}月，你共活跃了 ${report.activeDays} 天（活跃率 ${activeRate}%），完成 ${report.totalTasksCompleted} 个任务，赚取 ${report.totalCoinsEarned} 金币。`);

  if (report.activeDays >= daysInMonth * 0.8) {
    evaluations.push('🔥 全月几乎天天挖矿，堪称劳模矿工！');
  } else if (report.activeDays >= daysInMonth * 0.5) {
    evaluations.push('💪 出勤率不错，保持下去！');
  } else if (report.activeDays > 0) {
    evaluations.push('⛏️ 矿道开得不够多，下个月加油！');
  } else {
    evaluations.push('💤 这个月似乎在休假，下个月该下矿了！');
  }

  if (report.totalCaloriesOut > report.totalCaloriesIn) {
    evaluations.push(`🏃 本月热量缺口 ${report.totalCaloriesOut - report.totalCaloriesIn} kcal，减脂成果不错！`);
  }

  if (report.bestDay) {
    evaluations.push(`🏆 最佳表现日：${formatDate(report.bestDay.date)}，获得 ${report.bestDay.coinsEarned} 金币！`);
  }

  return evaluations.join('\n\n');
}

  }

  function applyToState(data) {
    _state = ensureFields(data);
    saveState();
    try { navTo(currentPage); } catch (e) {}
    try { showToast('☁️ 已从资料库同步最新数据', 'success'); } catch (e) {}
  }

  /* ---------- doPull：13 表并行拉取 → 行级对账 → 应用 ---------- */
  function doPull() {
    var data = readState();
    if (!data) { return Promise.resolve(false); }
    var rawStart = JSON.stringify(data);
    var snap = cfgLoad().snap || {};
    var localMaps = {};
    TAB_KEYS.forEach(function (tk) {
      var m = {};
      EXTRACT[tk](data).forEach(function (r) { r.hash = recHash(r); m[r.rid] = r; });
      localMaps[tk] = m;
    });
    return Promise.all(TAB_KEYS.map(function (tk) { return qAll(tk).catch(function () { return null; }); }))
      .then(function (cloudList) {
        var toApply = [], newSnap = {};
        TAB_KEYS.forEach(function (tk, i) {
          var cl = cloudList[i];
          if (!cl) { if (snap[tk]) { newSnap[tk] = snap[tk]; } return; }
          var loc = localMaps[tk];
          var s = snap[tk] || null;
          var fresh = !s;
          var eff = s;
          if (!eff) { eff = {}; Object.keys(loc).forEach(function (rid) { eff[rid] = loc[rid].hash; }); }
          var cloud = {};
          cl.forEach(function (r) { var rid = pv(r.rid); if (rid) { cloud[rid] = r; } });
          var merged = {}, changed = false;
          Object.keys(loc).forEach(function (rid) { merged[rid] = loc[rid].c; });
          Object.keys(cloud).forEach(function (rid) {
            var cc = rowCols(tk, cloud[rid]);
            var lr = loc[rid];
            if (lr) {
              if (sameContent(lr.c, cc)) { return; }
              if (lr.hash === eff[rid]) { merged[rid] = cc; changed = true; }
            } else if (!eff[rid]) { merged[rid] = cc; changed = true; }
          });
          if (s) {
            Object.keys(s).forEach(function (rid) {
              if (cloud[rid]) { return; }
              if (loc[rid] && loc[rid].hash === s[rid] && merged[rid]) { delete merged[rid]; changed = true; }
            });
          }
          var tSnap = {};
          Object.keys(merged).forEach(function (rid) {
            var cr = cloud[rid];
            if (cr && sameContent(rowCols(tk, cr), merged[rid])) { tSnap[rid] = hashStr(canon(merged[rid])); }
          });
          newSnap[tk] = tSnap;
          if (changed) { toApply.push({ tk: tk, rows: Object.keys(merged).map(function (rid) { return { rid: rid, c: merged[rid] }; }), fresh: fresh }); }
        });
        /* 应用前校验：拉取期间用户改过本机数据 → 本轮放弃，下个周期重来 */
        if (toApply.length && JSON.stringify(readState()) !== rawStart) { return false; }
        if (toApply.length) {
          toApply.forEach(function (a) { APPLY[a.tk](data, a.rows, a.fresh); });
          applyToState(data);
        }
        var c = cfgLoad();
        c.snap = newSnap;
        cfgSave(c);
        return toApply.length > 0;
      });
  }

  /* ---------- doPush：逐表最小化 upsert + 删除传播 ---------- */
  function doPush() {
    var db = sdk();
    var data = readState();
    if (!data) { return Promise.resolve(false); }
    var snap = cfgLoad().snap || {};
    var now = Date.now();
    var allOk = true;
    var jobs = TAB_KEYS.map(function (tk) {
      var rows = [];
      EXTRACT[tk](data).forEach(function (r) { r.hash = recHash(r); rows.push(r); });
      var localH = {};
      rows.forEach(function (r) { localH[r.rid] = r.hash; });
      var snapT = snap[tk] || null;
      if (snapT && sameSnap(snapT, localH)) { return Promise.resolve('skip'); }
      return qAll(tk).then(function (cl) {
        var cloud = {};
        cl.forEach(function (r) { var rid = pv(r.rid); if (rid) { cloud[rid] = r; } });
        var ops = [], confirmed = {};
        rows.forEach(function (row) {
          var cr = cloud[row.rid];
          if (cr) {
            if (sameContent(row.c, rowCols(tk, cr))) { confirmed[row.rid] = true; return; }
            if (snapT && snapT[row.rid] && row.hash === snapT[row.rid]) { return; } /* 拉取滞后，不覆盖云端新值 */
          }
          var props = serializeRow(tk, row.rid, row.c, now);
          var op;
          if (cr && pv(cr._id)) {
            var sysid = pv(cr._id);
            op = U[tk](db, sysid, props).then(function () { return true; }, function () {
              return A[tk](db, props).then(function () { return true; }, function () { return false; });
            });
          } else {
            op = A[tk](db, props).then(function () { return true; }, function () { return false; });
          }
          ops.push(op.then(function (ok) { if (ok) { confirmed[row.rid] = true; } else { allOk = false; } }));
        });
        Object.keys(cloud).forEach(function (rid) {
          if (localH[rid]) { return; }
          if (!snapT || !snapT[rid]) { return; } /* 不是本机删的，不动 */
          var sysid = pv(cloud[rid]._id);
          if (!sysid) { return; }
          ops.push(DL[tk](db, sysid).then(function () { return true; }, function () { return false; }).then(function (ok) { if (!ok) { allOk = false; } }));
        });
        return Promise.all(ops).then(function () {
          var t = {};
          Object.keys(confirmed).forEach(function (rid) { t[rid] = localH[rid]; });
          return t;
        });
      }).catch(function () { allOk = false; return null; });
    });
    return Promise.all(jobs).then(function (results) {
      if (!allOk) { return false; }
      var c = cfgLoad();
      var newSnap = c.snap || {};
      results.forEach(function (t, i) { if (t && t !== 'skip') { newSnap[TAB_KEYS[i]] = t; } });
      c.snap = newSnap;
      c.lastTs = now;
      cfgSave(c);
      return true;
    });
  }

  function hasPending() {
    var data = readState();
    if (!data) { return false; }
    var snap = cfgLoad().snap || {};
    for (var i = 0; i < TAB_KEYS.length; i++) {
      var tk = TAB_KEYS[i];
      var m = {};
      EXTRACT[tk](data).forEach(function (r) { m[r.rid] = recHash(r); });
      if (!sameSnap(snap[tk], m)) { return true; }
    }
    return false;
  }

  function pull() {
    if (!online() || _syncing) { return Promise.resolve(false); }
    _syncing = true;
    return Promise.resolve().then(function () { return doPull(); })
      .catch(function () { /* 离线 / 网络失败静默 */ })
      .then(function (applied) {
        _syncing = false;
        if (hasPending()) { try { push(); } catch (e) {} }
        return !!applied;
      });
  }

  function push() {
    if (!online() || _syncing) { return Promise.resolve(); }
    _syncing = true;
    return Promise.resolve().then(function () { return doPush(); })
      .catch(function () { /* 静默重试 */ })
      .then(function () { _syncing = false; });
  }

  function schedule() {
    if (!online() || _syncing) { return; }
    if (_timer) { clearTimeout(_timer); }
    _timer = setTimeout(function () { try { push(); } catch (e) {} }, 1200);
  }

  /* ---------- 页面 → 主表绑定标注（写 DOM 时同步 setAttribute） ---------- */
  var PAGE_DB = { dashboard: 'ast', diet: 'meal', exercise: 'wk', accounting: 'acc', vocabulary: 'voc', amazon: 'amz', xiaohongshu: 'xhs', shop: 'inv', inventory: 'inv', 'pet-yard': 'pet', cabin: 'cab', achievements: 'ach', 'checkin-history': 'chk', 'report-weekly': 'rpt', 'report-monthly': 'rpt', settings: 'ast' };
  function markBinding(page) {
    try {
      var tk = PAGE_DB[page];
      var el = document.querySelector('#mainContent .page-content');
      if (tk && el) {
        el.setAttribute('data-sp-bindable', 'database');
        el.setAttribute('data-sp-database-id', IDS[tk]);
      }
    } catch (e) {}
  }
  function wrapNav() {
    try {
      var origNav = navTo;
      navTo = function (page) {
        var r = origNav(page);
        markBinding(page);
        return r;
      };
      markBinding(currentPage);
    } catch (e) {}
  }

  /* ---------- 初始化：包一层 saveState → 防抖推送；拉取 + 订阅 ---------- */
  function init() {
    try {
      if (!online()) { return; } /* 本地直开：无 SDK，整层停用 */
      wrapNav();
      var origSave = saveState;
      saveState = function () {
        origSave();
        try { schedule(); } catch (e) {}
      };
      /* 主脚本 initApp 挂在 DOMContentLoaded（晚于本层执行），等 _state 就绪后再首拉 */
      var bootTries = 100;
      function bootPull() {
        if (readState()) { pull().catch(function () {}); }
        else if (bootTries-- > 0) { setTimeout(bootPull, 100); }
      }
      setTimeout(bootPull, 80);
      setInterval(function () { try { pull(); } catch (e) {} }, 30000);
      var db0 = sdk();
      if (db0 && typeof db0.onUpdated === 'function') {
        db0.onUpdated(function () {
          if (_pullTimer) { clearTimeout(_pullTimer); }
          _pullTimer = setTimeout(function () { try { pull(); } catch (e) {} }, 300);
        });
      }
    } catch (e) { /* 同步层任何异常不影响页面功能 */ }
  }

  init();
})();
</script>
