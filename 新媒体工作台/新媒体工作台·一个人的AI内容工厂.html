function exportAllData() {
  const payload = {
    app: '新媒体工作台',
    version: 1,
    exportedAt: nowIso(),
    data: S.data,
    meta: { seededAt: S.meta.seededAt, lastHotAt: S.meta.lastHotAt, demo: S.meta.demo },
  };
  downloadText(`新媒体工作台-数据-${todayKey()}.json`, JSON.stringify(payload, null, 2));
  toast('已导出 JSON 备份', 'ok');
}

async function importAllData(file) {
  if (!file) return;
  try {
    const text = await file.text();
    const p = JSON.parse(text);
    if (!p || !p.data || typeof p.data !== 'object') throw new Error('文件结构不对');
    let merged = 0;
    for (const t of TABLES) {
      for (const raw of (Array.isArray(p.data[t]) ? p.data[t] : [])) {
        const row = normalizeRow(t, raw);
        if (!row) continue;
        const local = findRow(t, row.rid);
        if (!local || row.updatedAt > local.updatedAt) {
          const i = S.data[t].findIndex((r) => r.rid === row.rid);
          if (i >= 0) S.data[t][i] = row; else S.data[t].push(row);
          markDirty(t, row.rid, row.updatedAt, false, true);
          merged += 1;
        }
      }
    }
    ensureStats();
    saveLocal();
    render();
    toast(`导入完成，合并 ${merged} 条记录`, 'ok');
  } catch (e) {
    toast('导入失败：' + (e.message || '文件无法解析'), 'bad');
  }
}

async function testLLM() {
  toast('正在测试大模型连接…', '');
  await probeCloudAI();
  if (cloudAI.online) {
    try {
      await apiFetch('/api/ai/models');
      toast('云端代理正常，真实大模型可用（模型：' + (cloudAI.model || '服务端配置') + '）', 'ok');
    } catch (e) {
      toast('云端代理测试失败：' + (e.message || '未知原因'), 'bad');
    }
    return;
  }
  if (!S.settings.apiKey) { toast('云端未配置，本机也没填 API Key，当前使用本地模拟引擎', 'warn'); return; }
  const base = (S.settings.apiBase || 'https://api.openai.com/v1').replace(/\/+$/, '');
  try {
    const res = await fetch(base + '/models', { headers: { authorization: 'Bearer ' + S.settings.apiKey } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    toast('连接正常，真实大模型可用', 'ok');
  } catch (e) {
    toast('连接失败：' + (e.message || '网络或接口地址不对'), 'bad');
  }
}

/* ---------------- 弹窗 / 提示 / 事件 ---------------- */
function openModal(title, stamp, body) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-modal="true">
    <button class="modal-x" data-action="close-modal" aria-label="关闭">×</button>
    <div class="modal-head"><div class="stamp">${esc(stamp || 'Workbench')}</div><h3>${esc(title)}</h3></div>
    <div class="modal-body">${body}</div>
  </div></div>`;
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  const root = document.getElementById('modalRoot');
  if (root) root.innerHTML = '';
  document.body.style.overflow = '';
}
function toast(msg, kind) {
  const root = document.getElementById('toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  el.style.transition = 'opacity .22s ease, transform .22s ease';
  root.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 240);
  }, 2800);
}
function formError(form, msg) {
  const err = form.querySelector('.form-error');
  if (err) { err.textContent = msg; err.classList.add('show'); }
  return false;
}
function confirmDialog(title, text, yesLabel, fn) {
  S._confirm = fn;
  openModal(title, 'Confirm', `<div class="confirm-line">${text}</div>
    <div class="form-actions"><button class="btn ghost" data-action="close-modal">取消</button><button class="btn accent" data-action="confirm-yes">${esc(yesLabel || '确认')}</button></div>`);
}

function hotToTopic(hotId) {
  const h = findRow('hot', hotId);
  if (!h) return;
  const line = /小红书/.test(h.platform) ? 'short' : /抖音/.test(h.platform) ? 'drama' : /B站|视频号/.test(h.platform) ? 'voiceover' : 'long';
  const existing = S.data.topic.find((t) => t.title === h.title || t.hot_id === h.rid);
  if (existing) {
    h.status = 'used';
    h.updatedAt = nowIso();
    upsertLocal('hot', h, { dirty: true, stamp: false, user: true });
    toast('这条热点已经在选题池里了', 'warn');
    render();
    return;
  }
  const topic = normalizeRow('topic', {
    rid: `topic|hot|${h.rid}`, updatedAt: nowIso(), title: h.title, line,
    note: `来自${h.platform}热点，热度 ${fmt(h.heat)}。建议从一个具体的人或场景切入。`,
    source: h.platform, hot_id: h.rid, status: 'todo', created_at: nowIso(),
  });
  upsertLocal('topic', topic, { dirty: true, stamp: false, user: true });
  h.status = 'used';
  h.updatedAt = nowIso();
  upsertLocal('hot', h, { dirty: true, stamp: false, user: true });
  toast('已转成选题：' + h.title.slice(0, 18), 'ok');
  render();
}

function bindEvents() {
  document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { goView(nav.dataset.nav); return; }
    const backdrop = e.target.classList && e.target.classList.contains('modal-back');
    if (backdrop) { closeModal(); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;
    switch (action) {
      case 'close-modal': closeModal(); break;
      case 'new-topic': openNewTopicModal(); break;
      case 'line-choose': openLineChooser(); break;
      case 'line-new': openNewTaskModal(el.dataset.line || 'long'); break;
      case 'ip-new': openIpModal(''); break;
      case 'ip-edit': openIpModal(id); break;
      case 'ip-del': {
        const ip = findRow('ip', id);
        if (!ip) break;
        if (ipLocked(ip)) { toast('这个 IP 正在出演，完成把关后才能删除', 'warn'); break; }
        confirmDialog('删除 IP 形象', `确定删除「${esc(ip.name)}」？已生成的内容会保留，但不再关联这个 IP。`, '删除', () => {
          deleteLocal('ip', id, { user: true });
          toast('IP 已删除', 'ok');
          render();
        });
        break;
      }
      case 'topic-filter': S.ui.topicFilter = el.dataset.filter; renderTopics(); break;
      case 'hot-platform': S.ui.hotPlatform = el.dataset.platform; renderTopics(); break;
      case 'topic-del': {
        const t = findRow('topic', id);
        if (!t) break;
        const active = S.data.task.some((x) => x.topic_id === id && (x.status === 'queued' || x.status === 'running'));
        if (active) { toast('这个选题有任务正在运行，先等它完成', 'warn'); break; }
        confirmDialog('删除选题', `确定删除「${esc(t.title)}」？关联任务和成品会保留，可在工厂与草稿箱继续查看。`, '删除', () => {
          deleteLocal('topic', id, { user: true });
          toast('选题已删除', 'ok');
          render();
        });
        break;
      }
      case 'hot-convert': hotToTopic(id); break;
      case 'hot-refresh': {
        if (hotBusy) { toast('正在联网抓取，稍等片刻', 'warn'); break; }
        const label = el.textContent;
        el.disabled = true;
        el.textContent = '抓取中…';
        refreshHot(true).then((res) => {
          if (!res || res.busy) { toast('正在联网抓取，稍等片刻', 'warn'); return; }
          const msg = res.mode === 'live'
            ? `已联网抓取，新增 ${res.added} 条，更新 ${res.updated} 条热度`
            : res.mode === 'spark'
              ? `联网接口不可用，已从本机 spark_feed 补货（新增 ${res.added} 条）`
              : `联网与本机抓取都不可用，已用离线热点补位（新增 ${res.added} 条）`;
          toast(msg, res.mode === 'offline' ? 'warn' : 'ok');
          render();
        }).catch((err) => {
          el.disabled = false;
          el.textContent = label;
          toast('热点抓取失败：' + (err.message || '未知错误'), 'warn');
        });
        break;
      }
      case 'task-new': {
        const topic = findRow('topic', id);
        if (!topic) break;
        const active = S.data.task.find((x) => x.topic_id === id && (x.status === 'queued' || x.status === 'running'));
        if (active) { toast('这个选题已经有一个进行中的任务', 'warn'); goView('factory'); break; }
        const latest = S.data.content.filter((x) => x.topic_id === id).sort((a, b) => (b.finished_at || '').localeCompare(a.finished_at || ''))[0];
        createTask(topic, { prevContentId: latest ? latest.rid : '' });
        break;
      }
      case 'task-start': { const t = findRow('task', id); startTask(t); render(); break; }
      case 'task-retry': retryTask(findRow('task', id)); break;
      case 'goto-factory': goView('factory'); break;
      case 'goto-topics': goView('topics'); break;
      case 'open-draft': {
        if (!id || !findRow('content', id)) { toast('找不到对应的成品', 'warn'); break; }
        S.ui.draftFilter = 'all';
        S.ui.draftId = id;
        goView('drafts');
        break;
      }
      case 'draft-filter': S.ui.draftFilter = el.dataset.filter; S.ui.draftId = ''; renderDrafts(); break;
      case 'draft-select': S.ui.draftId = id; renderDrafts(); break;
      case 'draft-approve': approveContent(id); break;
      case 'draft-reject': openRejectModal(id); break;
      case 'draft-regen': {
        const c = findRow('content', id);
        if (!c) break;
        confirmDialog('再做一版', `会用同一选题和 IP 重新跑一遍「${esc(lineOf(c.line).name)}」，旧版本保留。`, '开始生成', () => regenerateContent(id));
        break;
      }
      case 'draft-export': exportKit(id); break;
      case 'publish-open': openPublishModal(id); break;
      case 'pick-radio': {
        const input = el.querySelector('input[type=radio]');
        if (input) {
          input.checked = true;
          const grid = el.parentElement;
          if (grid) grid.querySelectorAll('.radio-card').forEach((x) => x.classList.toggle('on', x === el));
        }
        break;
      }
      case 'account': openAccountModal(S.ui.authMode || 'login'); break;
      case 'auth-mode': S.ui.authMode = el.dataset.mode; openAccountModal(el.dataset.mode); break;
      case 'logout': logoutCloud(); break;
      case 'sync-now': syncNow(); break;
      case 'llm-test': testLLM(); break;
      case 'export-data': exportAllData(); break;
      case 'import-data': { const f = document.getElementById('importFile'); if (f) f.click(); break; }
      case 'confirm-yes': { const fn = S._confirm; S._confirm = null; closeModal(); if (fn) fn(); break; }
      default: break;
    }
  });

  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const kind = form.dataset.form;
    if (kind === 'login' || kind === 'register') { submitAuth(form); return; }
    if (kind === 'new-topic') {
      const title = form.title.value.trim();
      if (!title) return formError(form, '请填写选题标题');
      const t = normalizeRow('topic', {
        rid: uid('topic'), updatedAt: nowIso(), title, line: form.line.value,
        note: form.note.value.trim(), source: form.source.value.trim(), hot_id: '', status: 'todo', created_at: nowIso(),
      });
      upsertLocal('topic', t, { dirty: true, stamp: false, user: true });
      closeModal();
      S.ui.topicFilter = 'all';
      goView('topics');
      toast('新选题已加入', 'ok');
      return;
    }
    if (kind === 'new-task') {
      const topic = findRow('topic', form.topic.value);
      if (!topic) return formError(form, '请选择一个选题');
      const active = S.data.task.find((x) => x.topic_id === topic.rid && (x.status === 'queued' || x.status === 'running'));
      if (active) return formError(form, '这个选题已经有一个进行中的任务');
      const latest = S.data.content.filter((x) => x.topic_id === topic.rid).sort((a, b) => (b.finished_at || '').localeCompare(a.finished_at || ''))[0];
      const line = form.line.value;
      const ipId = form.ip.value;
      closeModal();
      createTask(topic, { line, ipId, prevContentId: latest ? latest.rid : '' });
      return;
    }
    if (kind === 'ip') {
      const name = form.name.value.trim();
      if (!name) return formError(form, '请填写 IP 名称');
      const id = form.dataset.id;
      const old = id ? findRow('ip', id) : null;
      if (old && ipLocked(old)) return formError(form, '这个 IP 正在出演，暂时不能修改');
      if (old) {
        old.name = name;
        old.persona = form.persona.value.trim();
        old.config = form.config.value.trim();
        old.updatedAt = nowIso();
        upsertLocal('ip', old, { dirty: true, stamp: false, user: true });
      } else {
        const ip = normalizeRow('ip', {
          rid: uid('ip'), updatedAt: nowIso(), name, persona: form.persona.value.trim(),
          config: form.config.value.trim(), status: 'idle', appearances: '0', created_at: nowIso(),
        });
        upsertLocal('ip', ip, { dirty: true, stamp: false, user: true });
      }
      closeModal();
      toast(old ? 'IP 已保存' : 'IP 已创建', 'ok');
      render();
      return;
    }
    if (kind === 'reject') {
      const id = form.dataset.id;
      const note = form.note.value.trim();
      if (!note) return formError(form, '写一句把关意见，下一版才知道改什么');
      rejectContent(id, note);
      return;
    }
    if (kind === 'publish') {
      const id = form.dataset.id;
      const fd = new FormData(form);
      const platform = fd.get('platform');
      const method = fd.get('method');
      if (!platform || !method) return formError(form, '请选择平台和发布方式');
      publishContent(id, String(platform), String(method));
      return;
    }
    if (kind === 'llm') {
      S.settings.apiBase = form.apiBase.value.trim();
      S.settings.apiKey = form.apiKey.value.trim();
      S.settings.model = form.model.value.trim() || 'gpt-4o-mini';
      S.settings.tone = form.tone.value;
      saveLocal();
      toast('设置已保存，下一条任务生效', 'ok');
      renderSettings();
      return;
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'importFile') {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      importAllData(file);
      return;
    }
    if (e.target.matches && e.target.matches('.radio-grid input[type=radio]')) {
      const grid = e.target.closest('.radio-grid');
      if (grid) grid.querySelectorAll('.radio-card').forEach((x) => x.classList.toggle('on', x.contains(e.target)));
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
}

/* ---------------- 启动 ---------------- */
function startTimers() {
  setInterval(tickTasks, 1000);
  setInterval(() => {
    if (ensureHot()) {
      saveLocal();
      if (S.ui.view === 'topics') renderTopics();
      else updateSyncUI();
    }
  }, 60000);
  setInterval(() => {
    if (ensureStats() && S.ui.view === 'dashboard') renderDashboard();
  }, 600000);
  setInterval(renderNav, 60000);
  startCloudTimers();
}

function init() {
  loadLocal();
  ensureSeed();
  ensureHot();
  ensureStats();
  publishShellSummary();
  const hash = (location.hash || '').replace(/^#\/?/, '');
  if (VIEWS.some((v) => v.key === hash)) S.ui.view = hash;
  bindEvents();
  render();
  startTimers();
  if (S.settings.token || S.cloud.user) checkCloudAuth();
  else {
    apiFetch('/api/auth/me').then((me) => {
      S.cloud.user = me;
      connectCloud({ silent: true });
    }).catch((e) => {
      S.cloud.status = e.status === 401 ? 'local' : 'offline';
      S.cloud.error = e.code || e.message;
      updateSyncUI();
    });
  }
  probeCloudAI().then(() => { if (S.ui.view === 'settings') render(); });
  window.addEventListener('hashchange', () => {
    const k = (location.hash || '').replace(/^#\/?/, '');
    if (VIEWS.some((v) => v.key === k) && k !== S.ui.view) { S.ui.view = k; render(); }
  });
}

init();

</script>
</body>
</html>
